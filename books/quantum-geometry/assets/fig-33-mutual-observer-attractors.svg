<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <title>万物皆为观察者与互吸引子双螺旋 / All Beings as Observers and Mutual-Attractor Double Helices</title>
  <desc>Bilingual two-panel cyberpunk-academic vector diagram: Left panel shows phase-resonant observer basins O_A (W+u_A) and O_B (W+u_B), shared window intersection W_AB = (W+u_A)∩(W+u_B), minimal-cut bridge reconnection gamma_AB, and double-helix worldline trajectories around slow crystal/ruin anchor points. Right panel shows cobweb and iterate comparison of solitary self-reference psi = cos(psi) with alternating overshoot versus symmetric mutual reference psi_A = cos(cos(psi_A)) with one-sided monotonic locking onto theta* ≈ 0.7391.</desc>

  <rect x="6" y="6" width="948" height="428" rx="14" fill="#07101b" stroke="#143049" stroke-width="2"/>
  <text x="28" y="34" font-family="JetBrains Mono,Noto Sans SC,monospace" font-size="14.5" font-weight="600" fill="#19f0ff">第 33 章 · 万物皆为观察者与互吸引子双螺旋 / CH 33 · ALL BEINGS AS OBSERVERS &amp; MUTUAL ATTRACTORS</text>
  <text x="28" y="54" font-family="JetBrains Mono,Noto Sans SC,monospace" font-size="10.2" fill="#6f8ea5">自维持记录势阱、接受窗交集极小割重联与互指单调锁死 / Pinching basins, window-overlap min-cut reconnection &amp; mutual monotonic locking</text>

  <line x1="480" y1="68" x2="480" y2="378" stroke="#143049" stroke-width="1.4"/>

  <g font-family="JetBrains Mono,Noto Sans SC,monospace">
    <!-- ==================== LEFT PANEL ==================== -->
    <text x="244" y="86" text-anchor="middle" fill="#19f0ff" font-size="11.2" font-weight="600">I · 接受窗交集与双螺旋吸引子 / WINDOW OVERLAP &amp; DOUBLE HELIX</text>
    <rect x="24" y="96" width="440" height="278" rx="8" fill="#050c16" stroke="#34506a" stroke-width="1.2"/>

    <!-- Disconnected cuts gamma_A, gamma_B (dashed) -->
    <path d="M 104 128 C 72 162, 72 204, 104 238" fill="none" stroke="#6f8ea5" stroke-width="1.2" stroke-dasharray="4,3"/>
    <path d="M 300 128 C 332 162, 332 204, 300 238" fill="none" stroke="#6f8ea5" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="72" y="122" text-anchor="middle" fill="#6f8ea5" font-size="8.4">γ_A ∪ γ_B</text>

    <!-- Reconnected minimal-cut bridge gamma_AB -->
    <path d="M 132 126 C 178 148, 226 148, 272 126" fill="none" stroke="#9d8cff" stroke-width="1.8"/>
    <path d="M 132 240 C 178 218, 226 218, 272 240" fill="none" stroke="#9d8cff" stroke-width="1.8"/>
    <text x="202" y="135" text-anchor="middle" fill="#9d8cff" font-size="8.6" font-weight="600">γ_AB 极小割重联 / Min-Cut Bridge</text>

    <!-- Polyhedral acceptance windows W + u_A and W + u_B -->
    <polygon points="112,183 136,143 184,143 224,183 184,223 136,223" fill="#07101b" fill-opacity="0.78" stroke="#19f0ff" stroke-width="1.8"/>
    <polygon points="180,183 220,143 268,143 292,183 268,223 220,223" fill="#07101b" fill-opacity="0.72" stroke="#ff2fd0" stroke-width="1.8"/>

    <!-- Shared window intersection W_AB = (W+u_A) ∩ (W+u_B) -->
    <polygon points="180,183 202,161 224,183 202,205" fill="#03060c" stroke="#ffc83d" stroke-width="2.1"/>
    <circle cx="154" cy="183" r="3.2" fill="#19f0ff"/>
    <circle cx="250" cy="183" r="3.2" fill="#ff2fd0"/>
    <circle cx="202" cy="183" r="3.2" fill="#ffc83d"/>

    <text x="144" y="175" text-anchor="middle" fill="#19f0ff" font-size="8.8" font-weight="600" font-family="New Computer Modern Math,JetBrains Mono,Noto Sans SC,monospace">𝒪_A (W+u_A)</text>
    <text x="260" y="175" text-anchor="middle" fill="#ff2fd0" font-size="8.8" font-weight="600" font-family="New Computer Modern Math,JetBrains Mono,Noto Sans SC,monospace">𝒪_B (W+u_B)</text>
    <text x="202" y="256" text-anchor="middle" fill="#ffc83d" font-size="8.8" font-weight="600">now: W_AB = (W+u_A)∩(W+u_B) · 公共现在 / Shared Now</text>

    <!-- Vertical separator to double-helix worldline column -->
    <line x1="348" y1="108" x2="348" y2="264" stroke="#143049" stroke-width="1"/>
    <text x="406" y="118" text-anchor="middle" fill="#cfe3ff" font-size="8.6" font-weight="600">双螺旋世界线 / Helix</text>
    <!-- Slow crystal/ruin anchor spine -->
    <line x1="406" y1="128" x2="406" y2="254" stroke="#34506a" stroke-width="1.4" stroke-dasharray="3,3"/>
    <polygon points="406,154 411,160 406,166 401,160" fill="#9d8cff"/>
    <polygon points="406,208 411,214 406,220 401,214" fill="#9d8cff"/>
    <!-- Intertwined observer worldlines -->
    <polyline points="406.0,134.0 413.1,138.8 419.4,143.7 424.3,148.5 427.3,153.3 428.0,158.2 426.3,163.0 422.5,167.8 417.0,172.7 410.3,177.5 403.1,182.3 396.3,187.2 390.4,192.0 386.3,196.8 384.2,201.7 384.4,206.5 386.9,211.3 391.5,216.2 397.6,221.0 404.6,225.8 411.7,230.7 418.2,235.5 423.5,240.3 426.8,245.2 428.0,250.0" fill="none" stroke="#19f0ff" stroke-width="1.9"/>
    <polyline points="406.0,134.0 398.9,138.8 392.6,143.7 387.7,148.5 384.7,153.3 384.0,158.2 385.7,163.0 389.5,167.8 395.0,172.7 401.7,177.5 408.9,182.3 415.7,187.2 421.6,192.0 425.7,196.8 427.8,201.7 427.6,206.5 425.1,211.3 420.5,216.2 414.4,221.0 407.4,225.8 400.3,230.7 393.8,235.5 388.5,240.3 385.2,245.2 384.0,250.0" fill="none" stroke="#ff2fd0" stroke-width="1.9"/>
    <text x="406" y="263" text-anchor="middle" fill="#9d8cff" font-size="8.1">慢钟锚点 / Slow Ruin</text>

    <!-- Left panel bottom epistemic ledger -->
    <line x1="36" y1="274" x2="452" y2="274" stroke="#143049" stroke-width="1.1"/>
    <text x="244" y="293" text-anchor="middle" fill="#46ffb2" font-size="9.0" font-weight="600">LEAN ✓  unreadState ∘ unreadState = unreadState  ·  记忆容量 N ≤ d</text>
    <text x="244" y="313" text-anchor="middle" fill="#46ffb2" font-size="9.0" font-weight="600">LEAN ✓  锥域内/in cone: QMaxFlow = QMinCut = min(ad, bc)  ·  客观不变量 commonFactor</text>
    <text x="244" y="333" text-anchor="middle" fill="#9d8cff" font-size="8.8" font-family="New Computer Modern Math,JetBrains Mono,Noto Sans SC,monospace">MODEL: 相位差 Δu → 0 ⟹ 接受窗交集扩张 W_AB = (W+u_A)∩(W+u_B)</text>
    <text x="244" y="353" text-anchor="middle" fill="#19f0ff" font-size="8.8" font-weight="600">MODEL: 记忆阶数连续谱 M ≥ 0  ·  众生互为移动故乡 / Walking Homelands</text>

    <!-- ==================== RIGHT PANEL ==================== -->
    <text x="716" y="86" text-anchor="middle" fill="#ff2fd0" font-size="11.2" font-weight="600">II · 孤立自指振荡 vs 互指单调锁死 / OVERSHOOT vs MONOTONIC LOCK</text>
    <rect x="496" y="96" width="440" height="278" rx="8" fill="#050c16" stroke="#34506a" stroke-width="1.2"/>

    <!-- Sub-plot A: Cobweb diagram on [0, 1.1]^2 -->
    <text x="610" y="115" text-anchor="middle" fill="#cfe3ff" font-size="8.6" font-weight="600">蛛网图 Cobweb: cos x vs cos(cos x)</text>
    <rect x="526" y="124" width="168" height="148" fill="#03060c" stroke="#143049" stroke-width="1"/>
    <!-- Diagonal y = x -->
    <line x1="526.0" y1="272.0" x2="694.0" y2="124.0" stroke="#34506a" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- y = cos(x) curve -->
    <polyline points="526.0,137.5 533.6,137.6 541.3,138.1 548.9,139.0 556.5,140.1 564.2,141.6 571.8,143.5 579.5,145.6 587.1,148.1 594.7,150.8 602.4,153.9 610.0,157.3 617.6,161.0 625.3,164.9 632.9,169.1 640.5,173.6 648.2,178.3 655.8,183.2 663.5,188.4 671.1,193.7 678.7,199.3 686.4,205.1 694.0,211.0" fill="none" stroke="#9d8cff" stroke-width="1.6"/>
    <!-- y = cos(cos(x)) curve -->
    <polyline points="526.0,199.3 533.6,199.2 541.3,198.7 548.9,198.0 556.5,197.1 564.2,195.8 571.8,194.3 579.5,192.6 587.1,190.6 594.7,188.4 602.4,186.0 610.0,183.5 617.6,180.7 625.3,177.9 632.9,174.9 640.5,171.9 648.2,168.8 655.8,165.7 663.5,162.6 671.1,159.6 678.7,156.6 686.4,153.8 694.0,151.1" fill="none" stroke="#19f0ff" stroke-width="2.0"/>
    <!-- Solitary cobweb spiral (overshooting) -->
    <polyline points="541.3,272.0 541.3,138.1 678.0,138.1 678.0,198.7 609.2,198.7 609.2,156.9 656.6,156.9 656.6,183.7 626.2,183.7 626.2,165.4 647.0,165.4" fill="none" stroke="#ff8a3c" stroke-width="1.2"/>
    <!-- Mutual cobweb staircase (monotonic) -->
    <polyline points="541.3,272.0 541.3,198.7 609.2,198.7 609.2,183.7 626.2,183.7 626.2,177.5 633.2,177.5 633.2,174.8 636.3,174.8 636.3,173.6 637.7,173.6" fill="none" stroke="#19f0ff" stroke-width="1.8"/>
    <circle cx="638.9" cy="172.6" r="3.8" fill="#9d8cff" stroke="#03060c" stroke-width="1"/>
    <text x="638" y="264" text-anchor="middle" fill="#9d8cff" font-size="8.2">θ* ≈ 0.7391</text>

    <!-- Sub-plot B: Trajectory comparison k = 0..5 -->
    <text x="821" y="115" text-anchor="middle" fill="#cfe3ff" font-size="8.6" font-weight="600">迭代序列 Iterates (k = 0..5, x₀=0.1)</text>
    <rect x="724" y="124" width="196" height="148" fill="#03060c" stroke="#143049" stroke-width="1"/>
    <!-- Equilibrium horizontal line -->
    <line x1="724" y1="172.6" x2="920" y2="172.6" stroke="#9d8cff" stroke-width="1.2" stroke-dasharray="4,3"/>
    <!-- Solitary oscillating trajectory x_{k+1} = cos x_k -->
    <polyline points="736,258.5 770,138.1 804,198.7 838,156.9 872,183.7 906,165.4" fill="none" stroke="#ff8a3c" stroke-width="1.6"/>
    <circle cx="736" cy="258.5" r="2.6" fill="#ff8a3c"/>
    <circle cx="770" cy="138.1" r="2.6" fill="#ff8a3c"/>
    <circle cx="804" cy="198.7" r="2.6" fill="#ff8a3c"/>
    <circle cx="838" cy="156.9" r="2.6" fill="#ff8a3c"/>
    <circle cx="872" cy="183.7" r="2.6" fill="#ff8a3c"/>
    <circle cx="906" cy="165.4" r="2.6" fill="#ff8a3c"/>
    <!-- Mutual monotonic trajectory y_{k+1} = cos(cos y_k) -->
    <polyline points="736,258.5 770,198.7 804,183.7 838,177.5 872,174.8 906,173.6" fill="none" stroke="#19f0ff" stroke-width="2.1"/>
    <circle cx="736" cy="258.5" r="2.8" fill="#19f0ff"/>
    <circle cx="770" cy="198.7" r="2.8" fill="#19f0ff"/>
    <circle cx="804" cy="183.7" r="2.8" fill="#19f0ff"/>
    <circle cx="838" cy="177.5" r="2.8" fill="#19f0ff"/>
    <circle cx="872" cy="174.8" r="2.8" fill="#19f0ff"/>
    <circle cx="906" cy="173.6" r="2.8" fill="#19f0ff"/>
    <text x="822" y="136" text-anchor="middle" fill="#ff8a3c" font-size="8.0">x_{k+1}=cos x_k (过冲 / Overshoot)</text>
    <text x="826" y="232" text-anchor="middle" fill="#19f0ff" font-size="8.0">y_{k+1}=cos(cos y_k) (单调 / Monotone)</text>
    <text x="822" y="264" text-anchor="middle" fill="#6f8ea5" font-size="8.0">k = 0   1   2   3   4   5</text>

    <!-- Right panel bottom analytical ledger -->
    <line x1="508" y1="280" x2="924" y2="280" stroke="#143049" stroke-width="1.1"/>
    <text x="716" y="298" text-anchor="middle" fill="#ff8a3c" font-size="8.8">MODEL · 孤立自指 Solitary: f'(θ*) = -sin θ* ≈ -0.6736 &lt; 0 (左右交替振荡)</text>
    <text x="716" y="318" text-anchor="middle" fill="#19f0ff" font-size="8.8" font-weight="600">MODEL · 对称互指 Mutual: g'(θ*) = +sin²θ* ≈ +0.4538 &gt; 0 (负负得正单侧锁死)</text>
    <text x="716" y="338" text-anchor="middle" fill="#9d8cff" font-size="8.8">MODEL · 全局压缩 sup |g'(x)| ≈ 0.4611 &lt; 1 ⇒ 无二周期分歧 (ψ_A = ψ_B = θ*)</text>
    <text x="716" y="356" text-anchor="middle" fill="#46ffb2" font-size="8.8" font-weight="600">LEAN ✓  finite_contracting_updates_stabilize: 有限单调收缩 ≤ |S(0)| 步稳定</text>
  </g>

  <!-- Bottom Formal Verification Anchor Bar -->
  <rect x="24" y="388" width="912" height="34" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1.2"/>
  <text x="480" y="409" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.0" fill="#46ffb2">LEAN ✓  finite_record_pinching_idempotent · finite_memory_history_capacity · finite_contracting_updates_stabilize · objective_claim_requires_invariant_common_factor · QuantumMaxFlowMinCut.result</text>
</svg>
