<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="p24-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
  </defs>
  <rect x="5" y="5" width="950" height="410" rx="14" fill="#03060c" stroke="#143049" stroke-width="2"/>
  <text x="34" y="40" font-family="JetBrains Mono,monospace" font-size="17" font-weight="600" fill="#19f0ff">Cosine Fixed Points &amp; Self-Reference · From cos θ* = θ* to ψ = ψ(ψ)</text>
  <text x="34" y="64" font-family="JetBrains Mono,monospace" font-size="10.2" fill="#6f8ea5">I: Dottie cobweb cos θ* = θ* &amp; algebraic residual · II: finite contracting stability &amp; context non-uniqueness · III: golden lock &amp; ψ = ψ(ψ)</text>

  <g font-family="JetBrains Mono,monospace">
    <line x1="320" y1="84" x2="320" y2="352" stroke="#143049" stroke-width="1.2"/>
    <line x1="640" y1="84" x2="640" y2="352" stroke="#143049" stroke-width="1.2"/>

    <!-- PANEL I: Dottie Cobweb Spiral cos θ* = θ* -->
    <text x="162" y="102" text-anchor="middle" fill="#19f0ff" font-size="12" font-weight="600">I · DOTTIE SPIRAL ATTRACTOR</text>
    <rect x="48" y="118" width="228" height="148" rx="6" fill="#07101b" stroke="#34506a"/>
    <line x1="68" y1="250" x2="252" y2="132" stroke="#9d8cff" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M68 140C118 142 162 170 252 222" fill="none" stroke="#ff2fd0" stroke-width="2"/>
    <!-- Cobweb staircase spiral -->
    <path d="M232 250V210H188V172H208V184H199" fill="none" stroke="#19f0ff" stroke-width="1.4"/>
    <!-- Current selection: Dottie fixed point θ* -->
    <circle cx="199" cy="180" r="5" fill="#ffc83d"/>
    <text x="162" y="286" text-anchor="middle" fill="#ffc83d" font-size="11">now: cos θ* = θ* ≈ 0.7390851332</text>
    <text x="162" y="306" text-anchor="middle" fill="#d4efff" font-size="11">Lip(cos|_{[0,1]}) = sin 1 &lt; 0.85 &lt; 1</text>
    <text x="162" y="326" text-anchor="middle" fill="#9d8cff" font-size="10">∀ q ∈ Q̄, |cos q − q| &gt; 0 (Lindemann)</text>
    <text x="162" y="344" text-anchor="middle" fill="#ff5064" font-size="10">OPEN: Schanuel ⇒ θ*, π alg. indep. / ℚ</text>

    <!-- PANEL II: Finite Contracting Updates & Context Fixed Points -->
    <text x="480" y="102" text-anchor="middle" fill="#19f0ff" font-size="12" font-weight="600">II · FINITE CONTRACTION &amp; CONTEXT</text>
    <circle cx="480" cy="182" r="56" fill="#19f0ff" fill-opacity="0.04" stroke="#34506a" stroke-dasharray="3 3"/>
    <circle cx="480" cy="182" r="40" fill="#9d8cff" fill-opacity="0.06" stroke="#9d8cff"/>
    <circle cx="480" cy="182" r="22" fill="#46ffb2" fill-opacity="0.12" stroke="#46ffb2" stroke-width="1.6"/>
    <text x="480" y="186" text-anchor="middle" fill="#46ffb2" font-size="11">S_N = S_{N+1}</text>
    <text x="480" y="256" text-anchor="middle" fill="#d4efff" font-size="9.5">[Finite X], ∀A, U(A)⊆A, S_{n+1}=U(S_n)</text>
    <text x="480" y="276" text-anchor="middle" fill="#46ffb2" font-size="9.5">⊢ ∃N≤|S₀|, ∀n≥N, S_n=S_N ∧ #{S_{n+1}≠S_n}≤|S₀|</text>
    <text x="480" y="302" text-anchor="middle" fill="#46ffb2" font-size="11">C₀ ↦ (F,F,F) ≠ (T,T,T) ↤ C₁</text>
    <text x="480" y="322" text-anchor="middle" fill="#6f8ea5" font-size="10">same text &amp; rule, distinct context meanings</text>

    <!-- PANEL III: Golden Reciprocal Fixed Point & ψ = ψ(ψ) -->
    <text x="800" y="102" text-anchor="middle" fill="#19f0ff" font-size="12" font-weight="600">III · GOLDEN LOCK &amp; ψ = ψ(ψ)</text>
    <circle cx="800" cy="182" r="56" fill="none" stroke="#9d8cff" stroke-width="1.4"/>
    <path d="M800 126C846 126 868 162 850 202C832 242 768 242 750 202C732 162 754 126 800 126" fill="none" stroke="#19f0ff" stroke-width="2"/>
    <text x="800" y="180" text-anchor="middle" fill="#d4efff" font-size="17" font-weight="600">ψ = ψ(ψ)</text>
    <text x="800" y="202" text-anchor="middle" fill="#46ffb2" font-size="11">φ = (1 + √5)/2</text>
    <text x="800" y="258" text-anchor="middle" fill="#46ffb2" font-size="11">x &gt; 0 ⊢ (1 + 1/x = x ⇔ x = φ)</text>
    <text x="800" y="280" text-anchor="middle" fill="#d4efff" font-size="11">ruler (cos) = reading (θ*)</text>
    <text x="800" y="302" text-anchor="middle" fill="#9d8cff" font-size="10">S²ⁿ map f: ∃ x, f(x)=+x or f(x)=−x</text>
    <text x="800" y="322" text-anchor="middle" fill="#6f8ea5" font-size="10">|R_{2N}(θ)| ≤ |θ|^{2N}/(2N)! seam</text>
  </g>
  <rect x="24" y="366" width="912" height="32" rx="6" fill="#050c16" stroke="#143049"/>
  <text x="480" y="387" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#46ffb2">LEAN ✓  finite_contracting_updates_stabilize · IsRelativeInterpretationFixedPoint · (F,F,F)≠(T,T,T) · x&gt;0 ⊢ (1+1/x=x ⇔ x=φ)</text>
</svg>
