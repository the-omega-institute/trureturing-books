<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <title>Lean 4 Kernel Proof Audit for Parts IV–VI and Closure of psi = psi(psi)</title>
  <desc>Three-panel diagram auditing the Lean 4 proof architecture of rank-one Born reduction, three-part Born pairing and conditional ensemble, and Lüders conditional states and unread fixed-point equivalence closing psi = psi(psi).</desc>
  <rect x="6" y="6" width="908" height="408" rx="14" fill="#0a0c12" stroke="#143049" stroke-width="2"/>
  <text x="30" y="36" font-family="JetBrains Mono,monospace" font-size="15" font-weight="600" fill="#19f0ff">CHAPTER 28 · LEAN 4 KERNEL AUDIT II &amp; CLOSURE OF ψ = ψ(ψ)</text>
  <text x="30" y="56" font-family="JetBrains Mono,monospace" font-size="10.5" fill="#6f8ea5">Rank-one Born modulus-square reduction, weighted conditional ensemble, and off-diagonal block fixed-point equivalence</text>

  <line x1="310" y1="74" x2="310" y2="356" stroke="#143049" stroke-width="1.2"/>
  <line x1="615" y1="74" x2="615" y2="356" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono,monospace">
    <!-- PANEL I: Rank-One Born Reduction -->
    <text x="158" y="92" text-anchor="middle" fill="#19f0ff" font-size="11.5" font-weight="600">I · RANK-ONE BORN REDUCTION</text>
    <rect x="24" y="106" width="268" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="158" y="126" text-anchor="middle" fill="#46ffb2" font-size="10" font-weight="600">LEAN ✓ rank_one_pure_state_...</text>
    <text x="158" y="146" text-anchor="middle" fill="#d4efff" font-size="10">P_k = φ φ*,   ρ = ψ ψ*</text>
    <text x="158" y="166" text-anchor="middle" fill="#9d8cff" font-size="9.5">vecMulVec_mul + trace_vecMulVec</text>
    <text x="158" y="186" text-anchor="middle" fill="#d4efff" font-size="10">Tr((ψψ*)(φφ*)) = (φ*·ψ)(ψ*·φ)</text>
    <text x="158" y="206" text-anchor="middle" fill="#19f0ff" font-size="10">= ((‖star φ ⬝ᵥ ψ‖² : ℝ) : ℂ)</text>
    <line x1="38" y1="222" x2="278" y2="222" stroke="#143049"/>
    <text x="158" y="242" text-anchor="middle" fill="#46ffb2" font-size="10" font-weight="600">LEAN ✓ rank_one_born_pairing_weight</text>
    <text x="158" y="262" text-anchor="middle" fill="#9d8cff" font-size="7.6" letter-spacing="-0.2">Hyp: hP : IsRecordMeasurement P, ρ.PosSemidef, Tr(ρ)=1</text>
    <text x="158" y="284" text-anchor="middle" fill="#d4efff" font-size="9.5">1) ‖φ*·ψ‖²  2) Tr(ρP_k)  3) ∑ w_j ρ_{|j}</text>
    <text x="158" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">3-conjunct bridge + 3 example probes</text>

    <!-- PANEL II: Conditional State Validity -->
    <text x="462" y="92" text-anchor="middle" fill="#ff2fd0" font-size="11.5" font-weight="600">II · LÜDERS CONDITIONAL STATE</text>
    <rect x="328" y="106" width="270" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="463" y="126" text-anchor="middle" fill="#46ffb2" font-size="10" font-weight="600">LEAN ✓ conditionalState_isState</text>
    <text x="463" y="146" text-anchor="middle" fill="#9d8cff" font-size="7.6" letter-spacing="-0.2">Hyp: hP : IsRecordMeasurement P, ρ.PosSemidef, Tr(ρ)=1</text>
    <text x="463" y="166" text-anchor="middle" fill="#d4efff" font-size="9.5">ρ_{|k} = w_k⁻¹ • (P_k ρ P_k), w_k ≠ 0</text>
    <text x="463" y="188" text-anchor="middle" fill="#d4efff" font-size="9.5">• P_k ρ P_k ≥ 0 &amp; w_k ≥ 0 ⇒ ρ_{|k} ≥ 0</text>
    <text x="463" y="208" text-anchor="middle" fill="#d4efff" font-size="9.5">• Tr(P_k ρ P_k) = w_k ⇒ Tr(ρ_{|k}) = 1</text>
    <line x1="342" y1="226" x2="584" y2="226" stroke="#143049"/>
    <text x="463" y="250" text-anchor="middle" fill="#ff2fd0" font-size="9.5">unread_eq_weighted_ensemble (189):</text>
    <text x="463" y="272" text-anchor="middle" fill="#d4efff" font-size="9.5">unreadState P ρ = ∑_j w_j • ρ_{|j}</text>
    <text x="463" y="294" text-anchor="middle" fill="#6f8ea5" font-size="9.5">w_j = 0 ⇒ P_j ρ P_j = 0 (PSD trace=0)</text>
    <text x="463" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">exact inv_mul_cancel₀ hk</text>

    <!-- PANEL III: Fixed-Point Equivalence & psi = psi(psi) -->
    <text x="764" y="92" text-anchor="middle" fill="#9d8cff" font-size="11.5" font-weight="600">III · FIXED-POINT CLOSURE</text>
    <rect x="632" y="106" width="264" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="764" y="128" text-anchor="middle" fill="#46ffb2" font-size="10" font-weight="600">LEAN ✓ unreadState_fixed_iff</text>
    <text x="764" y="148" text-anchor="middle" fill="#9d8cff" font-size="9.5">hP : IsRecordMeasurement P</text>
    <text x="764" y="168" text-anchor="middle" fill="#19f0ff" font-size="10">unreadState P ρ = ρ</text>
    <text x="764" y="186" text-anchor="middle" fill="#d4efff" font-size="10">⟺  ∀ k ≠ l,  P_k ρ P_l = 0</text>
    <!-- Active fixed-point closure highlighted in amber -->
    <rect x="646" y="200" width="236" height="60" rx="6" fill="#050c16" stroke="#ffc83d" stroke-width="1.3"/>
    <text x="764" y="218" text-anchor="middle" fill="#ffc83d" font-size="10" font-weight="600">now: SELF-REFERENTIAL FIXED POINT</text>
    <text x="764" y="238" text-anchor="middle" fill="#d4efff" font-size="10.5">ψ = ψ(ψ)  ↔  Φ_P(ρ) = ρ</text>
    <text x="764" y="253" text-anchor="middle" fill="#6f8ea5" font-size="9">eigen-blocks survive self-measurement</text>
    <text x="764" y="284" text-anchor="middle" fill="#a5b4fc" font-size="10">0 sorry · 0 unverified theorems</text>
    <text x="764" y="304" text-anchor="middle" fill="#9d8cff" font-size="9.5">Lean 4 kernel + literature + OPEN</text>
    <text x="764" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">commit 0932810a7773 (trureturing)</text>
  </g>

  <rect x="24" y="368" width="872" height="30" rx="6" fill="#050c16" stroke="#1f5d7c"/>
  <text x="460" y="388" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#46ffb2">LEAN ✓  rank_one_pure_state_modulus_square_reduction · rank_one_born_pairing_weight · conditionalState_isState · unreadState_fixed_iff</text>
</svg>
