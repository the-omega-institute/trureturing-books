<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
  <defs>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
    <marker id="arr-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/>
    </marker>
    <marker id="arr-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/>
    </marker>
    <marker id="arr-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#6f8ea5"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="872" height="292" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>

  <g stroke="#143049" stroke-width="0.7" stroke-opacity="0.55">
    <path d="M40 70H840M40 150H840M40 230H840"/>
    <path d="M150 30V270M295 30V270M445 30V270M595 30V270M740 30V270"/>
  </g>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, system-ui, sans-serif" text-anchor="middle">
    <!-- Stage 0: Point (head-on ray) -->
    <text x="82" y="44" font-size="11" fill="#6f8ea5" letter-spacing="1">STAGE 0 · 0D</text>
    <circle cx="82" cy="145" r="28" fill="none" stroke="#34506a" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="82" cy="145" r="14" fill="#19f0ff" fill-opacity="0.12" stroke="#19f0ff" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="82" cy="145" r="4.5" fill="#ffc83d"/>
    <text x="82" y="206" font-size="13" font-weight="600" fill="#d4efff">O · A = 1</text>
    <text x="82" y="226" font-size="11" fill="#ffc83d">θ = 0</text>

    <!-- Connector 0 -> 1 -->
    <line x1="122" y1="145" x2="158" y2="145" stroke="#6f8ea5" stroke-width="1.3" marker-end="url(#arr-dim)"/>

    <!-- Stage 1: Line (idempotent ray) -->
    <text x="220" y="44" font-size="11" fill="#6f8ea5" letter-spacing="1">STAGE I · 1D</text>
    <line x1="176" y1="176" x2="264" y2="114" stroke="#34506a" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="184" y1="170" x2="258" y2="118" stroke="#19f0ff" stroke-width="2.6" marker-end="url(#arr-cyan)"/>
    <circle cx="184" cy="170" r="3.2" fill="#d4efff"/>
    <text x="242" y="106" font-size="13" font-style="italic" fill="#19f0ff">A</text>
    <text x="220" y="206" font-size="13" font-weight="600" fill="#d4efff">P² = P</text>
    <text x="220" y="226" font-size="11" fill="#6f8ea5">span{A}</text>

    <!-- Connector 1 -> 2 -->
    <line x1="276" y1="145" x2="310" y2="145" stroke="#6f8ea5" stroke-width="1.3" marker-end="url(#arr-dim)"/>

    <!-- Stage 2: Plane (oriented bivector A ^ B) -->
    <text x="370" y="44" font-size="11" fill="#6f8ea5" letter-spacing="1">STAGE II · 2D</text>
    <polygon points="326,174 392,174 414,114 348,114" fill="#ff2fd0" fill-opacity="0.16" stroke="#ff2fd0" stroke-opacity="0.45" stroke-width="1"/>
    <line x1="326" y1="174" x2="392" y2="174" stroke="#19f0ff" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
    <line x1="326" y1="174" x2="352" y2="114" stroke="#ff2fd0" stroke-width="2.2" marker-end="url(#arr-mag)"/>
    <path d="M358 174 A32 32 0 0 0 339 144" fill="none" stroke="#ff2fd0" stroke-width="1.6" marker-end="url(#arr-mag)"/>
    <text x="399" y="178" font-size="12" font-style="italic" fill="#19f0ff">A</text>
    <text x="342" y="108" font-size="12" font-style="italic" fill="#ff2fd0">B</text>
    <text x="364" y="156" font-size="12" font-style="italic" fill="#d4efff">θ</text>
    <text x="370" y="206" font-size="13" font-weight="600" fill="#d4efff">A ∧ B = sin θ Î</text>
    <text x="370" y="226" font-size="11" fill="#ff2fd0">Î² = −1</text>

    <!-- Connector 2 -> 3 -->
    <line x1="426" y1="145" x2="460" y2="145" stroke="#6f8ea5" stroke-width="1.3" marker-end="url(#arr-dim)"/>

    <!-- Stage 3: Sphere (S^2 triad) -->
    <text x="520" y="44" font-size="11" fill="#6f8ea5" letter-spacing="1">STAGE III · 3D</text>
    <circle cx="520" cy="142" r="42" fill="#19f0ff" fill-opacity="0.05" stroke="#19f0ff" stroke-width="1.5"/>
    <ellipse cx="520" cy="142" rx="42" ry="14" fill="#ff2fd0" fill-opacity="0.14" stroke="#ff2fd0" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="520" y1="142" x2="520" y2="95" stroke="#ffc83d" stroke-width="2.2" marker-end="url(#arr-amb)"/>
    <line x1="520" y1="142" x2="558" y2="142" stroke="#19f0ff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
    <line x1="520" y1="142" x2="496" y2="155" stroke="#ff2fd0" stroke-width="1.8" marker-end="url(#arr-mag)"/>
    <text x="520" y="89" font-size="11" fill="#ffc83d">e₃</text>
    <text x="568" y="146" font-size="11" fill="#19f0ff">e₁</text>
    <text x="486" y="162" font-size="11" fill="#ff2fd0">e₂</text>
    <text x="520" y="206" font-size="13" font-weight="600" fill="#d4efff">S² : eᵢ · eⱼ = δᵢⱼ</text>
    <text x="520" y="226" font-size="11" fill="#6f8ea5">I₃ = e₁e₂e₃</text>

    <!-- Connector 3 -> 4 -->
    <line x1="575" y1="145" x2="609" y2="145" stroke="#6f8ea5" stroke-width="1.3" marker-end="url(#arr-dim)"/>

    <!-- Stage 4: Sphere beyond spheres -->
    <text x="668" y="44" font-size="11" fill="#6f8ea5" letter-spacing="1">STAGE IV · (n+1)D</text>
    <circle cx="668" cy="142" r="46" fill="#9d8cff" fill-opacity="0.06" stroke="#9d8cff" stroke-width="1.5" stroke-dasharray="5 3"/>
    <circle cx="668" cy="148" r="24" fill="#19f0ff" fill-opacity="0.08" stroke="#19f0ff" stroke-width="1.3"/>
    <ellipse cx="668" cy="148" rx="24" ry="8" fill="none" stroke="#19f0ff" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="668" y1="148" x2="668" y2="92" stroke="#9d8cff" stroke-width="2.3" marker-end="url(#arr-vio)"/>
    <text x="688" y="102" font-size="11" fill="#9d8cff">e₄ = ⋆₄I₃</text>
    <text x="668" y="206" font-size="13" font-weight="600" fill="#d4efff">Sⁿ⁻¹ ↪ Sⁿ</text>
    <text x="668" y="226" font-size="11" fill="#9d8cff">eₙ₊₁ ⊥ ℝⁿ</text>

    <!-- Connector 4 -> 5 -->
    <line x1="724" y1="145" x2="756" y2="145" stroke="#6f8ea5" stroke-width="1.3" marker-end="url(#arr-dim)"/>

    <!-- Stage 5: Self-referential fixed point -->
    <text x="808" y="44" font-size="11" fill="#6f8ea5" letter-spacing="1">CLOSURE · ∞</text>
    <path d="M776 168 L836 108" stroke="#34506a" stroke-width="1.3" stroke-dasharray="3 3"/>
    <path d="M774 118 Q808 118 838 164" fill="none" stroke="#19f0ff" stroke-width="2"/>
    <polyline points="780,168 780,121 822,121 822,144 804,144 804,136" fill="none" stroke="#ff2fd0" stroke-width="1.3" stroke-opacity="0.85"/>
    <circle cx="808" cy="136" r="4.5" fill="#ffc83d" stroke="#07101b" stroke-width="1.2"/>
    <text x="808" y="206" font-size="13" font-weight="600" fill="#d4efff">ψ = ψ(ψ)</text>
    <text x="808" y="226" font-size="11" fill="#19f0ff">cos θ* = θ*</text>

    <!-- Bottom summary bar -->
    <line x1="56" y1="254" x2="824" y2="254" stroke="#1f5d7c" stroke-width="1"/>
    <text x="440" y="275" font-size="12" fill="#cfe3ff">AB = A · B + A ∧ B   |   cos²θ + sin²θ = 1   |   ⋆ₙ₊₁ : Iₙ ↦ eₙ₊₁   |   θ* ≈ 0.739085…</text>
  </g>
</svg>
