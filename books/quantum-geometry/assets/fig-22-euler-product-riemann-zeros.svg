<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="p22-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
  </defs>
  <rect x="5" y="5" width="950" height="410" rx="14" fill="#03060c" stroke="#143049" stroke-width="2"/>
  <text x="34" y="40" font-family="JetBrains Mono,monospace" font-size="17" font-weight="600" fill="#19f0ff">Primes as Orthogonal Basis · Euler Product, Polyhedral Sieve &amp; Critical Line</text>
  <text x="34" y="64" font-family="JetBrains Mono,monospace" font-size="11" fill="#6f8ea5">I: Dirichlet sum = Euler product (Re(s) &gt; 1) · II: prime log-orthogonal lattice &amp; truncation sieve · III: critical strip &amp; OPEN RH</text>

  <g font-family="JetBrains Mono,monospace">
    <line x1="320" y1="84" x2="320" y2="352" stroke="#143049" stroke-width="1.2"/>
    <line x1="640" y1="84" x2="640" y2="352" stroke="#143049" stroke-width="1.2"/>

    <!-- PANEL I: Dirichlet Sum <-> Euler Product (Re(s) > 1) -->
    <text x="162" y="102" text-anchor="middle" fill="#19f0ff" font-size="12" font-weight="600">I · DIRICHLET ↔ EULER (Re(s) &gt; 1)</text>
    <rect x="46" y="118" width="232" height="156" rx="6" fill="#07101b" stroke="#34506a"/>
    <text x="162" y="150" text-anchor="middle" fill="#d4efff" font-size="15">∑_{n=1}^∞ n⁻ˢ = ζ(s)</text>
    <line x1="162" y1="162" x2="162" y2="192" stroke="#19f0ff" stroke-width="1.8" marker-end="url(#p22-cyan)"/>
    <text x="162" y="218" text-anchor="middle" fill="#ff2fd0" font-size="15">∏_{p ∈ Primes} (1 − p⁻ˢ)⁻¹</text>
    <text x="162" y="252" text-anchor="middle" fill="#46ffb2" font-size="11">lim_{s→1, s≠1} (s − 1)ζ(s) = 1</text>
    <text x="162" y="298" text-anchor="middle" fill="#d4efff" font-size="11">ln n = ∑_p v_p(n) ln p</text>
    <text x="162" y="318" text-anchor="middle" fill="#6f8ea5" font-size="10">order-independent prime factorization</text>
    <text x="162" y="336" text-anchor="middle" fill="#46ffb2" font-size="10">certified on half-plane Re(s) &gt; 1</text>

    <!-- PANEL II: Polyhedral Prime Sieve & Truncation Remainder -->
    <text x="480" y="102" text-anchor="middle" fill="#19f0ff" font-size="12" font-weight="600">II · FINITE PRIME SIEVE REMAINDER</text>
    <circle cx="412" cy="188" r="34" fill="none" stroke="#19f0ff" stroke-width="1.6"/>
    <circle cx="486" cy="188" r="24" fill="none" stroke="#9d8cff" stroke-width="1.6"/>
    <circle cx="542" cy="188" r="16" fill="none" stroke="#ff2fd0" stroke-width="1.6"/>
    <text x="412" y="192" text-anchor="middle" fill="#19f0ff" font-size="11">p=2</text>
    <text x="486" y="192" text-anchor="middle" fill="#9d8cff" font-size="11">p=3</text>
    <text x="542" y="192" text-anchor="middle" fill="#ff2fd0" font-size="10">p=5</text>
    <!-- Current truncation choice K=3 -->
    <text x="596" y="192" text-anchor="middle" fill="#ffc83d" font-size="10">now: K=3</text>
    <text x="480" y="254" text-anchor="middle" fill="#d4efff" font-size="11">P_K(s) = ∏_{k≤K} (1 − p_k⁻ˢ)⁻¹</text>
    <text x="480" y="278" text-anchor="middle" fill="#9d8cff" font-size="10.5">s ∈ (1,∞) ⊢ ζ(s) − P_K(s) &gt; p_{K+1}⁻ˢ &gt; 0</text>
    <text x="480" y="302" text-anchor="middle" fill="#6f8ea5" font-size="10">finite sieve = arithmetic polytope</text>
    <text x="480" y="322" text-anchor="middle" fill="#6f8ea5" font-size="10">leading Dirichlet term p_{K+1}⁻ˢ (p₄=7)</text>

    <!-- PANEL III: Critical Strip & OPEN Riemann Hypothesis -->
    <text x="800" y="102" text-anchor="middle" fill="#ff5064" font-size="12" font-weight="600">III · CRITICAL LINE (OPEN)</text>
    <rect x="708" y="118" width="184" height="160" rx="6" fill="#07101b" stroke="#34506a"/>
    <!-- Re(s) = 0, 1/2, 1 lines -->
    <line x1="744" y1="118" x2="744" y2="278" stroke="#34506a"/>
    <line x1="800" y1="118" x2="800" y2="278" stroke="#ff5064" stroke-width="1.6" stroke-dasharray="4 4"/>
    <line x1="856" y1="118" x2="856" y2="278" stroke="#19f0ff" stroke-width="1.4"/>
    <circle cx="800" cy="154" r="4.5" fill="#ff5064"/>
    <circle cx="800" cy="198" r="4.5" fill="#ff5064"/>
    <circle cx="800" cy="242" r="4.5" fill="#ff5064"/>
    <circle cx="856" cy="198" r="5" fill="#19f0ff"/>
    <text x="870" y="202" fill="#19f0ff" font-size="10">s=1</text>
    <text x="744" y="294" text-anchor="middle" fill="#6f8ea5" font-size="10">0</text>
    <text x="800" y="294" text-anchor="middle" fill="#ff5064" font-size="10">σ=1/2</text>
    <text x="856" y="294" text-anchor="middle" fill="#19f0ff" font-size="10">1</text>
    <text x="800" y="316" text-anchor="middle" fill="#ff5064" font-size="11">OPEN: ζ(ρ)=0 ⇒ Re(ρ)=1/2 ?</text>
    <text x="800" y="336" text-anchor="middle" fill="#6f8ea5" font-size="10">ξ(s) = ξ(1 − s) reflection axis</text>
  </g>
  <rect x="24" y="366" width="912" height="32" rx="6" fill="#050c16" stroke="#143049"/>
  <text x="480" y="387" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#46ffb2">LEAN ✓  1 &lt; Re(s) ⊢ ∑' n : ℕ, n⁻ˢ = classicalZeta s = ∏' p : Nat.Primes, (1 − p⁻ˢ)⁻¹   ·   Res_{s=1} ζ(s) = 1</text>
</svg>
