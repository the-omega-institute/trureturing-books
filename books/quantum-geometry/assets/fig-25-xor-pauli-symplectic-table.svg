<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <title>Three-Bit Blade XOR Multiplication and Pauli Matrix Correspondence</title>
  <desc>Three-panel diagram showing 3-bit Cl(3,0) blade masks with XOR multiplication and inversion sign parity, the Pauli Weyl anticommutation and no-character obstruction, and the traceless Bloch operator B(a) = a0 X + a1 Y + a2 Z.</desc>
  <rect x="6" y="6" width="908" height="408" rx="14" fill="#0a0c12" stroke="#143049" stroke-width="2"/>
  <text x="30" y="36" font-family="JetBrains Mono,monospace" font-size="15" font-weight="600" fill="#19f0ff">CHAPTER 25 · XOR–PAULI GEOMETRIC ALGEBRA ENGINE IN Cl(3,0)</text>
  <text x="30" y="56" font-family="JetBrains Mono,monospace" font-size="10.5" fill="#6f8ea5">3-bit blade masks (e₁=001₂, e₂=010₂, e₃=100₂), inversion sign parity, and 2-bit symplectic Pauli words</text>

  <line x1="310" y1="74" x2="310" y2="356" stroke="#143049" stroke-width="1.2"/>
  <line x1="615" y1="74" x2="615" y2="356" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono,monospace">
    <!-- PANEL I: 3-bit Cl(3,0) Blade Masks & XOR Multiplication -->
    <text x="158" y="92" text-anchor="middle" fill="#19f0ff" font-size="11.5" font-weight="600">I · 3-BIT BLADE XOR &amp; SIGN</text>
    <rect x="24" y="106" width="268" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="40" y="130" fill="#d4efff" font-size="10.5">000₂ : 1        (grade 0, +1)</text>
    <text x="40" y="150" fill="#19f0ff" font-size="10.5">001₂ : e₁       010₂ : e₂</text>
    <text x="40" y="170" fill="#19f0ff" font-size="10.5">100₂ : e₃       (eᵢ² = +1)</text>
    <text x="40" y="190" fill="#9d8cff" font-size="10.5">011₂ : e₁e₂     101₂ : e₁e₃</text>
    <text x="40" y="210" fill="#9d8cff" font-size="10.5">110₂ : e₂e₃     ((eᵢeⱼ)² = −1)</text>
    <text x="40" y="230" fill="#ff2fd0" font-size="10.5">111₂ : I₃=e₁e₂e₃ (I₃² = −1)</text>
    <line x1="36" y1="246" x2="280" y2="246" stroke="#143049"/>
    <!-- Current active step highlighted in amber -->
    <rect x="34" y="258" width="248" height="48" rx="6" fill="#050c16" stroke="#ffc83d" stroke-width="1.3"/>
    <text x="158" y="276" text-anchor="middle" fill="#ffc83d" font-size="10.5" font-weight="600">now: ACTIVE XOR PRODUCT</text>
    <text x="158" y="295" text-anchor="middle" fill="#d4efff" font-size="10">e₂·e₁: 010₂⊕001₂=011₂ ⇒ −e₁e₂</text>
    <text x="158" y="328" text-anchor="middle" fill="#6f8ea5" font-size="9.5">mask = left ^ right, sign = (−1)^inv</text>

    <!-- PANEL II: Weyl Pair, No Character & No Common Eigenvector -->
    <text x="462" y="92" text-anchor="middle" fill="#ff2fd0" font-size="11.5" font-weight="600">II · WEYL PAIR &amp; OBSTRUCTIONS</text>
    <rect x="328" y="106" width="270" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="463" y="130" text-anchor="middle" fill="#46ffb2" font-size="10.5" font-weight="600">LEAN ✓ qubit_weyl_star</text>
    <text x="463" y="150" text-anchor="middle" fill="#d4efff" font-size="10.5">ZX = −XZ,  X*=X,  Z*=Z</text>
    <text x="463" y="168" text-anchor="middle" fill="#d4efff" font-size="10.5">X² = 1,    Z² = 1</text>
    <line x1="342" y1="182" x2="584" y2="182" stroke="#143049"/>
    <text x="463" y="204" text-anchor="middle" fill="#46ffb2" font-size="10.5" font-weight="600">LEAN ✓ no_character</text>
    <text x="463" y="224" text-anchor="middle" fill="#9d8cff" font-size="10">IsEmpty (QubitMatrix →ₐ[ℂ] ℂ)</text>
    <text x="463" y="242" text-anchor="middle" fill="#6f8ea5" font-size="9.5">χ(X)χ(Z)=−χ(X)χ(Z) ⇒ 0=1 (⊥)</text>
    <line x1="342" y1="256" x2="584" y2="256" stroke="#143049"/>
    <text x="463" y="278" text-anchor="middle" fill="#46ffb2" font-size="10.5" font-weight="600">LEAN ✓ no_common_eigenvector</text>
    <text x="463" y="298" text-anchor="middle" fill="#d4efff" font-size="10">Xψ = xψ ∧ Zψ = zψ  ⇒  ψ = 0</text>
    <text x="463" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">pauli(x,z): mask = x | (z &lt;&lt; 1)</text>

    <!-- PANEL III: Traceless Bloch Operator B(a) -->
    <text x="764" y="92" text-anchor="middle" fill="#9d8cff" font-size="11.5" font-weight="600">III · BLOCH CORE B(a)</text>
    <rect x="632" y="106" width="264" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="764" y="130" text-anchor="middle" fill="#46ffb2" font-size="10.5" font-weight="600">LEAN ✓ B_formula_core</text>
    <text x="764" y="152" text-anchor="middle" fill="#d4efff" font-size="10.5">B(a) = a₀X + a₁Y + a₂Z</text>
    <rect x="648" y="168" width="232" height="72" rx="6" fill="#050c16" stroke="#1f5d7c"/>
    <text x="764" y="196" text-anchor="middle" fill="#19f0ff" font-size="11">[   a₂       a₀ − i a₁ ]</text>
    <text x="764" y="222" text-anchor="middle" fill="#19f0ff" font-size="11">[ a₀ + i a₁     −a₂   ]</text>
    <text x="764" y="266" text-anchor="middle" fill="#ff2fd0" font-size="10.5">e₁e₂ = I₃e₃ ↔ iZ</text>
    <text x="764" y="288" text-anchor="middle" fill="#9d8cff" font-size="10">e₂e₃ = I₃e₁ ↔ iX, e₃e₁ = I₃e₂ ↔ iY</text>
    <text x="764" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">scalarB(t, a) = t·I₂ + B(a)</text>
  </g>

  <rect x="24" y="368" width="872" height="30" rx="6" fill="#050c16" stroke="#1f5d7c"/>
  <text x="460" y="388" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#46ffb2">LEAN ✓  qubit_weyl_star · qubit_matrix_algebra_has_no_character · pauli_observables_have_no_common_eigenvector · B_formula_core</text>
</svg>
