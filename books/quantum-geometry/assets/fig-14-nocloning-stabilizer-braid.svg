<text x="727" y="252" text-anchor="middle" font-size="10" fill="#6f8ea5" >x</text>
<path d="M670 223C670 176 724 175 724 112" fill="none" stroke="#19f0ff" stroke-width="2.6"/>
<path d="M724 223C724 196 710 183 699 171" fill="none" stroke="#ff2fd0" stroke-width="2.6"/>
<path d="M690 159C677 145 670 135 670 112" fill="none" stroke="#ff2fd0" stroke-width="2.6"/>
<text x="694" y="279" text-anchor="middle" font-size="11" fill="#d4efff" >二维 / 2D</text>
<line x1="799.00" y1="215.00" x2="852.00" y2="215.00" stroke="#6f8ea5" stroke-width="1.1" marker-end="url(#f14-dim)"/>
<line x1="799.00" y1="215.00" x2="799.00" y2="113.00" stroke="#6f8ea5" stroke-width="1.1" marker-end="url(#f14-dim)"/>
<line x1="799.00" y1="215.00" x2="873.00" y2="164.00" stroke="#9d8cff" stroke-width="1.7" marker-end="url(#f14-vio)"/>
<text x="885" y="158" text-anchor="middle" font-size="12" fill="#9d8cff" >e₃</text>
<path d="M784 211C785 174 833 190 844 152C853 122 827 115 819 127" fill="none" stroke="#19f0ff" stroke-width="2.3"/>
<path d="M842 225C837 199 790 167 790 120" fill="none" stroke="#ff2fd0" stroke-width="2.3"/>
<text x="832" y="279" text-anchor="middle" font-size="11" fill="#d4efff" >三维 / 3D</text>
<text x="766" y="309" text-anchor="middle" font-size="10.5" fill="#9d8cff" >交换轨迹可绕行 / exchange bypass</text>
<text x="766" y="331" text-anchor="middle" font-size="12" fill="#d4efff" >σ₁σ₂σ₁ = σ₂σ₁σ₂</text>
<text x="766" y="352" text-anchor="middle" font-size="10.5" fill="#6f8ea5" >编织关系 / braid relation</text>
<text x="460" y="388" text-anchor="middle" font-size="11" fill="#d4efff" >只读综合征；不读取逻辑幅度。三维交换绕行 ≠ 任意绳结可解。</text>
<text x="460" y="405" text-anchor="middle" font-size="10" fill="#6f8ea5" >Syndrome parity leaves logical amplitudes unread; exchange paths differ from closed knots.</text>
</g>
</svg>
