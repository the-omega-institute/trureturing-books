<circle cx="460.00" cy="125.00" r="5" fill="#07101b" stroke="#9d8cff" stroke-width="1.4"/>
<text x="421.0" y="113" text-anchor="middle" font-size="10" fill="#9d8cff" >Z₁Z₂</text>
<line x1="460.00" y1="160.00" x2="538.00" y2="160.00" stroke="#ff2fd0" stroke-width="2"/>
<circle cx="460.00" cy="160.00" r="5" fill="#07101b" stroke="#ff2fd0" stroke-width="1.4"/>
<circle cx="538.00" cy="160.00" r="5" fill="#07101b" stroke="#ff2fd0" stroke-width="1.4"/>
<text x="499.0" y="148" text-anchor="middle" font-size="10" fill="#ff2fd0" >Z₂Z₃</text>
<circle cx="382.00" cy="125.00" r="3.2" fill="#ffc83d" stroke="#ffc83d" stroke-width="1.4"/>
<text x="460" y="213" text-anchor="middle" font-size="12" fill="#d4efff" >I     X₁    X₂    X₃</text>
<text x="460" y="237" text-anchor="middle" font-size="13" fill="#19f0ff" >++    −+    −−    +−</text>
<text x="460" y="269" text-anchor="middle" font-size="13" fill="#d4efff" >Sᵢ†Sⱼ = δᵢⱼ I</text>
<text x="460" y="296" text-anchor="middle" font-size="12" fill="#d4efff" >D(E(σ,ρ)) = Tr(σ) ρ</text>
<text x="460" y="322" text-anchor="middle" font-size="10" fill="#6f8ea5" >逻辑信息保留 / logical state retained</text>
<text x="460" y="352" text-anchor="middle" font-size="11" fill="#3dff9b" data-lean-gid="D5/S3/Quantum/Recovery/OrthogonalSyndromeDecoding.orthogonal_syndrome_recovery">LEAN ✓</text>
<text x="766" y="35" text-anchor="middle" font-size="13" fill="#19f0ff" font-weight="600">III · 二维编织 · 第三空间轴</text>
<text x="766" y="55" text-anchor="middle" font-size="10.5" fill="#6f8ea5" >PLANAR EXCHANGE + ONE SPATIAL AXIS</text>
<line x1="652.00" y1="237.00" x2="652.00" y2="89.00" stroke="#6f8ea5" stroke-width="1" marker-end="url(#f14-dim)"/>
<text x="641" y="89" text-anchor="middle" font-size="10" fill="#6f8ea5" >t</text>
