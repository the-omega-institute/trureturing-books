<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="f14-title f14-desc">
<title id="f14-title">不可克隆、综合征与编织 / No cloning, syndromes, and braids</title>
<desc id="f14-desc">Exact cloning preserves a complex overlap and squares it; the real-overlap slice is 0 or 1. Orthogonal syndrome recovery preserves a logical matrix. Planar exchange worldlines and an extra spatial direction are schematic, and do not assert that all three-dimensional knots untie.</desc>
<defs>
<marker id="f14-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/></marker>
<marker id="f14-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/></marker>
<marker id="f14-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/></marker>
<marker id="f14-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#6f8ea5"/></marker>
</defs>
<rect x="4" y="4" width="912" height="412" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
<g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, PingFang SC, system-ui, sans-serif">
<line x1="306.00" y1="24.00" x2="306.00" y2="365.00" stroke="#143049" stroke-width="1"/>
<line x1="614.00" y1="24.00" x2="614.00" y2="365.00" stroke="#143049" stroke-width="1"/>
<line x1="24.00" y1="367.00" x2="896.00" y2="367.00" stroke="#143049" stroke-width="1"/>
<text x="154" y="35" text-anchor="middle" font-size="13" fill="#19f0ff" font-weight="600">I · 不可克隆 · 内积刚性</text>
<text x="154" y="55" text-anchor="middle" font-size="10.5" fill="#6f8ea5" >NO CLONING · OVERLAP RIGIDITY</text>
<path d="M78 183L78 102L148 145Z" fill="#9d8cff" stroke="#9d8cff" stroke-width="1" fill-opacity="0.09"/>
<line x1="78.00" y1="183.00" x2="78.00" y2="102.00" stroke="#19f0ff" stroke-width="2" marker-end="url(#f14-cyan)"/>
<line x1="78.00" y1="183.00" x2="148.00" y2="145.00" stroke="#ff2fd0" stroke-width="2" marker-end="url(#f14-mag)"/>
<path d="M78 153A30 30 0 0 1 104 169" fill="none" stroke="#d4efff" stroke-width="1"/>
<text x="102" y="150" text-anchor="middle" font-size="12" fill="#d4efff" >θ</text>
<text x="76" y="91" text-anchor="middle" font-size="13" fill="#19f0ff" >φ</text>
<text x="157" y="143" text-anchor="middle" font-size="13" fill="#ff2fd0" >ψ</text>
<text x="213" y="120" text-anchor="middle" font-size="14" fill="#d4efff" >z</text>
<line x1="200.00" y1="139.00" x2="200.00" y2="177.00" stroke="#6f8ea5" stroke-width="1.6" marker-end="url(#f14-dim)"/>
<text x="213" y="195" text-anchor="middle" font-size="14" fill="#d4efff" >z²</text>
<text x="154" y="226" text-anchor="middle" font-size="12" fill="#d4efff" >U: ψ⊗b ↦ ψ⊗ψ</text>
<text x="154" y="253" text-anchor="middle" font-size="15" fill="#d4efff" >z = ⟨φ,ψ⟩ = z²</text>
<text x="154" y="281" text-anchor="middle" font-size="16" fill="#19f0ff" >z ∈ {0,1}</text>
<text x="154" y="308" text-anchor="middle" font-size="10.5" fill="#6f8ea5" >实重叠截面 / real-overlap slice</text>
<text x="154" y="331" text-anchor="middle" font-size="13" fill="#d4efff" >cos θ = cos²θ</text>
<text x="154" y="352" text-anchor="middle" font-size="11" fill="#3dff9b" data-lean-gid="D5/S3/Quantum/PureState/NoCloningInnerProductCriterion.no_cloning_inner_product_criterion">LEAN ✓</text>
<text x="460" y="35" text-anchor="middle" font-size="13" fill="#19f0ff" font-weight="600">II · 稳定子 · 正交综合征</text>
<text x="460" y="55" text-anchor="middle" font-size="10.5" fill="#6f8ea5" >STABILIZER PARITY / SYNDROME</text>
