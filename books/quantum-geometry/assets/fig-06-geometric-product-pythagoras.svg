<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <marker id="f6-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
    <marker id="f6-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/>
    </marker>
    <marker id="f6-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/>
    </marker>
    <marker id="f6-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="412" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
  <line x1="306" y1="28" x2="306" y2="352" stroke="#143049" stroke-width="1.2"/>
  <line x1="614" y1="28" x2="614" y2="352" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, system-ui, sans-serif">
    <!-- PANEL I: Geometric Product AB = A.B + A^B -->
    <text x="155" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">I · GEOMETRIC PRODUCT AB = A·B + A∧B</text>
    <text x="155" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">内积共线粒子 cos θ + 外积正交波面 sin θ I</text>

    <!-- Parallelogram A ^ B (Origin at 68, 224; A to 208, 224; B to 138, 103; A+B at 278, 103) -->
    <polygon points="68,224 208,224 278,103 138,103" fill="#9d8cff" fill-opacity="0.18" stroke="#9d8cff" stroke-width="1.3" stroke-dasharray="4 2"/>
    <text x="145" y="148" text-anchor="start" font-size="10.2" font-weight="600" fill="#9d8cff">A ∧ B = sin θ I</text>
    <text x="145" y="164" text-anchor="start" font-size="9.0" fill="#9d8cff">(波动面积 / Wave)</text>

    <!-- Perpendicular drop from B(138, 103) to A-axis at (138, 224) -->
    <line x1="138" y1="103" x2="138" y2="224" stroke="#9d8cff" stroke-width="2" stroke-dasharray="3 2"/>
    <!-- Right-angle box at (138, 224) -->
    <polyline points="138,214 148,214 148,224" fill="none" stroke="#6f8ea5" stroke-width="1.2"/>

    <!-- Reference axis A -->
    <line x1="68" y1="224" x2="220" y2="224" stroke="#34506a" stroke-width="1.6"/>
    <text x="234" y="228" font-size="12" font-weight="600" fill="#d4efff">A</text>

    <!-- Inner product projection A.B = cos theta (Cyan) -->
    <line x1="68" y1="224" x2="138" y2="224" stroke="#19f0ff" stroke-width="3.6" marker-end="url(#f6-cyan)"/>
    <text x="103" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#19f0ff">A·B = cos θ</text>
    <text x="103" y="262" text-anchor="middle" font-size="10" fill="#19f0ff">(粒子线 / Particle Line)</text>

    <!-- State vector B -->
    <line x1="68" y1="224" x2="138" y2="103" stroke="#ff2fd0" stroke-width="2.6" marker-end="url(#f6-mag)"/>
    <text x="128" y="94" font-size="12" font-weight="600" fill="#ff2fd0">B</text>
    <path d="M 102 224 A 34 34 0 0 0 85 195" fill="none" stroke="#d4efff" stroke-width="1.4"/>
    <text x="106" y="208" font-size="11" fill="#d4efff">θ</text>

    <text x="156" y="292" text-anchor="middle" font-size="9.2" fill="#46ffb2">LEAN ✓  ‖u‖²‖v‖² − ⟨u,v⟩² = ½∑ᵢⱼ(uᵢvⱼ − uⱼvᵢ)²</text>
    <text x="156" y="314" text-anchor="middle" font-size="9.2" fill="#46ffb2">LEAN ✓  ‖u‖²‖v‖² = cov² + ‖⟨[A,B]⟩/2i‖² + G (G≥0)</text>

    <!-- PANEL II: Pythagorean Complementarity Circle D^2 + V^2 = 1 -->
    <text x="460" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">II · PYTHAGOREAN CIRCLE D² + V² = 1</text>
    <text x="460" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">路径可区分度 D 与干涉可见度 V 的正交守恒</text>

    <!-- Quarter circle (Origin at 366, 232; radius 132) -->
    <line x1="366" y1="232" x2="522" y2="232" stroke="#19f0ff" stroke-width="1.8" marker-end="url(#f6-cyan)"/>
    <line x1="366" y1="232" x2="366" y2="82" stroke="#9d8cff" stroke-width="1.8" marker-end="url(#f6-vio)"/>
    <path d="M 498 232 A 132 132 0 0 0 366 100" fill="none" stroke="#19f0ff" stroke-width="2.4"/>

    <!-- Projections of active operating point alpha = 35 deg: D = sin 35 = 0.574 (x=442), V = cos 35 = 0.819 (y=124) -->
    <rect x="366" y="124" width="76" height="108" fill="#9d8cff" fill-opacity="0.10"/>
    <line x1="442" y1="124" x2="442" y2="232" stroke="#9d8cff" stroke-width="1.6" stroke-dasharray="4 2"/>
    <line x1="366" y1="124" x2="442" y2="124" stroke="#19f0ff" stroke-width="1.6" stroke-dasharray="4 2"/>

    <!-- Single selected present operating point (D, V) in Amber -->
    <line x1="366" y1="232" x2="442" y2="124" stroke="#ffc83d" stroke-width="2.8" marker-end="url(#f6-amb)"/>
    <circle cx="442" cy="124" r="5" fill="#ffc83d" stroke="#07101b" stroke-width="1.4"/>
    <text x="502" y="122" font-size="11" font-weight="600" fill="#ffc83d">当前工作点 (D, V)</text>
    <text x="502" y="138" font-size="10" fill="#ffc83d">(sin α, cos α)</text>

    <!-- Endpoints -->
    <circle cx="498" cy="232" r="4" fill="#19f0ff"/>
    <text x="506" y="220" text-anchor="start" font-size="9.5" fill="#19f0ff">(1,0) 粒子极限</text>
    <circle cx="366" cy="100" r="4" fill="#9d8cff"/>
    <text x="376" y="92" text-anchor="start" font-size="9.5" fill="#9d8cff">(0,1) 纯波极限</text>
    <text x="424" y="252" text-anchor="middle" font-size="10.2" fill="#19f0ff">D = √(1−|c|²) = sin α</text>
    <text x="358" y="168" text-anchor="end" font-size="8.8" fill="#9d8cff">V=cos α</text>

    <text x="460" y="286" text-anchor="middle" font-size="12" fill="#46ffb2">LEAN ✓  c = ⟨r_L, r_R⟩  ⇒  D² + V² = 1</text>
    <text x="460" y="308" text-anchor="middle" font-size="11" fill="#d4efff">c = 0 ⇒ (D=1, V=0)   ·   V = 1 ⇒ (D=0, V=1)</text>
    <text x="460" y="328" text-anchor="middle" font-size="11" fill="#6f8ea5">惠勒延迟选择：保留或抹除环境记录夹角 α</text>

    <!-- PANEL III: Hilbert-Schmidt Pinching Decomposition -->
    <text x="765" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#9d8cff">III · HILBERT–SCHMIDT PINCHING SPLIT</text>
    <text x="765" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">捏合投影的正交勾股分解与相干质量</text>

    <!-- Orthogonal right triangle in HS space (Origin 664, 224; Pi(rho) to 814, 224; rho to 814, 114) -->
    <polygon points="664,224 814,224 814,114" fill="#19f0ff" fill-opacity="0.08"/>
    <polyline points="802,224 802,212 814,212" fill="none" stroke="#6f8ea5" stroke-width="1.4"/>

    <!-- Horizontal leg: Diagonal pinched state Pi(rho) -->
    <line x1="664" y1="224" x2="814" y2="224" stroke="#19f0ff" stroke-width="3.2" marker-end="url(#f6-cyan)"/>
    <text x="739" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#19f0ff">Π(ρ) = diag(ρ₀₀, ρ₁₁)</text>

    <!-- Vertical leg: Off-diagonal coherence rho - Pi(rho) -->
    <line x1="814" y1="224" x2="814" y2="114" stroke="#9d8cff" stroke-width="3.2" marker-end="url(#f6-vio)"/>
    <text x="862" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#9d8cff">ρ − Π(ρ)</text>
    <text x="862" y="184" text-anchor="middle" font-size="10" fill="#9d8cff">|ρ₀₁|²+|ρ₁₀|²</text>

    <!-- Hypotenuse: Full density matrix rho -->
    <line x1="664" y1="224" x2="814" y2="114" stroke="#ff2fd0" stroke-width="2.6" marker-end="url(#f6-mag)"/>
    <text x="726" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#ff2fd0">ρ</text>

    <text x="764" y="286" text-anchor="middle" font-size="10.5" fill="#46ffb2">LEAN ✓  ⟨Π(ρ), ρ − Π(ρ)⟩_HS = 0</text>
    <text x="764" y="308" text-anchor="middle" font-size="9.5" fill="#d4efff">⟨ρ,ρ⟩_HS = ⟨Π(ρ),Π(ρ)⟩_HS + (|ρ₀₁|²+|ρ₁₀|²)</text>
    <text x="764" y="328" text-anchor="middle" font-size="10.5" fill="#6f8ea5">对角粒子布居与副对角波动相干在 HS 空间严格正交</text>

    <!-- Bottom Lean-verified bar -->
    <rect x="24" y="358" width="872" height="42" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1"/>
    <text x="460" y="375" text-anchor="middle" font-size="9.8" fill="#46ffb2">LEAN ✓  lagrange_gram_identity · robertson_schrodinger</text>
    <text x="460" y="392" text-anchor="middle" font-size="9.8" fill="#46ffb2">pure_record_distinguishability_coherence_complementarity · pinching_hilbert_schmidt_pythagorean</text>
  </g>
</svg>
