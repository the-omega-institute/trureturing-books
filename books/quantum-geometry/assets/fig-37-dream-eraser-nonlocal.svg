    <ellipse cx="404" cy="174" rx="42" ry="38" fill="#050c16" stroke="#9d8cff" stroke-width="1.6"/>
    <ellipse cx="404" cy="174" rx="26" ry="13" fill="#07101b" stroke="#34506a" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="404" y="128" text-anchor="middle" fill="#9d8cff" font-size="7.8" font-weight="600">卸载 ΔM 约束扩体</text>
    <text x="404" y="177" text-anchor="middle" fill="#cfe3ff" font-size="7.6">G₃: 0.104</text>
    <text x="404" y="203" text-anchor="middle" fill="#9d8cff" font-size="8" font-weight="600">G₂: 0.360</text>
    <text x="404" y="228" text-anchor="middle" fill="#19f0ff" font-size="7.6">斜切跨时空走廊开启</text>

    <!-- Coherent Record Reversal Loop on Right of Stage II -->
    <circle cx="468" cy="174" r="4" fill="#19f0ff"/>
    <path d="M 468 174 C 498 140, 542 140, 578 174" fill="none" stroke="#19f0ff" stroke-width="1.8"/>
    <path d="M 468 174 C 498 208, 542 208, 578 174" fill="none" stroke="#ff2fd0" stroke-width="1.8"/>
    <!-- Partial Erase Failure Branch -->
    <line x1="523" y1="198" x2="554" y2="222" stroke="#ff8a3c" stroke-width="1.3" stroke-dasharray="3,2"/>
    <text x="530" y="232" text-anchor="middle" fill="#ff8a3c" font-size="7.4">仅逆 {0}: -i/2 ≠ 1/2</text>

    <!-- Restored Coherence Node -->
    <circle cx="578" cy="174" r="5.5" fill="#46ffb2" stroke="#001318" stroke-width="1.2"/>
    <text x="526" y="128" text-anchor="middle" fill="#46ffb2" font-size="7.8" font-weight="600">reverseOn univ</text>
    <text x="524" y="177" text-anchor="middle" fill="#d4efff" font-size="7.6">u_k* u_k = 1</text>
    <text x="580" y="158" text-anchor="end" fill="#46ffb2" font-size="8" font-weight="600">ρ₀₁ = +1/2</text>

    <!-- Info Cards Panel II -->
    <rect x="348" y="248" width="264" height="56" rx="6" fill="#07101b" stroke="#9d8cff" stroke-width="1"/>
    <text x="358" y="264" fill="#9d8cff" font-size="8.4" font-weight="600">GRAM · 局部遗忘扩体 / Constraint Release</text>
    <text x="358" y="280" fill="#d4efff" font-size="7.9">det G₂ - det G₃ = c₁₂²(1-x₁²) + (x₂-c₁₂x₁)² &gt; 0</text>
    <text x="358" y="295" fill="#19f0ff" font-size="7.9">MODEL: 内禀同相斜切跨时空走廊 / Oblique slice</text>

    <rect x="348" y="312" width="264" height="58" rx="6" fill="#07101b" stroke="#46ffb2" stroke-width="1"/>
    <text x="358" y="328" fill="#46ffb2" font-size="8.4" font-weight="600">LEAN · 联合相干逆转 / Joint Reversal</text>
    <text x="358" y="344" fill="#d4efff" font-size="7.9">joint_coherent_reversal: 全副本共轭精确复原 ρ_ij</text>
    <text x="358" y="360" fill="#46ffb2" font-size="7.9">双副本证: 1/2 → -1/2 → -i/2 ({0}) / +1/2 (univ)</text>

    <!-- ==================== PANEL III: BODILESS GOLDEN SLICE & MULTILOCATION ==================== -->
    <text x="795" y="86" text-anchor="middle" fill="#9d8cff" font-size="11" font-weight="600">III · 无身黄金切片 / DELONE MULTILOCATION</text>
    <rect x="652" y="96" width="286" height="286" rx="8" fill="#050c16" stroke="#34506a"/>

    <!-- Diagram Stage III (y = 108..240) -->
    <rect x="664" y="108" width="262" height="132" rx="6" fill="#02040a" stroke="#143049"/>

