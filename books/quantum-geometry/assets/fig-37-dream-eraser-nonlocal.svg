    <circle cx="746" cy="174" r="4.6" fill="#9d8cff" stroke="#46ffb2" stroke-width="1.2"/>

    <circle cx="792" cy="158" r="2.5" fill="#46ffb2"/>
    <line x1="792" y1="158" x2="792" y2="174" stroke="#46ffb2" stroke-width="1"/>
    <circle cx="792" cy="174" r="4.6" fill="#9d8cff" stroke="#46ffb2" stroke-width="1.2"/>

    <circle cx="848" cy="188" r="2.5" fill="#46ffb2"/>
    <line x1="848" y1="188" x2="848" y2="174" stroke="#46ffb2" stroke-width="1"/>
    <circle cx="848" cy="174" r="4.6" fill="#9d8cff" stroke="#46ffb2" stroke-width="1.2"/>

    <circle cx="894" cy="162" r="2.5" fill="#46ffb2"/>
    <line x1="894" y1="162" x2="894" y2="174" stroke="#46ffb2" stroke-width="1"/>
    <circle cx="894" cy="174" r="4.6" fill="#9d8cff" stroke="#46ffb2" stroke-width="1.2"/>

    <text x="694" y="191" text-anchor="middle" fill="#cfe3ff" font-size="7.6">x₁</text>
    <text x="746" y="165" text-anchor="middle" fill="#cfe3ff" font-size="7.6">x₂</text>
    <text x="792" y="191" text-anchor="middle" fill="#cfe3ff" font-size="7.6">x₃</text>
    <text x="848" y="165" text-anchor="middle" fill="#cfe3ff" font-size="7.6">x₄</text>
    <text x="894" y="191" text-anchor="middle" fill="#cfe3ff" font-size="7.6">x₅</text>
    <text x="795" y="231" text-anchor="middle" fill="#9d8cff" font-size="7.8" font-weight="600">P_body → 0 : 观察者在各截点同步涌现</text>

    <!-- Info Cards Panel III -->
    <rect x="664" y="248" width="262" height="56" rx="6" fill="#07101b" stroke="#9d8cff" stroke-width="1"/>
    <text x="674" y="264" fill="#9d8cff" font-size="8.4" font-weight="600">MODEL · 卸下躯体先验 / Bodiless Awareness</text>
    <text x="674" y="280" fill="#d4efff" font-size="7.9">五感只是局域节流阀；躯体与梦境同为内积显影</text>
    <text x="674" y="295" fill="#19f0ff" font-size="7.9">本觉 ψ = ψ(ψ) 沿超平面各准晶节点非定域浮现</text>

    <rect x="664" y="312" width="262" height="58" rx="6" fill="#07101b" stroke="#46ffb2" stroke-width="1"/>
    <text x="674" y="328" fill="#46ffb2" font-size="8.4" font-weight="600">LEAN · 黄金切投与双半径 / Delone Radii</text>
    <text x="674" y="344" fill="#d4efff" font-size="7.9">embedding '' goldenModelSet ⊆ CutAndProject</text>
    <text x="674" y="360" fill="#46ffb2" font-size="7.9">DeloneSet ℝ : packing = 1/2, covering = 3</text>
