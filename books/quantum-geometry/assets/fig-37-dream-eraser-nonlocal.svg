    <circle cx="746" cy="174" r="26" fill="none" stroke="#1f5d7c" stroke-width="0.9" stroke-dasharray="2,2"/>
    <circle cx="792" cy="174" r="26" fill="none" stroke="#1f5d7c" stroke-width="0.9" stroke-dasharray="2,2"/>
    <circle cx="848" cy="174" r="26" fill="none" stroke="#1f5d7c" stroke-width="0.9" stroke-dasharray="2,2"/>
    <circle cx="894" cy="174" r="26" fill="none" stroke="#1f5d7c" stroke-width="0.9" stroke-dasharray="2,2"/>

