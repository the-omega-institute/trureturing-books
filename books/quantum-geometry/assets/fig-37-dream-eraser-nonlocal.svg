    <circle cx="754" cy="122" r="2.2" fill="#34506a"/>
    <circle cx="828" cy="130" r="2.2" fill="#34506a"/>
    <circle cx="888" cy="124" r="2.2" fill="#34506a"/>
    <circle cx="718" cy="214" r="2.2" fill="#34506a"/>
    <circle cx="786" cy="220" r="2.2" fill="#34506a"/>
    <circle cx="862" cy="212" r="2.2" fill="#34506a"/>

