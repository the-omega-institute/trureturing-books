<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <title>Chapter 37: Dream Quantum Erasure, Known-Data Decoherence, and the Nonlocal Observer</title>
  <desc>Bilingual three-panel diagram. Panel I: Waking known-data pinching Pi_wake and bodily prior P_body locking perception to a narrow five-sense cone at x_0 while shearing sin(theta) counterfactual branches into the 90-degree blind zone with positive entropy tax. Panel II: Nocturnal quantum erasure (reverseOn Finset.univ) conjugating unimodular record overlaps to restore off-diagonal coherence (+1/2) while suspending Delta M Gram constraints expands det G from 0.104 to 0.360. Panel III: Bodiless golden cut-and-project slice over goldenWindow = [phi-2, phi-1] certified as a DeloneSet (packing radius 1/2, covering radius 3) where nonlocal observer positions {x_1,...,x_5} light up simultaneously.</desc>

  <rect x="6" y="6" width="948" height="428" rx="14" fill="#07101b" stroke="#143049" stroke-width="2"/>
  <text x="26" y="34" font-family="JetBrains Mono,monospace" font-size="13.2" font-weight="600" fill="#19f0ff">CHAPTER 37 · 梦境量子擦除与非定域观察者 / DREAM QUANTUM ERASURE &amp; NONLOCAL OBSERVER</text>
  <text x="26" y="54" font-family="JetBrains Mono,monospace" font-size="10" fill="#6f8ea5">已知数据捏合 Π_wake · 夜间相干擦除 reverseOn · 无身黄金切片多点涌现 / Known-data pinching, nocturnal erasure &amp; Delone multi-position</text>

  <line x1="321" y1="68" x2="321" y2="384" stroke="#143049" stroke-width="1.2"/>
  <line x1="639" y1="68" x2="639" y2="384" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono,monospace">
    <!-- ==================== PANEL I: WAKING KNOWN-DATA PINCHING ==================== -->
    <text x="165" y="86" text-anchor="middle" fill="#19f0ff" font-size="11" font-weight="600">I · 清醒强捏合 / WAKING PINCHING</text>
    <rect x="22" y="96" width="286" height="286" rx="8" fill="#050c16" stroke="#34506a"/>

    <!-- Diagram Stage I (y = 104..242) -->
    <rect x="34" y="108" width="262" height="132" rx="6" fill="#02040a" stroke="#143049"/>

    <!-- Narrow Five-Sense Cone from x_0 = (68, 178) -->
    <polygon points="68,178 252,154 252,202" fill="#07101b" stroke="#ffc83d" stroke-width="1.1" stroke-dasharray="4,2"/>

    <!-- 90-degree Blind Barrier -->
    <line x1="156" y1="116" x2="156" y2="232" stroke="#ff8a3c" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="162" y="126" fill="#ff8a3c" font-size="7.8" font-weight="600">90° 盲区截断 / Blind Cut</text>

    <!-- Sheared Counterfactual sin(theta) Branches -->
    <path d="M 68 178 Q 112 142, 154 132" fill="none" stroke="#ff2fd0" stroke-width="1.7" stroke-dasharray="3,3"/>
    <path d="M 68 178 Q 112 214, 154 224" fill="none" stroke="#ff2fd0" stroke-width="1.7" stroke-dasharray="3,3"/>
    <text x="164" y="143" fill="#ff2fd0" font-size="7.8">sin θ 未选分叉置零</text>
    <text x="164" y="226" fill="#ff2fd0" font-size="7.8">|ρ₀₁|² + |ρ₁₀|² 丢弃</text>

    <!-- Chosen Waking Collinear Axis cos(theta) -->
    <line x1="68" y1="178" x2="274" y2="178" stroke="#19f0ff" stroke-width="2.3"/>
    <polygon points="278,178 269,174 269,182" fill="#19f0ff"/>
    <text x="218" y="171" text-anchor="middle" fill="#19f0ff" font-size="8.2" font-weight="600">cos θ 清醒单线</text>

    <!-- Single-Point Bodily Anchor x_0 -->
    <circle cx="68" cy="178" r="5.5" fill="#ffc83d" stroke="#001318" stroke-width="1.2"/>
    <text x="68" y="197" text-anchor="middle" fill="#ffc83d" font-size="8.2" font-weight="600">now: x₀ (P_body)</text>
    <text x="72" y="126" fill="#19f0ff" font-size="7.8">五感针孔 / 5-Sense Cone</text>

    <!-- Info Cards Panel I -->
    <rect x="34" y="248" width="262" height="56" rx="6" fill="#07101b" stroke="#19f0ff" stroke-width="1"/>
    <text x="44" y="264" fill="#19f0ff" font-size="8.4" font-weight="600">MODEL · 已知数据退相干 / Known-Data Pinch</text>
    <text x="44" y="280" fill="#d4efff" font-size="8">Π_wake(ρ) = ∑ P_k ρ P_k 剪除横向潜能</text>
    <text x="44" y="295" fill="#9d8cff" font-size="8">狭窄相容体积 det G₃ = 13/125 = 0.104</text>

    <rect x="34" y="312" width="262" height="58" rx="6" fill="#07101b" stroke="#46ffb2" stroke-width="1"/>
    <text x="44" y="328" fill="#46ffb2" font-size="8.4" font-weight="600">LEAN · 捏合不动点与熵税 / Fixed-Point &amp; Tax</text>
    <text x="44" y="344" fill="#d4efff" font-size="7.9">unreadState P ρ = ρ ↔ ∀k≠l, P_k ρ P_l = 0</text>
    <text x="44" y="360" fill="#46ffb2" font-size="7.9">ΔS_k = D(Uρ_k U† ‖ P(Uρ_k U†)) ≥ 0</text>

    <!-- ==================== PANEL II: NOCTURNAL QUANTUM ERASURE ==================== -->
    <text x="480" y="86" text-anchor="middle" fill="#ff2fd0" font-size="11" font-weight="600">II · 夜间量子擦除 / NOCTURNAL ERASURE</text>
    <rect x="336" y="96" width="288" height="286" rx="8" fill="#050c16" stroke="#34506a"/>

