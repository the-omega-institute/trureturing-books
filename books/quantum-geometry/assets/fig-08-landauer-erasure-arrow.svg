<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <marker id="f8-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
    <marker id="f8-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/>
    </marker>
    <marker id="f8-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/>
    </marker>
    <marker id="f8-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="412" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
  <line x1="306" y1="28" x2="306" y2="352" stroke="#143049" stroke-width="1.2"/>
  <line x1="614" y1="28" x2="614" y2="352" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, system-ui, sans-serif">
    <!-- PANEL I: Global Unitary Reversibility vs Local Access Defect -->
    <text x="155" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">I · GLOBAL REVERSAL VS LOCAL ERASURE</text>
    <text x="155" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">全局受控拷贝可逆 vs 局部偏迹访问缺陷</text>

    <!-- Two distinct states rho != sigma on off-diagonal -->
    <rect x="18" y="80" width="118" height="56" rx="6" fill="#050c16" stroke="#19f0ff" stroke-width="1.4"/>
    <text x="77" y="102" text-anchor="middle" font-size="8.6" font-weight="600" fill="#19f0ff">ρ ≠ σ (ρ_ii=σ_ii)</text>
    <text x="77" y="122" text-anchor="middle" font-size="9.2" fill="#6f8ea5">ρ₀₁ ≠ σ₀₁</text>

    <!-- Global copyUnitary arrow -->
    <line x1="138" y1="98" x2="174" y2="98" stroke="#9d8cff" stroke-width="1.8" marker-end="url(#f8-vio)"/>
    <line x1="174" y1="118" x2="138" y2="118" stroke="#19f0ff" stroke-width="1.8" marker-end="url(#f8-cyan)"/>
    <text x="156" y="74" text-anchor="middle" font-size="8.5" fill="#9d8cff">U_copy</text>
    <text x="156" y="148" text-anchor="middle" font-size="8.5" fill="#19f0ff">U_copy†</text>

    <!-- Joint record box R_canon(rho) != R_canon(sigma) -->
    <rect x="176" y="80" width="122" height="56" rx="6" fill="#050c16" stroke="#9d8cff" stroke-width="1.4"/>
    <text x="237" y="102" text-anchor="middle" font-size="8.0" font-weight="600" fill="#9d8cff">R_canon(ρ)≠R_canon(σ)</text>
    <text x="237" y="122" text-anchor="middle" font-size="9.0" fill="#19f0ff">全局伴随完全可逆</text>

    <!-- Downward partial trace arrow -->
    <line x1="237" y1="138" x2="237" y2="188" stroke="#ff2fd0" stroke-width="2" marker-end="url(#f8-mag)"/>
    <text x="225" y="168" text-anchor="end" font-size="9.5" fill="#ff2fd0">Tr_env (忽略环境)</text>

    <!-- Pinched local state Tr_env R_canon(rho) = Tr_env R_canon(sigma) -->
    <rect x="32" y="192" width="248" height="56" rx="6" fill="#050c16" stroke="#ff2fd0" stroke-width="1.5"/>
    <text x="156" y="214" text-anchor="middle" font-size="9.2" font-weight="600" fill="#ff2fd0">Tr_env R_canon(ρ) = Tr_env R_canon(σ)</text>
    <text x="156" y="234" text-anchor="middle" font-size="9.5" fill="#d4efff">∄ 局部恢复映射 R 还原两者</text>

    <text x="156" y="282" text-anchor="middle" font-size="9.0" fill="#46ffb2">LEAN ✓ R_canon(ρ) ≠ R_canon(σ) (copiedAddressRecord)</text>
    <text x="156" y="304" text-anchor="middle" font-size="9.0" fill="#46ffb2">LEAN ✓ Tr_env(R_canon(ρ)) = Tr_env(R_canon(σ))</text>
    <text x="156" y="326" text-anchor="middle" font-size="10.5" fill="#6f8ea5">不可逆性源于丢掉环境记录钥匙的访问缺陷</text>

    <!-- PANEL II: Coherence Deletion Entropy Production & Dual Account ln d -->
    <text x="460" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">II · COHERENCE DELETION &amp; LANDAUER LEDGER</text>
    <text x="460" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">压扁面积的相对熵账单：ΔS = D(UρU† ‖ Π(UρU†))</text>

    <!-- Bloch disk flattened into vertical line -->
    <circle cx="416" cy="148" r="56" fill="#9d8cff" fill-opacity="0.12" stroke="#9d8cff" stroke-width="1.4" stroke-dasharray="4 2"/>
    <line x1="416" y1="92" x2="416" y2="204" stroke="#19f0ff" stroke-width="3.4"/>
    <line x1="348" y1="148" x2="402" y2="148" stroke="#ff2fd0" stroke-width="2" marker-end="url(#f8-mag)"/>
    <line x1="484" y1="148" x2="430" y2="148" stroke="#ff2fd0" stroke-width="2" marker-end="url(#f8-mag)"/>
    <text x="494" y="142" text-anchor="start" font-size="10.5" font-weight="600" fill="#19f0ff">Π(UρU†)</text>
    <text x="494" y="162" text-anchor="start" font-size="9.8" fill="#ff2fd0">抹除相干面积</text>

    <rect x="316" y="224" width="288" height="116" rx="8" fill="#050c16" stroke="#1f4260" stroke-width="1.2"/>
    <text x="460" y="246" text-anchor="middle" font-size="9.2" font-weight="600" fill="#46ffb2">LEAN ✓ S(Π(UρU†)) − S(ρ) = D(UρU† ‖ Π(UρU†))</text>
    <text x="460" y="270" text-anchor="middle" font-size="9.3" fill="#46ffb2">LEAN ✓ MUB 账本：Π_Z(ρ)=ρ、完备秩一 ⇒ σ=Π_X(ρ)=I/d</text>
    <text x="460" y="294" text-anchor="middle" font-size="9.8" fill="#d4efff">D(ρ ‖ I/d) = ln d − S(ρ) = S(σ) − S(ρ)</text>
    <text x="460" y="318" text-anchor="middle" font-size="9.0" fill="#19f0ff">阶段A 纯比特例 ΔS=ln 2 · 阶段B 理想下界 Q_L=k_B T ln 2</text>

    <!-- PANEL III: Observer Memory & Single Surviving Copy Blocks Reversal -->
    <text x="765" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#9d8cff">III · SURVIVING COPY BLOCKS REVERSAL</text>
    <text x="765" y="56" text-anchor="middle" font-size="9.2" fill="#6f8ea5">指定共轭重叠协议：|c_l|=1(l≠k)、c_k≠1、ρ_ij≠0</text>

    <!-- System node on left, 3 environmental copies on right -->
    <circle cx="666" cy="164" r="24" fill="#050c16" stroke="#19f0ff" stroke-width="1.8"/>
    <text x="666" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">ρ_ij</text>

    <!-- Copy 1: reversed -->
    <line x1="690" y1="150" x2="774" y2="104" stroke="#19f0ff" stroke-width="1.6" stroke-dasharray="3 2"/>
    <rect x="778" y="88" width="114" height="30" rx="5" fill="#050c16" stroke="#19f0ff" stroke-width="1.2"/>
    <text x="835" y="107" text-anchor="middle" font-size="10" fill="#19f0ff">Copy 1: 已逆转 ✓</text>

    <!-- Copy 2: reversed -->
    <line x1="690" y1="164" x2="774" y2="164" stroke="#19f0ff" stroke-width="1.6" stroke-dasharray="3 2"/>
    <rect x="778" y="149" width="114" height="30" rx="5" fill="#050c16" stroke="#19f0ff" stroke-width="1.2"/>
    <text x="835" y="168" text-anchor="middle" font-size="10" fill="#19f0ff">Copy 2: 已逆转 ✓</text>

    <!-- Copy k: single surviving unreversed witness highlighted in Amber -->
    <line x1="690" y1="178" x2="774" y2="224" stroke="#ffc83d" stroke-width="2.6" marker-end="url(#f8-amb)"/>
    <rect x="778" y="209" width="114" height="32" rx="5" fill="#ffc83d" fill-opacity="0.14" stroke="#ffc83d" stroke-width="1.8"/>
    <text x="835" y="229" text-anchor="middle" font-size="10" font-weight="600" fill="#ffc83d">Copy k: 幸存未逆!</text>

    <text x="760" y="276" text-anchor="middle" font-size="8.0" fill="#46ffb2">LEAN ✓ reverseChannelOn(univ\k, multiRecordChannel(ρ))_ij</text>
    <text x="760" y="298" text-anchor="middle" font-size="8.2" fill="#d4efff">= c_k · ρ_ij ≠ ρ_ij（在上述协议与条件下）</text>
    <text x="764" y="322" text-anchor="middle" font-size="9.4" fill="#6f8ea5">全逆转可还原；受限共轭协议中幸存副本阻断所选相干元</text>

    <!-- Bottom Lean-verified bar -->
    <rect x="24" y="358" width="872" height="42" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1"/>
    <text x="460" y="375" text-anchor="middle" font-size="9.8" fill="#46ffb2">LEAN ✓  dual_account_full · entropy_production_coherence_deletion_identity</text>
    <text x="460" y="392" text-anchor="middle" font-size="9.8" fill="#46ffb2">reduced_irreversibility_is_canonical_record_access_defect · surviving_copy_blocks_reversal</text>
  </g>
</svg>
