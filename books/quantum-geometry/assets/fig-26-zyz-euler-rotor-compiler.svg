<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <title>Bloch Matrix Geometry and ZYZ Even-Subalgebra Rotor Compiler</title>
  <desc>Three-panel diagram showing the Lean-verified Bloch matrix recovery and PSD ball bound, the even Clifford rotor sandwich action v maps to R v R-reverse, and the ZYZ Euler compilation pipeline.</desc>
  <rect x="6" y="6" width="908" height="408" rx="14" fill="#0a0c12" stroke="#143049" stroke-width="2"/>
  <text x="30" y="36" font-family="JetBrains Mono,monospace" font-size="15" font-weight="600" fill="#19f0ff">CHAPTER 26 · BLOCH GEOMETRY &amp; ZYZ EVEN-ROTOR COMPILER</text>
  <text x="30" y="56" font-family="JetBrains Mono,monospace" font-size="10.5" fill="#6f8ea5">Hermitian Bloch reconstruction, PSD ball bound ‖bloch M‖ ≤ Re Tr M, and ZYZ rotor sandwich v ↦ R v R̃</text>

  <line x1="310" y1="74" x2="310" y2="356" stroke="#143049" stroke-width="1.2"/>
  <line x1="615" y1="74" x2="615" y2="356" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono,monospace">
    <!-- PANEL I: Frozen Bloch Matrix Theorems -->
    <text x="158" y="92" text-anchor="middle" fill="#19f0ff" font-size="11.5" font-weight="600">I · BLOCH MATRIX &amp; BALL</text>
    <rect x="24" y="106" width="268" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="158" y="126" text-anchor="middle" fill="#46ffb2" font-size="10" font-weight="600">LEAN ✓ blochMatrix_trace / bloch</text>
    <text x="158" y="144" text-anchor="middle" fill="#d4efff" font-size="9.5">Tr(blochMatrix a r) = a</text>
    <text x="158" y="162" text-anchor="middle" fill="#d4efff" font-size="9.5">bloch(blochMatrix a r) = r</text>
    <line x1="38" y1="174" x2="278" y2="174" stroke="#143049"/>
    <text x="158" y="192" text-anchor="middle" fill="#46ffb2" font-size="9.5" font-weight="600">LEAN ✓ bloch_geometry_of_isHermitian</text>
    <text x="158" y="210" text-anchor="middle" fill="#9d8cff" font-size="9.5">Hyp: hM : M.IsHermitian</text>
    <text x="158" y="228" text-anchor="middle" fill="#d4efff" font-size="9.5">M = blochMatrix (Re Tr M) (bloch M)</text>
    <text x="158" y="246" text-anchor="middle" fill="#d4efff" font-size="9.5">Tr M = 1 ∧ M² = M ⇒ ‖bloch M‖ = 1</text>
    <line x1="38" y1="258" x2="278" y2="258" stroke="#143049"/>
    <text x="158" y="278" text-anchor="middle" fill="#46ffb2" font-size="9.5" font-weight="600">LEAN ✓ norm_bloch_le_trace_of_posSemidef</text>
    <text x="158" y="298" text-anchor="middle" fill="#19f0ff" font-size="10">hM : M.PosSemidef ⇒ ‖bloch M‖ ≤ Re(Tr M)</text>
    <text x="158" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">det M = ((Re Tr M)² − ‖bloch M‖²)/4</text>

    <!-- PANEL II: Even Subalgebra Rotor Sandwich -->
    <text x="462" y="92" text-anchor="middle" fill="#ff2fd0" font-size="11.5" font-weight="600">II · EVEN ROTOR SANDWICH</text>
    <rect x="328" y="106" width="270" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <circle cx="463" cy="192" r="56" fill="#ff2fd0" fill-opacity="0.06" stroke="#ff2fd0" stroke-width="1.4"/>
    <ellipse cx="463" cy="192" rx="56" ry="18" fill="none" stroke="#34506a" stroke-dasharray="3 3"/>
    <line x1="463" y1="192" x2="510" y2="158" stroke="#19f0ff" stroke-width="2.4"/>
    <line x1="463" y1="192" x2="422" y2="152" stroke="#ff2fd0" stroke-width="2.1" stroke-dasharray="3 2"/>
    <circle cx="510" cy="158" r="4" fill="#19f0ff"/>
    <circle cx="422" cy="152" r="3.5" fill="#ff2fd0"/>
    <text x="463" y="278" text-anchor="middle" fill="#d4efff" font-size="10.5">R_u(θ) = cos(θ/2) − B_u sin(θ/2)</text>
    <text x="463" y="300" text-anchor="middle" fill="#9d8cff" font-size="10">B_z=e₁e₂,  B_y=e₃e₁,  B_x=e₂e₃</text>
    <text x="463" y="324" text-anchor="middle" fill="#19f0ff" font-size="10.5">v′ = R v R̃,   R R̃ = 1</text>

    <!-- PANEL III: Compiled ZYZ Euler Triple -->
    <text x="764" y="92" text-anchor="middle" fill="#9d8cff" font-size="11.5" font-weight="600">III · ZYZ COMPILER PIPELINE</text>
    <rect x="632" y="106" width="264" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="764" y="130" text-anchor="middle" fill="#d4efff" font-size="10.5">R(α,β,γ) = R_z(α) R_y(β) R_z(γ)</text>
    <!-- Active compiled target highlighted in amber -->
    <rect x="646" y="146" width="236" height="52" rx="6" fill="#050c16" stroke="#ffc83d" stroke-width="1.3"/>
    <text x="764" y="166" text-anchor="middle" fill="#ffc83d" font-size="10.5" font-weight="600">now: ACTIVE EULER TRIPLE</text>
    <text x="764" y="186" text-anchor="middle" fill="#d4efff" font-size="10">(α, β, γ) = (0.37, −0.81, 0.52)</text>
    <text x="764" y="222" text-anchor="middle" fill="#19f0ff" font-size="10">R = 0.8296 − 0.3956 e₁e₂</text>
    <text x="764" y="242" text-anchor="middle" fill="#19f0ff" font-size="10">  − 0.3929 e₁e₃ + 0.0295 e₂e₃</text>
    <text x="764" y="270" text-anchor="middle" fill="#9d8cff" font-size="9.5">H : (0, π/2, π) (e₁↔e₃, e₂↦−e₂)</text>
    <text x="764" y="292" text-anchor="middle" fill="#ff2fd0" font-size="10">T : (α,β,γ) = (π/4, 0, 0)</text>
    <text x="764" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">Lit: U = e^{iδ} R_z(α)R_y(β)R_z(γ)</text>
  </g>

  <rect x="24" y="368" width="872" height="30" rx="6" fill="#050c16" stroke="#1f5d7c"/>
  <text x="460" y="388" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#46ffb2">LEAN ✓  blochMatrix_trace · bloch_blochMatrix · bloch_geometry_of_isHermitian · norm_bloch_le_trace_of_posSemidef</text>
</svg>
