    </marker>
    <marker id="p21-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
