<text x="158" y="59" text-anchor="middle" font-size="11" fill="#19f0ff" font-weight="600">I · ROTATING FRAME</text><text x="158" y="78" text-anchor="middle" font-size="12" fill="#d4efff" >跟随载频 ω₀ 的相位参考系</text><circle cx="153" cy="181" r="68" fill="#07101b" stroke="#34506a" stroke-width="1.4" /><ellipse cx="153" cy="181" rx="68" ry="21" fill="none" stroke="#34506a" stroke-width="1.2" /><line x1="153" y1="181" x2="153" y2="105" stroke="#19f0ff" stroke-width="1.7" marker-end="url(#arrow-19f0ff)"/><line x1="153" y1="181" x2="211" y2="145" stroke="#ff2fd0" stroke-width="2" marker-end="url(#arrow-ff2fd0)"/><path d="M202 136 A65 65 0 0 1 214 208" fill="none" stroke="#9d8cff" stroke-width="1.5" marker-end="url(#arrow-9d8cff)"/><text x="228" y="128" text-anchor="middle" font-size="10" fill="#ff2fd0" >lab</text><text x="184" y="111" text-anchor="middle" font-size="10" fill="#19f0ff" >rot</text><text x="217" y="218" text-anchor="middle" font-size="13" fill="#9d8cff" >ω₀</text><text x="158" y="278" text-anchor="middle" font-size="11" fill="#d4efff" >V(t)=exp(+iω₀tZ/2)</text><text x="158" y="302" text-anchor="middle" font-size="11" fill="#d4efff" >Hrot=VHV*+iV̇V*</text><text x="158" y="337" text-anchor="middle" font-size="11" fill="#6f8ea5" >5 GHz → 0.2 ns / cycle</text><text x="158" y="355" text-anchor="middle" font-size="10" fill="#9d8cff" >共振 + RWA / resonant + RWA</text><text x="460" y="59" text-anchor="middle" font-size="11" fill="#19f0ff" font-weight="600">II · PULSE AREA</text><text x="460" y="78" text-anchor="middle" font-size="12" fill="#d4efff" >微波包络决定旋转角</text><line x1="344" y1="243" x2="579" y2="243" stroke="#6f8ea5" stroke-width="1" marker-end="url(#arrow-6f8ea5)"/><line x1="344" y1="243" x2="344" y2="112" stroke="#6f8ea5" stroke-width="1" marker-end="url(#arrow-6f8ea5)"/><text x="351" y="106" text-anchor="middle" font-size="11" fill="#d4efff" >Ω(t)</text><text x="582" y="259" text-anchor="middle" font-size="11" fill="#d4efff" >t</text><path d="M354.00 243.00 L356.6