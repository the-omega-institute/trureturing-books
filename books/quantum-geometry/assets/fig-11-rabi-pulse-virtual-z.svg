<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">11 / 脉冲与虚拟 Z · PULSES &amp; VIRTUAL Z</title>
<desc id="figure-description">Rotating-frame transformation at omega0, a fixed-axis microwave envelope whose integral gives the rotation angle, and a virtual-Z phase-reference update with zero additional analog pulse duration in ideal scheduling. The green box certifies only trace-dual readout under the stated duality premise; it does not certify timing or hardware error. Amber marks the current phase origin.</desc>
