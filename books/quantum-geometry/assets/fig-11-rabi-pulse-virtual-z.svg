ize="12" fill="#d4efff" >零附加脉冲：更新相位基准</text><circle cx="760" cy="175" r="62" fill="#07101b" stroke="#34506a" stroke-width="1.4" /><line x1="760" y1="175" x2="818" y2="175" stroke="#19f0ff" stroke-width="2" marker-end="url(#arrow-19f0ff)"/><line x1="760" y1="175" x2="760" y2="117" stroke="#ff2fd0" stroke-width="2" marker-end="url(#arrow-ff2fd0)"/><path d="M801 173 A41 41 0 0 0 762 134" fill="none" stroke="#9d8cff" stroke-width="2" marker-end="url(#arrow-9d8cff)"/><text x="833" y="179" text-anchor="middle" font-size="11" fill="#19f0ff" >X</text><text x="760" y="108" text-anchor="middle" font-size="11" fill="#ff2fd0" >Y</text><text x="790" y="144" text-anchor="middle" font-size="13" fill="#9d8cff" >λ</text><circle cx="760" cy="175" r="4.5" fill="#ffc83d" stroke="#ffc83d" stroke-width="1.4" data-role="current-selection"/><text x="760" y="251" text-anchor="middle" font-size="10" fill="#d4efff" >φframe → φframe+λ · φphys = φ−λ</text><text x="760" y="272" text-anchor="middle" font-size="10" fill="#d4efff" >R𝓏(λ)Rφ(θ)R𝓏(−λ)=Rφ₊λ(θ)</text><text x="760" y="293" text-anchor="middle" font-size="10" fill="#9d8cff" >Rφ(θ)R𝓏(λ)=R𝓏(λ)Rφ₋λ(θ) · Δt=0</text><g data-lean-gid="D5/S3/Quantum/Dynamics/ObserverPullbackTraceIdentity.observer_pullback_trace_identity"><rect x="633" y="315" width="254" height="50" rx="6" fill="#050c16" stroke="#3dff9b" stroke-width="1"/><text x="760.0" y="334" text-anchor="middle" font-size="11" fill="#3dff9b" >LEAN ✓  trace-dual readout</text><text x="760.0" y="350" text-anchor="middle" font-size="11" fill="#3dff9b" >Tr[Φᵗ(ρ)E] = Tr[ρ(Φ*)ᵗ(E)]</text></g><text x="760" y="379" text-anchor="middle" font-size="9" fill="#6f8ea5" >徽章仅指迹对偶 / trace duality only</text><text x="460" y="400" text-anchor="middle" font-size="10" fill="#6f8ea5" >11 / 当前相位基准为琥珀点；脉冲面积与零附加时长采用理想模型 · Pulse area and virtual-Z timing use stated ideal assumptions.</text>
