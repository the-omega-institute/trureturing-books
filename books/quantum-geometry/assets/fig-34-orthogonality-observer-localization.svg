<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <title>正交简并盲区与观察者位置反演 / Orthogonality-Degeneracy Blind Spots and Observer Localization</title>
  <desc>Bilingual two-panel diagram: Left panel shows two-step spherical addressing v₁(θ) vs v₂(θ,φ) on unit sphere S², where azimuthal second-orthogonality degeneracy uniquely localizes the observer at polar normal O = ±e₃ = ±⋆(e₁∧e₂), whereas off-axis tilt β_obs splits the readout; Right panel shows the spherical octant triangle (e₁→e₂→e₃, three 90° angles, Ω = π/2) comparing direct rotor R_once against two-step rotor R_twice, locking O = ±e₃ as the normal to the invisible e₁∧e₂ holonomy plane.</desc>

  <defs>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#19f0ff"/>
    </marker>
    <marker id="arr-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#ff2fd0"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#ffc83d"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#ff8a3c"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="948" height="428" rx="14" fill="#07101b" stroke="#143049" stroke-width="2"/>

  <!-- HEADER -->
  <text x="28" y="34" font-family="JetBrains Mono,monospace" font-size="14" font-weight="600" fill="#19f0ff">CHAPTER 34 · 正交简并盲区与观察者位置反演 / ORTHOGONALITY DEGENERACY &amp; OBSERVER POSITION</text>
  <text x="28" y="54" font-family="New Computer Modern Math,JetBrains Mono,monospace" font-size="10.2" fill="#6f8ea5">一次正交 vs. 两次正交读数简并 ⟺ 观察者立于第二正交面的法向极轴 / Readout collapse of 1-step vs. 2-step orthogonality locks O = ±e₃</text>

  <line x1="480" y1="68" x2="480" y2="380" stroke="#143049" stroke-width="1.4"/>

  <g font-family="JetBrains Mono,monospace">
    <!-- ==================== LEFT PANEL ==================== -->
    <text x="243" y="86" text-anchor="middle" fill="#19f0ff" font-size="11.2" font-weight="600">I · 球面两步寻址与极轴反演 / SPHERICAL 2-STEP ADDRESSING</text>
    <rect x="22" y="96" width="442" height="280" rx="8" fill="#050c16" stroke="#34506a" stroke-width="1.2"/>

    <!-- Unit Sphere S² at (156, 240), R = 92 -->
    <circle cx="156" cy="240" r="92" fill="#02040a" stroke="#1f5d7c" stroke-width="1.5"/>
    <!-- Equatorial plane e₁∧e₂ -->
    <path d="M 64 240 A 92 26 0 0 1 248 240" fill="none" stroke="#34506a" stroke-width="1.1" stroke-dasharray="4,3"/>
    <path d="M 64 240 A 92 26 0 0 0 248 240" fill="none" stroke="#1f5d7c" stroke-width="1.2"/>
    <text x="156" y="279" text-anchor="middle" fill="#6f8ea5" font-size="8.4">赤道面 e₁∧e₂</text>

    <!-- Latitude circle at polar angle θ (y = 184, rx = 73, ry = 18) -->
    <path d="M 83 184 A 73 18 0 0 1 229 184" fill="none" stroke="#ff2fd0" stroke-width="1.1" stroke-dasharray="3,3"/>
    <path d="M 83 184 A 73 18 0 0 0 229 184" fill="none" stroke="#ff2fd0" stroke-width="1.4"/>

    <!-- Equatorial basis axes e₁, e₂ from center (156, 240) -->
    <line x1="156" y1="240" x2="92" y2="256" stroke="#6f8ea5" stroke-width="1.2"/>
    <text x="80" y="263" text-anchor="end" fill="#6f8ea5" font-size="8.8">e₁</text>
    <line x1="156" y1="240" x2="232" y2="252" stroke="#6f8ea5" stroke-width="1.2"/>
    <text x="240" y="256" text-anchor="start" fill="#6f8ea5" font-size="8.8">e₂</text>

    <!-- Polar normal axis ±e₃ (Active Observer now: O = +e₃) -->
    <line x1="156" y1="336" x2="156" y2="122" stroke="#ffc83d" stroke-width="2" marker-end="url(#arr-amber)"/>
    <circle cx="156" cy="148" r="4.5" fill="#ffc83d"/>
    <circle cx="156" cy="332" r="3.5" fill="#9d8cff"/>
    <text x="156" y="114" text-anchor="middle" fill="#ffc83d" font-size="9.2" font-weight="600">now: O = +e₃ = +⋆(e₁∧e₂)</text>
    <text x="156" y="352" text-anchor="middle" fill="#9d8cff" font-size="8.5">O = −e₃ (对跖极点)</text>

    <!-- First orthogonal vector v₁(θ) -->
    <line x1="156" y1="240" x2="100" y2="195" stroke="#19f0ff" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
    <text x="86" y="176" text-anchor="middle" fill="#19f0ff" font-size="8.8" font-weight="600">v₁(θ)</text>

    <!-- Second orthogonal vector v₂(θ, φ) -->
    <line x1="156" y1="240" x2="214" y2="195" stroke="#ff2fd0" stroke-width="2.2" marker-end="url(#arr-mag)"/>
    <text x="234" y="176" text-anchor="middle" fill="#ff2fd0" font-size="8.8" font-weight="600">v₂(θ,φ)</text>

    <!-- Azimuthal second-step arc φ -->
    <path d="M 108 198 Q 156 210 205 198" fill="none" stroke="#ff2fd0" stroke-width="1.5" marker-end="url(#arr-mag)"/>
    <text x="156" y="215" text-anchor="middle" fill="#ff2fd0" font-size="8.5">二次正交转角 φ</text>

    <!-- Identical projection height cos θ on e₃ -->
    <line x1="100" y1="195" x2="156" y2="184" stroke="#cfe3ff" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="214" y1="195" x2="156" y2="184" stroke="#cfe3ff" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="156" cy="184" r="3.6" fill="#d4efff" stroke="#ffc83d" stroke-width="1.2"/>
    <text x="156" y="169" text-anchor="middle" fill="#d4efff" font-size="8.5">cos θ</text>

    <!-- Off-axis tilted observer O_off (β_obs) -->
    <line x1="156" y1="240" x2="206" y2="138" stroke="#ff8a3c" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#arr-orange)"/>
    <path d="M 156 198 A 42 42 0 0 1 175 202" fill="none" stroke="#ff8a3c" stroke-width="1.2"/>
    <text x="214" y="135" text-anchor="start" fill="#ff8a3c" font-size="8.4">偏轴 β_obs</text>

    <!-- Right-side Analytical Readout Cards in Panel I -->
    <rect x="272" y="110" width="180" height="78" rx="6" fill="#07101b" stroke="#19f0ff" stroke-width="1.2"/>
    <text x="362" y="128" text-anchor="middle" fill="#19f0ff" font-size="9.2" font-weight="600">全角简并 / Full Azimuth ∀φ</text>
    <text x="362" y="146" text-anchor="middle" fill="#d4efff" font-size="8.8" font-family="New Computer Modern Math,JetBrains Mono,monospace">Δ(O) ≡ 0 ⟺ O₁ = O₂ = 0</text>
    <text x="362" y="163" text-anchor="middle" fill="#cfe3ff" font-size="8.6">唯一锁定 O = ±e₃</text>
    <text x="362" y="179" text-anchor="middle" fill="#6f8ea5" font-size="8.2">O·v₁ = O·v₂ = ±cos θ</text>

    <rect x="272" y="198" width="180" height="74" rx="6" fill="#07101b" stroke="#9d8cff" stroke-width="1.1"/>
    <text x="362" y="216" text-anchor="middle" fill="#9d8cff" font-size="9.2" font-weight="600">单对正交 / Single φ = π/2</text>
    <text x="362" y="234" text-anchor="middle" fill="#d4efff" font-size="8.8">Δ(O) = sin θ (O₂ − O₁) = 0</text>
    <text x="362" y="252" text-anchor="middle" fill="#cfe3ff" font-size="8.6">对称子午线 O₁ = O₂</text>
    <text x="362" y="266" text-anchor="middle" fill="#6f8ea5" font-size="8">过 ±e₃ 与 ±(e₁+e₂)/√2</text>

    <rect x="272" y="282" width="180" height="80" rx="6" fill="#07101b" stroke="#ff8a3c" stroke-width="1.1"/>
    <text x="362" y="300" text-anchor="middle" fill="#ff8a3c" font-size="9.2" font-weight="600">偏轴破缺 / Off-Axis Tilt</text>
    <text x="362" y="318" text-anchor="middle" fill="#d4efff" font-size="8.8">√(O₁² + O₂²) = sin β_obs &gt; 0</text>
    <text x="362" y="336" text-anchor="middle" fill="#cfe3ff" font-size="8.5">读数劈裂振幅 = 2|sin θ|sin β_obs</text>
    <text x="362" y="352" text-anchor="middle" fill="#6f8ea5" font-size="8">偏离法轴即暴露方位角 φ</text>

    <!-- ==================== RIGHT PANEL ==================== -->
    <text x="717" y="86" text-anchor="middle" fill="#ff2fd0" font-size="11.2" font-weight="600">II · 八分球面曲率与旋子盲区 / OCTANT HOLONOMY &amp; ROTOR BLIND SPOT</text>
    <rect x="496" y="96" width="442" height="280" rx="8" fill="#050c16" stroke="#34506a" stroke-width="1.2"/>

    <!-- Spherical Octant Triangle (Origin at (578, 276)) -->
    <!-- Shaded octant patch between e₃(578,144), e₁(514,306), e₂(676,288) -->
    <path d="M 514 306 Q 518 204 578 144 Q 656 196 676 288 Q 596 322 514 306 Z" fill="#02040a" stroke="#1f5d7c" stroke-width="1.2"/>

    <!-- Coordinate axes from octant center (578, 266) -->
    <line x1="578" y1="266" x2="578" y2="122" stroke="#9d8cff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
    <line x1="578" y1="266" x2="514" y2="306" stroke="#6f8ea5" stroke-width="1.3"/>
    <line x1="578" y1="266" x2="676" y2="288" stroke="#6f8ea5" stroke-width="1.3"/>

    <!-- Direct 1-step rotor path R_once: e₁ -> e₃ -->
    <path d="M 514 306 Q 518 204 574 148" fill="none" stroke="#19f0ff" stroke-width="2.4" marker-end="url(#arr-cyan)"/>
    <text x="510" y="212" text-anchor="start" fill="#19f0ff" font-size="8.6" font-weight="600">R_once</text>
    <text x="510" y="225" text-anchor="start" fill="#19f0ff" font-size="8">(一次 90°)</text>

    <!-- Two-step rotor path R_twice: e₁ -> e₂ -> e₃ -->
    <path d="M 514 306 Q 596 322 672 289" fill="none" stroke="#ff2fd0" stroke-width="2.4" marker-end="url(#arr-mag)"/>
    <path d="M 676 288 Q 656 196 583 148" fill="none" stroke="#ff2fd0" stroke-width="2.4" marker-end="url(#arr-mag)"/>
    <text x="602" y="330" text-anchor="middle" fill="#ff2fd0" font-size="8.5" font-weight="600">步1: e₁→e₂ (e₁∧e₂ 面)</text>
    <text x="664" y="212" text-anchor="middle" fill="#ff2fd0" font-size="8.5" font-weight="600">步2: e₂→e₃</text>

    <!-- Three 90° vertex labels & solid angle Ω = π/2 -->
    <circle cx="578" cy="144" r="4.5" fill="#9d8cff"/>
    <circle cx="514" cy="306" r="3.8" fill="#19f0ff"/>
    <circle cx="676" cy="288" r="3.8" fill="#ff2fd0"/>
    <text x="578" y="114" text-anchor="middle" fill="#9d8cff" font-size="9.2" font-weight="600">O = ±e₃ (90° 极点)</text>
    <text x="506" y="322" text-anchor="middle" fill="#d4efff" font-size="8.6">e₁ (90°)</text>
    <text x="680" y="306" text-anchor="middle" fill="#d4efff" font-size="8.6">e₂ (90°)</text>
    <text x="590" y="232" text-anchor="middle" fill="#9d8cff" font-size="9.5" font-weight="600">Ω = π/2</text>
    <text x="590" y="247" text-anchor="middle" fill="#6f8ea5" font-size="8.2">球面角超 3×90°−180°</text>

    <!-- Transported tangent vectors at pole e₃ -->
    <line x1="578" y1="144" x2="624" y2="152" stroke="#19f0ff" stroke-width="1.8" marker-end="url(#arr-cyan)"/>
    <text x="628" y="155" text-anchor="start" fill="#19f0ff" font-size="8">s_once</text>
    <line x1="578" y1="144" x2="542" y2="128" stroke="#ff2fd0" stroke-width="1.8" marker-end="url(#arr-mag)"/>
    <text x="538" y="128" text-anchor="end" fill="#ff2fd0" font-size="8">s_twice</text>

    <!-- Right-side Rotor Holonomy Cards in Panel II -->
    <rect x="702" y="110" width="224" height="84" rx="6" fill="#07101b" stroke="#19f0ff" stroke-width="1.1"/>
    <text x="814" y="128" text-anchor="middle" fill="#19f0ff" font-size="9.2" font-weight="600">Cl⁺₃,₀ 旋子分岔 / Rotor Split</text>
    <text x="814" y="146" text-anchor="middle" fill="#d4efff" font-size="8.6">s_once(α) = cos α e₃ + sin α e₂</text>
    <text x="814" y="163" text-anchor="middle" fill="#ff2fd0" font-size="8.6">s_twice(α) = cos α e₃ − sin α e₁</text>
    <text x="814" y="181" text-anchor="middle" fill="#cfe3ff" font-size="8.3">R_twice = exp(−(π/4)e₁e₂) R_once</text>

    <rect x="702" y="204" width="224" height="78" rx="6" fill="#07101b" stroke="#9d8cff" stroke-width="1.2"/>
    <text x="814" y="222" text-anchor="middle" fill="#9d8cff" font-size="9.2" font-weight="600">和乐面隐身 / Holonomy Blindness</text>
    <text x="814" y="240" text-anchor="middle" fill="#d4efff" font-size="8.6" font-family="New Computer Modern Math,JetBrains Mono,monospace">O = ±e₃ ⟹ O·s_once = O·s_twice</text>
    <text x="814" y="257" text-anchor="middle" fill="#cfe3ff" font-size="8.4">两者皆读 ±cos α (e₃ ⊥ e₁∧e₂)</text>
    <text x="814" y="273" text-anchor="middle" fill="#6f8ea5" font-size="8">O = e₂ 则分裂为 sin α vs. 0</text>

    <rect x="702" y="292" width="224" height="70" rx="6" fill="#07101b" stroke="#19f0ff" stroke-width="1.1"/>
    <text x="814" y="310" text-anchor="middle" fill="#19f0ff" font-size="9" font-weight="600">普适定位律 / Universal Law (MODEL)</text>
    <text x="814" y="328" text-anchor="middle" fill="#d4efff" font-size="8.4">2D面 · S²极轴 · 4D同时面 · 6D黄金切片</text>
    <text x="814" y="346" text-anchor="middle" fill="#cfe3ff" font-size="8.6" font-weight="600">凡简并处，皆是自身立锥之地</text>
  </g>

  <!-- FOOTER KERNEL BANNER -->
  <rect x="22" y="390" width="916" height="32" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1.1"/>
  <text x="480" y="410" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8.9" fill="#46ffb2">LEAN KERNEL · unit_perpendicular_pair · two_axis_finite_word · observer_pullback_trace_identity · partition_inseparable_iff_kernel · null_cone_spatial_rigidity</text>
</svg>
