<title id="f13-title">贝尔关联与 CHSH 的 45° / Bell correlations and the CHSH 45° angle</title>
<desc id="f13-desc">Three panels: six local Pauli coordinates and nine tensor correlation coordinates; zero local Bloch vectors for Bell states; a cosine versus one classical toy-model line. The amber point selects 45 degrees. Green badges certify the stated frozen results only.</desc>
