<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">09 / 三轴寻址 · THREE-AXIS ADDRESSING</title>
<desc id="figure-description">Three orthogonal axes and Pauli bivector planes, two-angle Bloch-sphere addressing from the north pole, and a frozen rational six-axis open cover. One amber point is the current state. The cover theorem does not give a two-gate synthesis bound.</desc>
<defs><marker id="arrow-19f0ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/></marker><marker id="arrow-ff2fd0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/></marker><marker id="arrow-9d8cff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/></marker><marker id="arrow-6f8ea5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5Z" fill="#6f8ea5"/></marker></defs>
<rect x="4" y="4" width="912" height="412" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
<g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, PingFang SC, Microsoft YaHei, sans-serif">
<text x="24" y="28" text-anchor="start" font-size="12" fill="#d4efff" font-weight="600">09 / 三轴寻址 · THREE-AXIS ADDRESSING</text>
<line x1="310" y1="48" x2="310" y2="376" stroke="#143049" stroke-width="1"/><line x1="610" y1="48" x2="610" y2="376" stroke="#143049" stroke-width="1"/>
<text x="158" y="59" text-anchor="middle" font-size="11" fill="#19f0ff" font-weight="600">I · ORTHOGONAL TRIAD</text><text x="158" y="78" text-anchor="middle" font-size="12" fill="#d4efff" >三轴与泡利双矢量</text><ellipse cx="151" cy="198" rx="84" ry="26" fill="none" stroke="#ff2fd0" stroke-width="1.2" /><ellipse cx="151" cy="198" rx="26" ry="79" fill="none" stroke="#9d8cff" stroke-width="1.2" /><path d="M84 228L218 168" fill="none" stroke="#34506a" stroke-width="1" /><line x1="151" y1="198" x2="151" y2="108" stroke="#19f0ff" stroke-width="2" marker-end="url(#arrow-19f0ff)"/><line x1="151" y1="198" x2="244" y2="198" stroke="#ff2fd0" stroke-width="2" marker-end="url(#arrow-ff2fd0)"/><line x1="151" y1="198" x2="93" y2="243" stroke="#9d8cff" stroke-width="2" marker-end="url(#arrow-9d8cff)"/><text x="151" y="101" text-anchor="middle" font-size="13" fill="#19f0ff" >e₃</text><text x="256" y="202" text-anchor="middle" font-size="13" fill="#ff2fd0" >e₁</text><text x="80" y="251" text-anchor="middle" font-size="13" fill="#9d8cff" >e₂</text><text x="160" y="282" text-anchor="middle" font-size="12" fill="#d4efff" >Iₓ=e₂∧e₃  Iᵧ=e₃∧e₁</text><text x="160" y="302" text-anchor="middle" font-size="12" fill="#d4efff" >I𝓏=e₁∧e₂  ·  Iⱼ²=−1</text><text x="160" y="336" text-anchor="middle" font-size="11" fill="#6f8ea5" >空间三轴 ↔ 三个转动平面</text><text x="160" y="355" text-anchor="middle" font-size="11" fill="#6f8ea5" >3 axes ↔ 3 rotation planes</text><text x="460" y="59" text-anchor="middle" font-size="11" fill="#19f0ff" font-weight="600">II · TWO-ANGLE ADDRESS</text><text x="460" y="78" text-anchor="middle" font-size="12" fill="#d4efff" >北极出发：极角 θ 与方位角 φ</text><circle cx="459" cy="186" r="80" fill="#07101b" stroke="#34506a" stroke-width="1.4" /><ellipse cx="459" cy="186" rx="80" ry="21.6" fill="none" stroke="#34506a" stroke-width="1.2" stroke-dasharray="4 4"/><ellipse cx="459" cy="186" rx="26.400000000000002" ry="80" fill="none" stroke="#34506a" stroke-width="1.2" stroke-dasharray="3 5"/><circle cx="459" cy="106" r="3" fill="#19f0ff" stroke="#19f0ff" stroke-width="1.4" /><text x="451" y="99" text-anchor="middle" font-size="11" fill="#19f0ff" >N</text><path d="M459 106 Q512 118 517 174" fill="none" stroke="#19f0ff" stroke-width="2" /><path d="M517 174 Q514 211 491 225" fill="none" stroke="#ff2fd0" stroke-width="2" /><line x1="459" y1="186" x2="491" y2="225" stroke="#6f8ea5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="491" cy="225" r="4.5" fill="#ffc83d" stroke="#ffc83d" stroke-width="1.4" data-role="current-selection"/><text x="540" y="248" text-anchor="middle" font-size="10" fill="#d4efff" >当前 / current</text><text x="499" y="135" text-anchor="middle" font-size="15" fill="#19f0ff" >θ</text><text x="509" y="203" text-anchor="middle" font-size="15" fill="#ff2fd0" >φ</text><text x="460" y="284" text-anchor="middle" font-size="13" fill="#d4efff" >r = R𝓏(φ)Rᵧ(θ)N</text><text x="460" y="304" text-anchor="middle" font-size="10" fill="#d4efff" >(sinθ cosφ, sinθ sinφ, cosθ)</text><text x="460" y="337" text-anchor="middle" font-size="11" fill="#6f8ea5" >θ∈[0,π] · φ∈[0,2π)</text><text x="460" y="355" text-anchor="middle" font-size="10" fill="#6f8ea5" >极点方位冗余 / polar redundancy</text><text x="760" y="59" text-anchor="middle" font-size="11" fill="#19f0ff" font-weight="600">III · SIX RATIONAL AXES</text><text x="760" y="78" text-anchor="middle" font-size="12" fill="#d4efff" >有理六轴的开覆盖</text><circle cx="760" cy="179" r="68" fill="#07101b" stroke="#34506a" stroke-width="1.4" /><ellipse cx="760" cy="179" rx="68" ry="18.36" fill="none" stroke="#34506a" stroke-width="1.2" stroke-dasharray="4 4"/><ellipse cx="760" cy="179" rx="22.44" ry="68" fill="none" stroke="#34506a" stroke-width="1.2" stroke-dasharray="3 5"/><line x1="709.75" y1="197.75" x2="827" y2="154" stroke="#19f0ff" stroke-width="1.5"/><circle cx="827" cy="154" r="2.8" fill="#07101b" stroke="#19f0ff" stroke-width="1.4" /><text x="840.4" y="153.0" text-anchor="middle" font-size="10" fill="#6f8ea5" >0</text><line x1="721.75" y1="147.5" x2="811" y2="221" stroke="#ff2fd0" stroke-width="1.5"/><circle cx="811" cy="221" r="2.8" fill="#07101b" stroke="#ff2fd0" stroke-width="1.4" /><text x="821.2" y="233.4" text-anchor="middle" font-size="10" fill="#6f8ea5" >1</text><line x1="773.5" y1="130.25" x2="742" y2="244" stroke="#19f0ff" stroke-width="1.5"/><circle cx="742" cy="244" r="2.8" fill="#07101b" stroke="#19f0ff" stroke-width="1.4" /><text x="738.4" y="261.0" text-anchor="middle" font-size="10" fill="#6f8ea5" >2</text><line x1="807.25" y1="164.0" x2="697" y2="199" stroke="#ff2fd0" stroke-width="1.5"/><circle cx="697" cy="199" r="2.8" fill="#07101b" stroke="#ff2fd0" stroke-width="1.4" /><text x="684.4" y="207.0" text-anchor="middle" font-size="10" fill="#6f8ea5" >3</text><line x1="793.75" y1="217.25" x2="715" y2="128" stroke="#19f0ff" stroke-width="1.5"/><circle cx="715" cy="128" r="2.8" fill="#07101b" stroke="#19f0ff" stroke-width="1.4" /><text x="706.0" y="121.80000000000001" text-anchor="middle" font-size="10" fill="#6f8ea5" >4</text><line x1="743.5" y1="227.75" x2="782" y2="114" stroke="#ff2fd0" stroke-width="1.5"/><circle cx="782" cy="114" r="2.8" fill="#07101b" stroke="#ff2fd0" stroke-width="1.4" /><text x="786.4" y="105.0" text-anchor="middle" font-size="10" fill="#6f8ea5" >5</text><text x="760" y="279" text-anchor="middle" font-size="12" fill="#d4efff" >aᵢ∈ℚ³ · ‖aᵢ‖²=5</text><text x="760" y="300" text-anchor="middle" font-size="10" fill="#d4efff" >Cᵢ={x∈S² : 5&lt;2⟨x,aᵢ⟩²}</text><g data-lean-gid="D5/S3/Geometry/Orthogonality/RationalSixAxisCover.rational_six_axis_open_cover"><rect x="633" y="322" width="254" height="50" rx="6" fill="#050c16" stroke="#3dff9b" stroke-width="1"/><text x="760.0" y="341" text-anchor="middle" font-size="11" fill="#3dff9b" >LEAN ✓  ⋃ᵢ Cᵢ = S²</text><text x="760.0" y="357" text-anchor="middle" font-size="11" fill="#3dff9b" >同色无正交对 / no orthogonal pair</text></g><text x="460" y="400" text-anchor="middle" font-size="10" fill="#6f8ea5" >09 / 两角描述纯态方向；有限旋转字不提供最短门计数 · Two angles locate a pure-state direction; word length is not bounded.</text>
</g>
