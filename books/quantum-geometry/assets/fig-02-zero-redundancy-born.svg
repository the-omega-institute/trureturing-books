<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 356" width="860" height="356">
  <defs>
    <marker id="p2-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
    <marker id="p2-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/>
    </marker>
    <marker id="p2-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
    <marker id="p2-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="852" height="348" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
  <line x1="430" y1="28" x2="430" y2="296" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, system-ui, sans-serif">
    <!-- LEFT PANEL: Bloch Sphere S^2 compatibility projection -->
    <text x="215" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">BLOCH SPHERE S² ⊂ ℝ³ · ANGLE θ</text>

    <!-- Sphere & equator -->
    <circle cx="205" cy="172" r="88" fill="#19f0ff" fill-opacity="0.04" stroke="#19f0ff" stroke-width="1.5"/>
    <ellipse cx="205" cy="172" rx="88" ry="24" fill="none" stroke="#34506a" stroke-width="1.1" stroke-dasharray="4 3"/>

    <!-- Full vertical diameter [-a, +a] -->
    <line x1="205" y1="260" x2="205" y2="84" stroke="#34506a" stroke-width="1.4" stroke-dasharray="3 3"/>
    <!-- Basis vector a (north pole, observer chosen axis in amber) -->
    <line x1="205" y1="172" x2="205" y2="86" stroke="#ffc83d" stroke-width="2.6" marker-end="url(#p2-amb)"/>
    <!-- State vector b at angle theta = 60 deg -->
    <line x1="205" y1="172" x2="281" y2="128" stroke="#ff2fd0" stroke-width="2.6" marker-end="url(#p2-mag)"/>
    <!-- Endogenous projection vector c = (a·b)a -->
    <line x1="281" y1="128" x2="205" y2="128" stroke="#cfe3ff" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="205" y1="172" x2="205" y2="130" stroke="#19f0ff" stroke-width="3.2" marker-end="url(#p2-cyan)"/>
    <!-- Right angle box at c -->
    <polyline points="205,137 214,137 214,128" fill="none" stroke="#cfe3ff" stroke-width="1"/>

    <!-- Angle arc theta -->
    <path d="M205 138 A34 34 0 0 1 234 155" fill="none" stroke="#d4efff" stroke-width="1.4"/>
    <text x="225" y="144" font-size="13" font-style="italic" fill="#d4efff">θ</text>

    <!-- Pole & point labels -->
    <circle cx="205" cy="84" r="3.5" fill="#ffc83d"/>
    <circle cx="205" cy="260" r="3.5" fill="#6f8ea5"/>
    <circle cx="205" cy="128" r="4" fill="#19f0ff"/>
    <text x="205" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#ffc83d">+a (θ = 0)</text>
    <text x="205" y="278" text-anchor="middle" font-size="12" fill="#6f8ea5">−a (θ = π)</text>
    <text x="292" y="128" font-size="13" font-weight="600" fill="#ff2fd0">b</text>
    <text x="193" y="126" text-anchor="end" font-size="12" font-weight="600" fill="#19f0ff">c = (a·b)a</text>

    <!-- Dimension bracket for (1 + cos theta)/2 along diameter -->
    <line x1="100" y1="260" x2="100" y2="128" stroke="#19f0ff" stroke-width="1.8"/>
    <line x1="94" y1="260" x2="106" y2="260" stroke="#19f0ff" stroke-width="1.8"/>
    <line x1="94" y1="128" x2="106" y2="128" stroke="#19f0ff" stroke-width="1.8"/>
    <line x1="106" y1="128" x2="201" y2="128" stroke="#34506a" stroke-width="0.9" stroke-dasharray="2 3"/>
    <line x1="106" y1="260" x2="201" y2="260" stroke="#34506a" stroke-width="0.9" stroke-dasharray="2 3"/>
    <text x="88" y="196" text-anchor="end" font-size="11" fill="#19f0ff">1 + cos θ</text>
    <text x="88" y="212" text-anchor="end" font-size="11" fill="#6f8ea5">(full = 2)</text>

    <!-- RIGHT PANEL: Hilbert Ray Plane C^2 half-angle theta/2 -->
    <text x="645" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#9d8cff">HILBERT RAYS ℂ² · HALF-ANGLE θ/2</text>

    <!-- Quarter/Semicircle in Hilbert plane -->
    <path d="M510 236 A150 150 0 0 1 660 86" fill="#9d8cff" fill-opacity="0.05" stroke="#34506a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Orthogonal axes |phi> (horizontal) and |phi_perp> (vertical) -->
    <line x1="510" y1="236" x2="660" y2="236" stroke="#ffc83d" stroke-width="2.6" marker-end="url(#p2-amb)"/>
    <line x1="510" y1="236" x2="510" y2="86" stroke="#6f8ea5" stroke-width="1.8" stroke-dasharray="4 3"/>
    <!-- State |psi> at angle theta/2 = 30 deg -->
    <line x1="510" y1="236" x2="640" y2="161" stroke="#ff2fd0" stroke-width="2.6" marker-end="url(#p2-mag)"/>
    <!-- Projection of |psi> onto |phi> -->
    <line x1="640" y1="161" x2="640" y2="236" stroke="#cfe3ff" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="510" y1="236" x2="638" y2="236" stroke="#19f0ff" stroke-width="3.4"/>
    <polyline points="631,236 631,227 640,227" fill="none" stroke="#cfe3ff" stroke-width="1"/>

    <!-- Half-angle arc theta/2 -->
    <path d="M566 236 A56 56 0 0 0 558 208" fill="none" stroke="#d4efff" stroke-width="1.4"/>
    <text x="584" y="222" font-size="12" fill="#d4efff">θ/2</text>

    <text x="672" y="240" font-size="13" font-weight="600" fill="#ffc83d">|φ⟩ (θ = 0)</text>
    <text x="510" y="75" text-anchor="middle" font-size="12" fill="#6f8ea5">|φ⊥⟩ (θ/2 = π/2 ⇔ θ = π)</text>
    <text x="650" y="156" font-size="13" font-weight="600" fill="#ff2fd0">|ψ⟩</text>
    <text x="575" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">|⟨φ|ψ⟩| = cos(θ/2)</text>
    <text x="720" y="198" font-size="12" fill="#cfe3ff">p = cos²(θ/2)</text>
    <text x="720" y="216" font-size="12" fill="#19f0ff">  = ½(1 + cos θ)</text>

    <!-- Bottom Lean-verified bar -->
    <rect x="28" y="308" width="804" height="28" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1"/>
    <text x="430" y="326" text-anchor="middle" font-size="12" fill="#46ffb2">LEAN ✓  recordWeight(P, ρ, k) = Tr(ρ Pₖ) = ‖φ* ψ‖²   ·   unreadState(P, ρ) = ∑ⱼ wⱼ conditionalState(P, ρ, j)</text>
  </g>
</svg>
