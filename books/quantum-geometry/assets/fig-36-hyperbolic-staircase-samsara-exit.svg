    <text x="300" y="149" fill="#d4efff" font-size="8.2">λ = 0 ⇒ θ → 90°, cos 90° = 0</text>
    <text x="300" y="164" fill="#6f8ea5" font-size="8">一维锚点清零·擦表失忆</text>
    <text x="300" y="178" fill="#6f8ea5" font-size="8">90° → 0⁺ 折射重开盲搜</text>

    <rect x="292" y="198" width="160" height="76" rx="6" fill="#07101b" stroke="#19f0ff" stroke-width="1.1"/>
    <text x="300" y="215" fill="#19f0ff" font-size="8.8" font-weight="600">(b) 离散双曲阶梯 / Steps</text>
    <text x="300" y="231" fill="#d4efff" font-size="8.2">dη = sec θ dθ, η_k = η₀+kΔη</text>
    <text x="300" y="246" fill="#19f0ff" font-size="8">sin θ_k = tanh η_k → 1⁻</text>
    <text x="300" y="261" fill="#cfe3ff" font-size="8">cos θ_k = sech η_k &gt; 0 恒正</text>

    <rect x="292" y="284" width="160" height="84" rx="6" fill="#07101b" stroke="#9d8cff" stroke-width="1.1"/>
    <text x="300" y="301" fill="#9d8cff" font-size="8.8" font-weight="600">(c) 自指商空间 / Quotient</text>
    <text x="300" y="317" fill="#d4efff" font-size="8.2">MODEL: cos θ* = θ* ≈ 0.7391</text>
    <text x="300" y="333" fill="#46ffb2" font-size="8">LEAN: Refines ↔ Continuous</text>
    <text x="300" y="348" fill="#46ffb2" font-size="8">LEAN: Poisson Annihilator</text>
    <text x="300" y="362" fill="#6f8ea5" font-size="7.8">生成元一次约去周期死循环</text>

