    <text x="534" y="287" text-anchor="end" fill="#6f8ea5" font-size="8.5">0.0</text>
    <text x="906" y="128" text-anchor="end" fill="#ff8a3c" font-size="8.3">纯光断崖上限 / Pure-Light Limit = 1</text>

    <!-- Discrete Staircase Risers for sin theta_k -->
