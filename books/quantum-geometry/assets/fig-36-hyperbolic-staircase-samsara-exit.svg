<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <title>Chapter 36: Infinite Discrete Hyperbolic Staircase and Quotienting Out Reincarnation</title>
  <desc>Bilingual two-panel diagram. Left panel: Hyperbolic horizon disk contrasting the red dashed continuous crash across theta = 90 degrees (cos 90 = 0 amnesia and reincarnation loop), the cyan discrete intrinsic rapidity staircase eta_k = eta_0 + k Delta_eta spiraling inside the unit horizon, and the central self-referential fixed-point anchor theta* approx 0.7391 quotienting out redundant cycles. Right panel: Dual asymptotic curves over discrete step k showing transverse reach sin theta_k = tanh eta_k approaching 1 while idempotent anchor retention cos theta_k = sech eta_k remains strictly positive.</desc>

  <rect x="6" y="6" width="948" height="428" rx="14" fill="#07101b" stroke="#143049" stroke-width="2"/>
  <text x="28" y="34" font-family="JetBrains Mono,monospace" font-size="13.5" font-weight="600" fill="#19f0ff">CHAPTER 36 · 无穷离散步与约去轮回 / HYPERBOLIC STAIRCASE &amp; QUOTIENTING REINCARNATION</text>
  <text x="28" y="54" font-family="JetBrains Mono,monospace" font-size="10.2" fill="#6f8ea5">阻断 cos 90° = 0 纯光失忆断崖的内禀双曲阶梯 η_k = η₀ + k Δη 与自指商空间 T = T(T) / Blocking the pure-light amnesia cliff</text>

  <line x1="478" y1="68" x2="478" y2="386" stroke="#143049" stroke-width="1.2"/>

