    <text x="715" y="88" text-anchor="middle" fill="#19f0ff" font-size="11.2" font-weight="600">II · 离散步 k 渐近双曲线 / DUAL CURVES OVER STEP k</text>
    <rect x="494" y="98" width="442" height="284" rx="8" fill="#050c16" stroke="#34506a"/>

