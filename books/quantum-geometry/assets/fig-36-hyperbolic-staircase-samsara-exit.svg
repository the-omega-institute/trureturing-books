    <!-- Bottom Summary Box in Right Panel -->
    <rect x="510" y="310" width="410" height="60" rx="6" fill="#07101b" stroke="#1f5d7c"/>
    <text x="522" y="327" fill="#19f0ff" font-size="8.5">横向视野覆盖 / Reach:   sin θ_k = tanh η_k = 1 - 2/(e^(2η_k)+1) → 1⁻</text>
    <text x="522" y="344" fill="#ff2fd0" font-size="8.5">一维自指锚点 / Anchor:  cos θ_k = sech η_k = 2/(e^(η_k)+e^(-η_k)) &gt; 0</text>
    <text x="522" y="361" fill="#9d8cff" font-size="8.5">多面体护城河 / Gap:     δ_k = π/2 - θ_k &gt; 0 (球只是近似，缝隙阻断失忆)</text>
