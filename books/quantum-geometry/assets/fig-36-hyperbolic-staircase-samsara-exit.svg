    <rect x="24" y="98" width="440" height="284" rx="8" fill="#050c16" stroke="#34506a"/>

    <!-- Conformal Horizon Disk centered at (166, 240), R = 104 -->
    <circle cx="166" cy="240" r="104" fill="#02040a" stroke="#ff8a3c" stroke-width="2" stroke-dasharray="6,3"/>
    <circle cx="166" cy="240" r="99.6" fill="none" stroke="#143049" stroke-width="0.9"/>
    <circle cx="166" cy="240" r="92.4" fill="none" stroke="#143049" stroke-width="0.9"/>
    <circle cx="166" cy="240" r="75.1" fill="none" stroke="#143049" stroke-width="1"/>
    <circle cx="166" cy="240" r="40.3" fill="none" stroke="#9d8cff" stroke-width="1.2" stroke-dasharray="3,3"/>

    <line x1="56" y1="240" x2="276" y2="240" stroke="#143049" stroke-width="0.9"/>
    <line x1="166" y1="130" x2="166" y2="350" stroke="#143049" stroke-width="0.9"/>

    <!-- Boundary Cliff Label -->
    <text x="166" y="122" text-anchor="middle" fill="#ff8a3c" font-size="8.8" font-weight="600">θ = 90° (cos 90° = 0) 纯光失忆断崖 / Amnesia Cliff</text>

    <!-- (a) Unawakened Continuous Crash & Reincarnation Loop -->
    <path d="M 166 240 L 252 178 L 278 159" fill="none" stroke="#ff8a3c" stroke-width="1.9" stroke-dasharray="4,3"/>
