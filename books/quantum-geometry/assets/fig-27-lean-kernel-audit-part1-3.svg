<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <title>Lean 4 Kernel Proof Audit for Parts I–III</title>
  <desc>Three-panel diagram auditing the Lean 4 proof architecture across Parts I to III: the parallelogram norm law, the Born probability skeleton and ray phase rigidity, and finite record pinching idempotence.</desc>
  <rect x="6" y="6" width="908" height="408" rx="14" fill="#0a0c12" stroke="#143049" stroke-width="2"/>
  <text x="30" y="36" font-family="JetBrains Mono,monospace" font-size="15" font-weight="600" fill="#19f0ff">CHAPTER 27 · LEAN 4 KERNEL AUDIT I (PARTS I–III SPINE)</text>
  <text x="30" y="56" font-family="JetBrains Mono,monospace" font-size="10.5" fill="#6f8ea5">Line-by-line proof anatomy: parallelogram norm law, Born probability skeleton, ray phase rigidity, pinching idempotence</text>

  <line x1="310" y1="74" x2="310" y2="356" stroke="#143049" stroke-width="1.2"/>
  <line x1="615" y1="74" x2="615" y2="356" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono,monospace">
    <!-- PANEL I: Parallelogram & Born Skeleton -->
    <text x="158" y="92" text-anchor="middle" fill="#19f0ff" font-size="11.5" font-weight="600">I · NORM &amp; BORN SKELETON</text>
    <rect x="24" y="106" width="268" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="158" y="128" text-anchor="middle" fill="#46ffb2" font-size="9.5" font-weight="600">LEAN ✓ inner_product_norm_parallelogram_law</text>
    <text x="158" y="148" text-anchor="middle" fill="#d4efff" font-size="10">‖x+y‖² + ‖x−y‖² = 2(‖x‖² + ‖y‖²)</text>
    <text x="158" y="166" text-anchor="middle" fill="#6f8ea5" font-size="9.5">parallelogram_law_with_norm ℝ x y</text>
    <line x1="38" y1="180" x2="278" y2="180" stroke="#143049"/>
    <text x="158" y="200" text-anchor="middle" fill="#46ffb2" font-size="10" font-weight="600">LEAN ✓ born_probability_skeleton</text>
    <text x="158" y="218" text-anchor="middle" fill="#9d8cff" font-size="9.5">Hyp: ρ.PosSemidef, Tr(ρ)=1</text>
    <text x="158" y="236" text-anchor="middle" fill="#d4efff" font-size="9.5">1) Tr(ρ·1)=1  2) Tr(ρ(P+Q)) additive</text>
    <text x="158" y="254" text-anchor="middle" fill="#19f0ff" font-size="10">3) P*=P, P²=P ⇒ 0 ≤ Tr(ρP)</text>
    <text x="158" y="276" text-anchor="middle" fill="#9d8cff" font-size="9.5">hRho.mul_mul_conjTranspose_same P</text>
    <text x="158" y="296" text-anchor="middle" fill="#9d8cff" font-size="9.5">Tr(PρP*) = Tr(P*Pρ) = Tr(ρP)</text>
    <text x="158" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">exact hCompressed.trace_nonneg</text>

    <!-- PANEL II: Connected Ray Phase Rigidity -->
    <text x="462" y="92" text-anchor="middle" fill="#ff2fd0" font-size="11.5" font-weight="600">II · RAY PHASE RIGIDITY</text>
    <rect x="328" y="106" width="270" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="463" y="128" text-anchor="middle" fill="#46ffb2" font-size="9.5" font-weight="600">LEAN ✓ unitary_phase_of_connected_ray_tests</text>
    <text x="463" y="148" text-anchor="middle" fill="#9d8cff" font-size="9.5">A ∈ U(n), hcoord, htests, hconnect</text>
    <text x="463" y="168" text-anchor="middle" fill="#d4efff" font-size="9.5">hcoord ⇒ ∀ i ≠ j, A i j = 0 (diag)</text>
    <!-- Active proof step highlighted in amber -->
    <rect x="342" y="182" width="242" height="54" rx="6" fill="#050c16" stroke="#ffc83d" stroke-width="1.3"/>
    <text x="463" y="200" text-anchor="middle" fill="#ffc83d" font-size="10" font-weight="600">now: SUPPORT-CHAIN INDUCTION</text>
    <text x="463" y="220" text-anchor="middle" fill="#d4efff" font-size="9.5">xᵢ≠0 ∧ xⱼ≠0 ⇒ Aᵢᵢ=Aⱼⱼ (ReflTransGen)</text>
    <text x="463" y="262" text-anchor="middle" fill="#ff2fd0" font-size="10">A ∈ U(ι, ℂ) ⇒ star c * c = 1</text>
    <text x="463" y="286" text-anchor="middle" fill="#19f0ff" font-size="10.5">∃ c : ℂ, ‖c‖ = 1 ∧ A = c • 1</text>
    <text x="463" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">handles empty or nonempty finite ι</text>

    <!-- PANEL III: Finite Record Pinching Idempotence -->
    <text x="764" y="92" text-anchor="middle" fill="#9d8cff" font-size="11.5" font-weight="600">III · PINCHING IDEMPOTENCE</text>
    <rect x="632" y="106" width="264" height="238" rx="8" fill="#07101b" stroke="#34506a"/>
    <text x="764" y="128" text-anchor="middle" fill="#46ffb2" font-size="9.5" font-weight="600">LEAN ✓ finite_record_pinching_idempotent</text>
    <text x="764" y="150" text-anchor="middle" fill="#d4efff" font-size="10">unreadState P ρ = ∑ k, P_k ρ P_k</text>
    <text x="764" y="172" text-anchor="middle" fill="#9d8cff" font-size="10">left_project_unread (hP):</text>
    <text x="764" y="194" text-anchor="middle" fill="#d4efff" font-size="10">P_k · (∑ l, P_l ρ P_l) = P_k ρ P_k</text>
    <text x="764" y="216" text-anchor="middle" fill="#6f8ea5" font-size="9.5">(hP.orthogonal &amp; hP.idempotent)</text>
    <line x1="646" y1="232" x2="882" y2="232" stroke="#143049"/>
    <text x="764" y="260" text-anchor="middle" fill="#19f0ff" font-size="10.5">(unreadState P) ∘ (unreadState P)</text>
    <text x="764" y="282" text-anchor="middle" fill="#19f0ff" font-size="10.5">= unreadState P</text>
    <text x="764" y="324" text-anchor="middle" fill="#6f8ea5" font-size="9.5">funext ρ; unreadState_idempotent</text>
  </g>

  <rect x="24" y="368" width="872" height="30" rx="6" fill="#050c16" stroke="#1f5d7c"/>
  <text x="460" y="388" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#46ffb2">LEAN ✓  inner_product_norm_parallelogram_law · born_probability_skeleton · unitary_phase_of_connected_ray_tests · finite_record_pinching_idempotent</text>
</svg>
