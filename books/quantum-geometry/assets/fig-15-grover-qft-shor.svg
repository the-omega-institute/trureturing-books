<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="f15-title f15-desc">
<title id="f15-title">Grover、相位齿轮与周期频率 / Grover, phase gears, and period frequencies</title>
<desc id="f15-desc">Grover is a two-reflection rotation by twice alpha in a one-source invariant plane. Three equatorial phase gears show the QFT phases for binary 101. An exact period-four example on sixteen samples has four resonant frequencies. Green badges certify the rotation and finite character cancellation, not the full Shor algorithm.</desc>
