<text x="460" y="325" text-anchor="middle" font-size="10" fill="#6f8ea5" >含位序交换 / includes final bit reversal</text>
<text x="460" y="350" text-anchor="middle" font-size="12" fill="#9d8cff" >χₖ(x) = exp(2πikx/Q)</text>
