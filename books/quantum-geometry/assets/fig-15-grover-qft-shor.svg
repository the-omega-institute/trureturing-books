<text x="184" y="112" text-anchor="middle" font-size="12" fill="#9d8cff" >2α</text>
<text x="235" y="138" text-anchor="middle" font-size="12" fill="#19f0ff" >a</text>
<text x="143" y="91" text-anchor="middle" font-size="12" fill="#ff2fd0" >b</text>
<text x="154" y="283" text-anchor="middle" font-size="11" fill="#d4efff" >Q = (2|s⟩⟨s|−I)(I−2P)</text>
<text x="154" y="308" text-anchor="middle" font-size="12" fill="#d4efff" >a∧b · sin²((2n+1)α)</text>
<text x="154" y="330" text-anchor="middle" font-size="11" fill="#6f8ea5" >N=4: α=π/6 → 1 step</text>
