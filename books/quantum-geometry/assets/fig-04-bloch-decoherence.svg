<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 356" width="860" height="356">
  <defs>
    <marker id="p4-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
    <marker id="p4-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/>
    </marker>
    <marker id="p4-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/>
    </marker>
    <marker id="p4-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="852" height="348" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
  <line x1="286" y1="28" x2="286" y2="294" stroke="#143049" stroke-width="1.2"/>
  <line x1="574" y1="28" x2="574" y2="294" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, system-ui, sans-serif">
    <!-- PANEL I: Pure Shell vs Truncated Interior Vector -->
    <text x="145" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">I · TRUNCATED CHORD (‖r‖ &lt; 1)</text>
    <circle cx="136" cy="162" r="74" fill="#19f0ff" fill-opacity="0.04" stroke="#19f0ff" stroke-width="1.6"/>
    <ellipse cx="136" cy="162" rx="74" ry="20" fill="none" stroke="#34506a" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Pure vector on shell (dashed reference) -->
    <line x1="136" y1="162" x2="196" y2="118" stroke="#34506a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <circle cx="196" cy="118" r="3" fill="#19f0ff"/>
    <!-- Truncated mixed state vector inside ball -->
    <line x1="136" y1="162" x2="168" y2="139" stroke="#ff2fd0" stroke-width="3" marker-end="url(#p4-mag)"/>
    <!-- Orthogonal leakage into Env -->
    <line x1="168" y1="139" x2="232" y2="104" stroke="#9d8cff" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#p4-vio)"/>
    <text x="236" y="102" font-size="11" fill="#9d8cff">Env</text>
    <text x="146" y="80" text-anchor="middle" font-size="11" fill="#19f0ff">‖r‖ = 1 (pure)</text>
    <text x="192" y="156" font-size="11" fill="#ff2fd0">‖r‖ = cos θ_env</text>
    <text x="145" y="256" text-anchor="middle" font-size="12" fill="#d4efff">Tr_env(U_copy(ρ ⊗ |0⟩⟨0|)U*)</text>
    <text x="145" y="276" text-anchor="middle" font-size="11" fill="#6f8ea5">= ∑ₐ Pₐ ρ Pₐ</text>

    <!-- PANEL II: Phase Damping (Ellipsoid -> Vertical Segment) -->
    <text x="430" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#ff2fd0">II · PHASE DAMPING (c^N → 0)</text>
    <text x="430" y="59" text-anchor="middle" font-size="12" fill="#ff2fd0">0 ≤ c &lt; 1</text>
    <!-- Outer pure sphere -->
    <circle cx="430" cy="162" r="74" fill="none" stroke="#34506a" stroke-width="1.3" stroke-dasharray="4 3"/>
    <!-- Intermediate prolate ellipsoids c^N -->
    <ellipse cx="430" cy="162" rx="46" ry="74" fill="#ff2fd0" fill-opacity="0.07" stroke="#ff2fd0" stroke-opacity="0.55" stroke-width="1.3"/>
    <ellipse cx="430" cy="162" rx="22" ry="74" fill="#ff2fd0" fill-opacity="0.12" stroke="#ff2fd0" stroke-width="1.5"/>
    <!-- Final classical vertical segment P(rho) -->
    <line x1="430" y1="88" x2="430" y2="236" stroke="#ffc83d" stroke-width="3.2"/>
    <circle cx="430" cy="88" r="3.8" fill="#ffc83d"/>
    <circle cx="430" cy="236" r="3.8" fill="#ffc83d"/>
    <!-- Inward compression arrows -->
    <line x1="500" y1="162" x2="458" y2="162" stroke="#ff2fd0" stroke-width="1.8" marker-end="url(#p4-mag)"/>
    <line x1="360" y1="162" x2="402" y2="162" stroke="#ff2fd0" stroke-width="1.8" marker-end="url(#p4-mag)"/>
    <text x="488" y="148" font-size="11" fill="#ff2fd0">c^N ρ₀₁</text>
    <text x="430" y="256" text-anchor="middle" font-size="12" fill="#d4efff">(rₓ, rᵧ, r_z) ↦ (c^N rₓ, c^N rᵧ, r_z)</text>
    <text x="430" y="276" text-anchor="middle" font-size="11" fill="#ffc83d">c = 0 : pinching P(ρ)</text>

    <!-- PANEL III: Amplitude Damping & Maximally Mixed Center -->
    <text x="716" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#9d8cff">III · AMPLITUDE DRIFT &amp; r = 0</text>
    <!-- Outer pure sphere -->
    <circle cx="716" cy="162" r="74" fill="none" stroke="#34506a" stroke-width="1.3" stroke-dasharray="4 3"/>
    <!-- Amplitude-damped ellipsoid shifted toward north pole (+e_3 at y=88) -->
    <ellipse cx="716" cy="128" rx="48" ry="40" fill="#9d8cff" fill-opacity="0.14" stroke="#9d8cff" stroke-width="1.6"/>
    <!-- North pole attractor |0> -->
    <circle cx="716" cy="88" r="4.5" fill="#19f0ff"/>
    <line x1="716" y1="196" x2="716" y2="100" stroke="#9d8cff" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#p4-vio)"/>
    <!-- Maximally mixed dead center r = 0 -->
    <circle cx="716" cy="162" r="5" fill="#ffc83d" stroke="#07101b" stroke-width="1.2"/>
    <text x="716" y="77" text-anchor="middle" font-size="11" fill="#19f0ff">+e₃ (u = 1)</text>
    <text x="730" y="168" font-size="12" font-weight="600" fill="#ffc83d">r = 0 (ρ* = ½I)</text>
    <text x="716" y="256" text-anchor="middle" font-size="12" fill="#d4efff">u′ = (1 − γ)u + γ</text>
    <text x="716" y="276" text-anchor="middle" font-size="11" fill="#9d8cff">SLD: 1 − γ  |  RLD → 1 (u → 1⁻)</text>
    <text x="716" y="292" text-anchor="middle" font-size="12" fill="#9d8cff">0 ≤ γ &lt; 1</text>

    <!-- Bottom Lean-verified bar -->
    <rect x="28" y="306" width="804" height="28" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1"/>
    <text x="430" y="324" text-anchor="middle" font-size="12" fill="#46ffb2">LEAN ✓  ⟨ρ, ρ⟩_HS = ⟨P(ρ), P(ρ)⟩_HS + (|ρ₀₁|² + |ρ₁₀|²)   ·   P(ρ) = ρ ⇔ offDiag(ρ) = 0</text>
  </g>
</svg>
