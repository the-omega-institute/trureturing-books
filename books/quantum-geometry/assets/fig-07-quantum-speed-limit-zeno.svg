<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <marker id="f7-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#19f0ff"/>
    </marker>
    <marker id="f7-vio" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#9d8cff"/>
    </marker>
    <marker id="f7-mag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ff2fd0"/>
    </marker>
    <marker id="f7-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1.5L8.5 5L1 8.5Z" fill="#ffc83d"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="412" rx="12" fill="#07101b" stroke="#143049" stroke-width="1.5"/>
  <line x1="460" y1="28" x2="460" y2="352" stroke="#143049" stroke-width="1.2"/>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, system-ui, sans-serif">
    <!-- PANEL I (Left Half): Unitary Flow & Fubini-Study Quantum Speed Limit -->
    <text x="232" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">I · UNITARY FLOW &amp; FUBINI–STUDY SPEED LIMIT</text>
    <text x="232" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">面积是量子时间：翻越 90° 正交记录墙的最短时长</text>

    <!-- Spherical sector (Origin at 140, 232; radius 126) -->
    <path d="M 140 232 L 266 232 A 126 126 0 0 0 140 106 Z" fill="#9d8cff" fill-opacity="0.12" stroke="#34506a" stroke-width="1.2"/>
    <path d="M 266 232 A 126 126 0 0 0 140 106" fill="none" stroke="#9d8cff" stroke-width="2.4"/>

    <!-- Orthogonal target records m0 (horizontal) and m1 (vertical), <m0, m1> = 0 -->
    <line x1="140" y1="232" x2="274" y2="232" stroke="#19f0ff" stroke-width="2.6" marker-end="url(#f7-cyan)"/>
    <text x="294" y="236" font-size="12" font-weight="600" fill="#19f0ff">m₀</text>
    <line x1="140" y1="232" x2="140" y2="98" stroke="#19f0ff" stroke-width="2.6" marker-end="url(#f7-cyan)"/>
    <text x="140" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">m₁ (⟨m₀, m₁⟩ = 0)</text>
    <polyline points="140,218 154,218 154,232" fill="none" stroke="#19f0ff" stroke-width="1.3"/>

    <!-- Anchor state a in the middle -->
    <line x1="140" y1="232" x2="229" y2="143" stroke="#ff2fd0" stroke-width="2.4" marker-end="url(#f7-mag)"/>
    <circle cx="229" cy="143" r="4" fill="#ff2fd0"/>
    <text x="246" y="138" font-size="12" font-weight="600" fill="#ff2fd0">anchor a</text>

    <!-- Spherical triangle arcs: theta_FS(a, m0) and theta_FS(a, m1) -->
    <text x="278" y="192" font-size="11" fill="#9d8cff">θ_FS(a, m₀) ≤ Eτ/ℏ</text>
    <text x="220" y="112" font-size="11" fill="#9d8cff">θ_FS(a, m₁) ≤ Eτ/ℏ</text>
    <text x="166" y="220" text-anchor="start" font-size="8.8" fill="#d4efff">θ_FS(m₀,m₁) = π/2</text>

    <!-- Formula readout box on left -->
    <rect x="34" y="256" width="396" height="88" rx="8" fill="#050c16" stroke="#1f4260" stroke-width="1.2"/>
    <text x="232" y="276" text-anchor="middle" font-size="10.2" fill="#46ffb2">LEAN ✓  U(t) = exp(−itH),  p′(t) = Re(i Tr(ρ_t [H, P]))</text>
    <text x="232" y="298" text-anchor="middle" font-size="10.2" font-weight="600" fill="#46ffb2">LEAN ✓  π/2 = θ_FS(m₀, m₁) ≤ θ_FS(a, m₀) + θ_FS(a, m₁)</text>
    <text x="232" y="320" text-anchor="middle" font-size="10.5" font-weight="600" fill="#d4efff">⇒  τ ≥ πℏ / (4·energy),   N ≤ 4·energy·T / (πℏ)</text>

    <!-- PANEL II (Right Half): Quantum Zeno Strobe & Free-Energy Threshold -->
    <text x="688" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#19f0ff">II · ZENO STROBE &amp; FREE-ENERGY THRESHOLD (β &gt; β_c)</text>
    <text x="688" y="56" text-anchor="middle" font-size="11" fill="#6f8ea5">高频内积抽检芝诺效应 vs 标量自由能记账判据</text>

    <!-- Top Right Subpanel: Zeno survival curve vs free cosine oscillation -->
    <rect x="488" y="74" width="400" height="122" rx="8" fill="#050c16" stroke="#1f4260" stroke-width="1.2"/>
    <line x1="522" y1="176" x2="864" y2="176" stroke="#34506a" stroke-width="1.2"/>
    <line x1="522" y1="176" x2="522" y2="88" stroke="#34506a" stroke-width="1.2"/>
    <text x="514" y="98" text-anchor="end" font-size="9.5" fill="#d4efff">1.0</text>
    <text x="514" y="176" text-anchor="end" font-size="9.5" fill="#6f8ea5">0.0</text>

    <!-- Unmeasured free evolution cos^2(wt/2) dropping to 0 -->
    <path d="M 522 94 C 600 94, 680 170, 860 170" fill="none" stroke="#9d8cff" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="534" y="162" text-anchor="start" font-size="9.5" fill="#9d8cff">自由面积演化 cos²(ωt/2)</text>

    <!-- High-N Zeno stepped survival staying near 1 -->
    <path d="M 522 94 Q 564 95 606 99 L 606 94 Q 649 95 692 99 L 692 94 Q 736 95 780 99 L 780 94 Q 820 95 860 98" fill="none" stroke="#19f0ff" stroke-width="2.2"/>
    <!-- Single active present observation strobe highlighted in Amber -->
    <line x1="692" y1="88" x2="692" y2="176" stroke="#ffc83d" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="692" cy="94" r="4.5" fill="#ffc83d" stroke="#07101b" stroke-width="1.2"/>
    <text x="702" y="118" text-anchor="start" font-size="9.5" font-weight="600" fill="#ffc83d">当前频闪观测点 t_k</text>
    <text x="702" y="136" text-anchor="start" font-size="9.2" fill="#19f0ff">P_N(T) = [cos²(ωT/2N)]^N → 1</text>

    <!-- Bottom Right Subpanel: Scalar Free-Energy Accounting Criterion -->
    <rect x="488" y="210" width="400" height="134" rx="8" fill="#050c16" stroke="#1f4260" stroke-width="1.2"/>
    <text x="688" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#46ffb2">LEAN ✓  D_freeze(β, ΔS, ΔE_pass) = ΔE_pass − ΔS / β</text>

    <!-- Beta axis -->
    <line x1="524" y1="282" x2="852" y2="282" stroke="#34506a" stroke-width="1.6" marker-end="url(#f7-cyan)"/>
    <!-- Region beta < beta_c -->
    <rect x="524" y="266" width="146" height="16" fill="#ff2fd0" fill-opacity="0.22"/>
    <text x="588" y="258" text-anchor="middle" font-size="9.2" fill="#ff2fd0">β &lt; β_c (D_freeze &lt; 0)</text>
    <!-- Positive Free-Energy Deposit region beta > beta_c -->
    <rect x="670" y="266" width="172" height="16" fill="#19f0ff" fill-opacity="0.22"/>
    <text x="764" y="258" text-anchor="middle" font-size="9.2" fill="#19f0ff">β &gt; β_c : 正余量 (D_freeze &gt; 0)</text>
    <!-- Critical point beta_c -->
    <line x1="670" y1="252" x2="670" y2="296" stroke="#d4efff" stroke-width="2"/>
    <text x="670" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#d4efff">β_c = ΔS / ΔE_pass</text>
    <text x="688" y="332" text-anchor="middle" font-size="11" fill="#46ffb2">LEAN ✓  0 &lt; D_freeze(β, ΔS, ΔE_pass)  ⇔  β_c &lt; β</text>

    <!-- Bottom Lean-verified bar -->
    <rect x="24" y="364" width="872" height="34" rx="6" fill="#050c16" stroke="#1f5d7c" stroke-width="1"/>
    <text x="460" y="385" text-anchor="middle" font-size="11" fill="#46ffb2">LEAN ✓  calibrated_group · projection_probability_flow · record_time_lower_bound · decoherence_freeze_iff_above_critical</text>
  </g>
</svg>
