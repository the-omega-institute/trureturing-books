<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch06-gram-deficit" data-lang="zh" viewBox="0 0 540 300" width="540" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="左边：灰色的箭头 u 与琥珀色的箭头 v 不一样长，张出一块品红的平行四边形，面积是 |u∧v|。右边：一个直角三角形，横的直角边长 |u·v|，竖的直角边长 |u∧v|，斜边长 |u||v|；三条边上各立一个正方形：青色的 (u·v)²、品红的 |u∧v|²、斜边上的 |u|²|v|²。两个小正方形合起来正好等于大正方形，品红的那一块就是柯西—施瓦茨不等式两边的差。">
<title>左边：灰色的箭头 u 与琥珀色的箭头 v 不一样长，张出一块品红的平行四边形，面积是 |u∧v|。右边：一个直角三角形，横的直角边长 |u·v|，竖的直角边长 |u∧v|，斜边长 |u||v|；三条边上各立一个正方形：青色的 (u·v)²、品红的 |u∧v|²、斜边上的 |u|²|v|²。两个小正方形合起来正好等于大正方形，品红的那一块就是柯西—施瓦茨不等式两边的差。</title>
