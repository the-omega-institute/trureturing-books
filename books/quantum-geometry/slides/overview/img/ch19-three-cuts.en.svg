<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch19-three-cuts" data-lang="en" viewBox="0 0 500 330" width="500" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The width-three bridge graph: three bridges run side by side between tensor M on the left and tensor N on the right; M has a leg a = 2 going up and a leg b = 3 going down, N has d = 3 up and c = 2 down. Three dashed lines are the three candidate cuts: the top one crosses both upper legs, capacity ad = 6; the bottom one crosses both lower legs, capacity bc = 6; a slanting one crosses leg a, the three bridges and leg c, capacity 3ac = 12. The two outer cuts are magenta and are the min cut, capacity 6; the slanting inner cut is grey.">
<title>The width-three bridge graph: three bridges run side by side between tensor M on the left and tensor N on the right; M has a leg a = 2 going up and a leg b = 3 going down, N has d = 3 up and c = 2 down. Three dashed lines are the three candidate cuts: the top one crosses both upper legs, capacity ad = 6; the bottom one crosses both lower legs, capacity bc = 6; a slanting one crosses leg a, the three bridges and leg c, capacity 3ac = 12. The two outer cuts are magenta and are the min cut, capacity 6; the slanting inner cut is grey.</title>
