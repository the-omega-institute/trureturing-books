<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：左边一只眼睛，青色的入射光沿 −A 从右边迎面射进眼里；A 是从眼睛指向光源的单位几何方向，与琥珀色的视线 O 同向，标着 O·A = 1；下方一个小圆是眼睛看到的样子：正中只有一个亮点。第二栏：两支单位箭头 A（灰）与 B（琥珀）从同一点出发，夹角 θ，按带箭头的小圈 Î 所示的方向从 A 转到 B；它们张成的平行四边形涂成品红，标着 A∧B = sin θ Î。第三栏：一个球，赤道画成青色，标着 S^{n−1}；球的轮廓标着 S^{n}；一根紫色的竖轴穿过两极，两极标着 ±e_{n+1}。">
<title>三栏。第一栏：左边一只眼睛，青色的入射光沿 −A 从右边迎面射进眼里；A 是从眼睛指向光源的单位几何方向，与琥珀色的视线 O 同向，标着 O·A = 1；下方一个小圆是眼睛看到的样子：正中只有一个亮点。第二栏：两支单位箭头 A（灰）与 B（琥珀）从同一点出发，夹角 θ，按带箭头的小圈 Î 所示的方向从 A 转到 B；它们张成的平行四边形涂成品红，标着 A∧B = sin θ Î。第三栏：一个球，赤道画成青色，标着 S^{n−1}；球的轮廓标着 S^{n}；一根紫色的竖轴穿过两极，两极标着 ±e_{n+1}。</title>
