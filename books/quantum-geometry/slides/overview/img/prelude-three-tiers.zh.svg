<text class="tf-warn tr-fig-mono" x="75.4" y="190" font-size="14" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600">OPEN</text>
<rect x="128" y="172" width="9.23" height="24" class="ts-warn tf-warn" stroke-width="1.3" fill-opacity="0.28"/>
<text class="tf-warn" x="145.23" y="189.4" font-size="15" font-weight="600">7</text>
