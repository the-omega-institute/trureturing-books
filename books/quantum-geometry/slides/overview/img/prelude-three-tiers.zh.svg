<text class="tf-violet tr-fig-mono" x="53" y="118" font-size="14" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="600">文献结果</text>
<rect x="128" y="100" width="210.91" height="24" class="ts-violet tf-violet" stroke-width="1.3" fill-opacity="0.28"/>
