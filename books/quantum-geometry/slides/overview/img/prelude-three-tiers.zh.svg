<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-three-tiers" data-lang="zh" viewBox="0 0 480 230" width="480" height="230" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三条横条，各配一个标签。最上面一条绿色，标签 LEAN ✓，是带 Lean 引用的定理、引理、命题与推论的条数，最长；中间一条紫色，标签“文献结果”，是标明文献结果的注记与例的条数；最下面一条红色，标签 OPEN，是开放猜想的条数，很短。每条横条末端写着条数，绿色一条下面另注锁文件里 theorem 声明的条数。">
<title>三条横条，各配一个标签。最上面一条绿色，标签 LEAN ✓，是带 Lean 引用的定理、引理、命题与推论的条数，最长；中间一条紫色，标签“文献结果”，是标明文献结果的注记与例的条数；最下面一条红色，标签 OPEN，是开放猜想的条数，很短。每条横条末端写着条数，绿色一条下面另注锁文件里 theorem 声明的条数。</title>
<style>.ts-ink{stroke:#d4efff}.tf-ink{fill:#d4efff}.ts-dim{stroke:#6f8ea5}.tf-dim{fill:#6f8ea5}.ts-faint{stroke:#34506a}.tf-faint{fill:#34506a}.ts-edge{stroke:#143049}.tf-edge{fill:#143049}.ts-hot{stroke:#1f5d7c}.tf-hot{fill:#1f5d7c}.ts-bg{stroke:#03060c}.tf-bg{fill:#03060c}.ts-panel{stroke:#07101b}.tf-panel{fill:#07101b}.ts-sheet{stroke:#050c16}.tf-sheet{fill:#050c16}.ts-cyan{stroke:#19f0ff}.tf-cyan{fill:#19f0ff}.ts-magenta{stroke:#ff2fd0}.tf-magenta{fill:#ff2fd0}.ts-amber{stroke:#ffc83d}.tf-amber{fill:#ffc83d}.ts-violet{stroke:#9d8cff}.tf-violet{fill:#9d8cff}.ts-ok{stroke:#46ffb2}.tf-ok{fill:#46ffb2}.ts-warn{stroke:#ff5064}.tf-warn{fill:#ff5064}.ts-blue{stroke:#2a7bff}.tf-blue{fill:#2a7bff}.ts-orange{stroke:#ff8a3c}.tf-orange{fill:#ff8a3c}.ts-sigma{stroke:#cfe3ff}.tf-sigma{fill:#cfe3ff}</style>
