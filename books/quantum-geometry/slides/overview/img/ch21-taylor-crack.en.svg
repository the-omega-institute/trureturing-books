<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch21-taylor-crack" data-lang="en" viewBox="0 0 480 300" width="480" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A plot with θ across from 0 to 3.5 and values from −1.6 to 1.3. The thick ink curve is cos θ. Three cyan curves are the cosine polynomials with the first N terms, N = 2, 3, 4: for small θ all lie on cos θ, and to the right they leave it one after another, each further out. The gap between the N = 3 curve and cos θ is shaded magenta and labelled R₆(θ); at the left it is too thin to see, to the right it opens wider and wider.">
<title>A plot with θ across from 0 to 3.5 and values from −1.6 to 1.3. The thick ink curve is cos θ. Three cyan curves are the cosine polynomials with the first N terms, N = 2, 3, 4: for small θ all lie on cos θ, and to the right they leave it one after another, each further out. The gap between the N = 3 curve and cos θ is shaded magenta and labelled R₆(θ); at the left it is too thin to see, to the right it opens wider and wider.</title>
