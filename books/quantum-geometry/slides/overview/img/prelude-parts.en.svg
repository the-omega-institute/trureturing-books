<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-parts" data-lang="en" viewBox="0 0 480 320" width="480" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Ten bars form a staircase rising to the upper right. The lowest is Part I (point → line, chapters 1–4); above it come Part II (line → plane, 5–8), Part III (plane → sphere, 9–12), Part IV (entangled spheres, 13–16), Part V (spacetime sphere, 17–20), Part VI (beyond the sphere, 21–24), Part VII (construction, 25–28), Part VIII (synthesis, 29–32), Part IX (mutual illumination, 33–36), and at the top Part X (non-duality, 37–39). Each bar carries its chapter range, with the part&#x27;s name on the left.">
<title>Ten bars form a staircase rising to the upper right. The lowest is Part I (point → line, chapters 1–4); above it come Part II (line → plane, 5–8), Part III (plane → sphere, 9–12), Part IV (entangled spheres, 13–16), Part V (spacetime sphere, 17–20), Part VI (beyond the sphere, 21–24), Part VII (construction, 25–28), Part VIII (synthesis, 29–32), Part IX (mutual illumination, 33–36), and at the top Part X (non-duality, 37–39). Each bar carries its chapter range, with the part&#x27;s name on the left.</title>
