# 《量子计算的几何直觉》书籍元数据
[book]
version = "0.1.0"
authors = ["Auric"]
license = "CC-BY-4.0"
editions = ["zh", "en"]
# 含空行与代码的单页 Markdown 源码行数上限。
max_page_lines = 1000
max_chapters = 39
max_chapter_depth = 2
code = "ORTHO//QUANTUM"
date = "2026-11-20"
# Zenodo 概念 DOI，供本书各版本共同使用。
doi = "10.5281/zenodo.24156135"

[book.title]
zh = "量子计算的几何直觉"
en = "Geometric Intuition of Quantum Computing"

[book.subtitle]
zh = "从两子丈量、球外之球到 ψ = ψ(ψ)"
en = "From Pairwise Measurement and Spheres Beyond Spheres to ψ = ψ(ψ)"

[book.description]
zh = "一部将物理直觉、哲学谱系批判与机器形式化证明熔于一炉的双语专著与教材。全书从两子丈量与零冗余投影出发，依次经破妄（点到线）、展翼（线到面）、合拢（面到球）、交织（多球共振）、显影（时空之球）、越界（球外之球）、立极（无时间因果、视界、量子公平与比较公理）、造微与归弧（极小圆弧微积分、原生三元数与万力统一）、互照与破执（场内观察者、记忆指针、本体 QRAM 与测地智能）、不二与归元（观察者即宇宙本体与大一统母公理）。不编号的“铸器与圣殿”收录异或几何代数引擎、单比特旋子编译与 Lean 冻结证明导读。书中显式区分 Lean 验证、书面证明与开放问题；Lean 验证结果对应 trureturing 仓库中经内核验证并冻结的声明，书面证明由作者与评审负责。"
en = "A bilingual monograph and self-contained textbook uniting physical intuition, genealogical critique, and machine-checked proof. The ten parts trace a path from pairwise measurement and zero-redundancy projection through Breaking Illusions (point to line), Unfolding Wings (line to plane), Closing the Sphere (plane to sphere), Entangled Spheres, the Spacetime Sphere, Crossing the Horizon (spheres beyond spheres), Foundations (timeless causality, horizons, quantum fairness, and the Axiom of Comparison), Arcs and Unification (minimal circular-arc calculus, native ternions, and force unification), Mutual Illumination and Breaking Attachment (in-field observers, memory pointers, ontological QRAM, and geodesic intelligence), and Non-Duality and Return to the Source (the observer as the ontological universe and the Grand Unified Mother Axiom). The unnumbered Forge and Sanctuary presents the XOR geometric algebra engine, single-qubit rotor compilation, and guided readings of frozen Lean proofs. The book distinguishes Lean verification, written proofs, and open problems. Lean-verified results cite kernel-checked, frozen declarations in trureturing; authors and reviewers are responsible for written proofs."

[outputs]
html = true
pdf = ["screen", "print", "academic"]
epub = true

[films]
long_form = ["no-third-point"]

[html.fold]
# 侧栏保留各部与章名，进入子页时展开当前路径。
enable = true
level = 0

[pdf]
paper = "a4"
academic_paper = "a4"

[epub]
embed_fonts = false

# 终章、附录及其子页不占章号；定理环境使用各自的前缀。
