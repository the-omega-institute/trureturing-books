<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-three-tiers" data-lang="en" viewBox="0 0 480 230" width="480" height="230" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three bars, each with a tag. The top bar is green, tagged LEAN ✓: the theorems, lemmas, propositions and corollaries with a Lean reference, the longest. The middle bar is violet, tagged “literature”: the remarks and examples marked as literature results. The bottom bar is red, tagged OPEN: the open conjectures, very short. Each bar ends in its count; under the green bar a note gives the number of theorem declarations in the lock file.">
<title>Three bars, each with a tag. The top bar is green, tagged LEAN ✓: the theorems, lemmas, propositions and corollaries with a Lean reference, the longest. The middle bar is violet, tagged “literature”: the remarks and examples marked as literature results. The bottom bar is red, tagged OPEN: the open conjectures, very short. Each bar ends in its count; under the green bar a note gives the number of theorem declarations in the lock file.</title>
