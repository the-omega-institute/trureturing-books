<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch10-shutter-order" data-lang="zh" data-wrap="1" viewBox="0 0 540 280" width="540" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两栏，画的是态矢所在的实平面。每栏都有两条青色的线：水平的 |0⟩ 与斜 45° 的 |+⟩，还有同一支灰色的箭头 v。左栏“先 P₊ 再 P₀”：v 先垂直落到 |+⟩ 线上，再从那里垂直落到 |0⟩ 线上，琥珀色的箭头停在水平线上。右栏“先 P₀ 再 P₊”：v 先落到 |0⟩ 线上，再落到 |+⟩ 线上，琥珀色的箭头停在斜线上，而且短得多。">
<title>两栏，画的是态矢所在的实平面。每栏都有两条青色的线：水平的 |0⟩ 与斜 45° 的 |+⟩，还有同一支灰色的箭头 v。左栏“先 P₊ 再 P₀”：v 先垂直落到 |+⟩ 线上，再从那里垂直落到 |0⟩ 线上，琥珀色的箭头停在水平线上。右栏“先 P₀ 再 P₊”：v 先落到 |0⟩ 线上，再落到 |+⟩ 线上，琥珀色的箭头停在斜线上，而且短得多。</title>
