<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch23-quaternion-norm" data-lang="zh" viewBox="0 0 520 300" width="520" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="以 a = b = −1（哈密顿四元数）为例。横轴是标量部 x₀，也就是迹的一半，纵轴是向量部的长度 |v|。四个青色的半圆是约化范数 Nrd = 1、2、3、4。每个整四元数落在某个半圆与竖线 x₀ = 整数的交点上；点旁的数是落在这一点的整四元数个数，四个半圆上分别一共 8、24、32、24 个。半圆之间没有点，迹 2x₀ 只取 −4 到 4 的偶数。">
<title>以 a = b = −1（哈密顿四元数）为例。横轴是标量部 x₀，也就是迹的一半，纵轴是向量部的长度 |v|。四个青色的半圆是约化范数 Nrd = 1、2、3、4。每个整四元数落在某个半圆与竖线 x₀ = 整数的交点上；点旁的数是落在这一点的整四元数个数，四个半圆上分别一共 8、24、32、24 个。半圆之间没有点，迹 2x₀ 只取 −4 到 4 的偶数。</title>
