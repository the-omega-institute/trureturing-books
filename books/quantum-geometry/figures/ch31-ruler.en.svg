<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch31-ruler" data-lang="en" viewBox="0 0 440 330" width="440" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two ink unit arrows from one point, φ on the left and ψ on the right, at angle θ. Dropping perpendicularly from the tip of φ onto ψ gives one cyan shadow; dropping from the tip of ψ onto φ gives another. The two are mirror images, equally long, each labelled cos θ. Above, a grey point C joined to both tips by dashed lines is struck out with a cross.">
