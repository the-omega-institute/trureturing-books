<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch25-reversion" data-lang="en" data-wrap="1" viewBox="0 0 548 300" width="548" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Four panels for grades k = 0, 1, 2, 3. Each panel has the blade&#x27;s factors on top and the reversed order at the bottom; strands carry each factor to its new place, and each swap of two neighbours is drawn as two crossing magenta strands. The 1 of grade 0 and the e₁ of grade 1 have no crossing and a cyan + below; e₁e₂ reverses to e₂e₁ with 1 crossing and a magenta −; e₁e₂e₃ reverses to e₃e₂e₁ with 3 crossings and a magenta −.">
