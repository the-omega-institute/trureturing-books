<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch06-swap" data-lang="zh" data-wrap="1" viewBox="0 0 532 270" width="532" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两栏，画着同样两支单位箭头：横放的 A 与斜向上的琥珀色 B，夹角 θ。两栏里 B 落在 A 上的青色影子一样长，都是 A·B = cos θ；两支箭头张出的品红平行四边形也一样大。左栏 AB 的紫色弧箭头从 A 逆时针转向 B，面积记 +sin θ；右栏 BA 的弧箭头从 B 顺时针转回 A，面积记 −sin θ。">
<title>两栏，画着同样两支单位箭头：横放的 A 与斜向上的琥珀色 B，夹角 θ。两栏里 B 落在 A 上的青色影子一样长，都是 A·B = cos θ；两支箭头张出的品红平行四边形也一样大。左栏 AB 的紫色弧箭头从 A 逆时针转向 B，面积记 +sin θ；右栏 BA 的弧箭头从 B 顺时针转回 A，面积记 −sin θ。</title>
