<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch19-discrete-vs-rt" data-lang="en" data-wrap="1" viewBox="0 0 576 300" width="576" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two small pictures with a crossed-out arrow between them. On the left, the width-three bridge graph (tensors M and N, three bridges and four legs a, b, c, d), with a green LEAN ✓ tag beneath it: max-flow = min-cut in the cone. On the right, a disc standing for a constant-time slice of continuum spacetime; a cyan arc on its rim is the boundary region A, and a violet arc γ_A leaves the two ends of A at right angles to the rim and dips into the disc: the minimal curve. Beneath it a violet tag: RT · literature. The arrow from left to right carries a cross and the words: continuum limit, not proved in this book.">
<title>Two small pictures with a crossed-out arrow between them. On the left, the width-three bridge graph (tensors M and N, three bridges and four legs a, b, c, d), with a green LEAN ✓ tag beneath it: max-flow = min-cut in the cone. On the right, a disc standing for a constant-time slice of continuum spacetime; a cyan arc on its rim is the boundary region A, and a violet arc γ_A leaves the two ends of A at right angles to the rim and dips into the disc: the minimal curve. Beneath it a violet tag: RT · literature. The arrow from left to right carries a cross and the words: continuum limit, not proved in this book.</title>
