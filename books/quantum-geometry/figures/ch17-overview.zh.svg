<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch17-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 276" width="740" height="276" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：同一个事件 (t, x) = (5, 3) 落在两条曲线上，品红的圆 t² + x² = 34 是转动走的路，会穿出光锥；青色的双曲线 t² − x² = 16 是推动走的路，贴着光锥却跨不过去。第二栏：两条白色光锥线交成一个 X，灰色的是原来的 t 轴与 x 轴，琥珀色的是以 β = 3/5 运动的参考系的两根轴，一根指向 (t, x) = (5, 3)，一根指向 (3, 5)，像剪刀一样向光锥合拢，光锥本身不动。第三栏：从 O 到 P = (10, 0) 的两条世界线，白色粗线是原地静止，刻着 10 个单位固有时；青色折线经折返点 A = (5, 3)，每段刻着 4 个，共 8 个。">
<title>三栏。第一栏：同一个事件 (t, x) = (5, 3) 落在两条曲线上，品红的圆 t² + x² = 34 是转动走的路，会穿出光锥；青色的双曲线 t² − x² = 16 是推动走的路，贴着光锥却跨不过去。第二栏：两条白色光锥线交成一个 X，灰色的是原来的 t 轴与 x 轴，琥珀色的是以 β = 3/5 运动的参考系的两根轴，一根指向 (t, x) = (5, 3)，一根指向 (3, 5)，像剪刀一样向光锥合拢，光锥本身不动。第三栏：从 O 到 P = (10, 0) 的两条世界线，白色粗线是原地静止，刻着 10 个单位固有时；青色折线经折返点 A = (5, 3)，每段刻着 4 个，共 8 个。</title>
