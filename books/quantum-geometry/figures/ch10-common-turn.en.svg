<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch10-common-turn" data-lang="en" viewBox="0 0 460 350" width="460" height="350" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A Bloch sphere with the violet vertical axis through the north pole N. The grey spherical triangle A joins N, +X and +Y; the ink triangle B = UA joins N, +Y and −X. Two violet curved arrows along the equator carry +X to +Y and +Y to −X, while N stays put: one turn carries the whole triangle rigidly.">
<title>A Bloch sphere with the violet vertical axis through the north pole N. The grey spherical triangle A joins N, +X and +Y; the ink triangle B = UA joins N, +Y and −X. Two violet curved arrows along the equator carry +X to +Y and +Y to −X, while N stays put: one turn carries the whole triangle rigidly.</title>
