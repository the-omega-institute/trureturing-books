<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch03-mirror-and-slit" data-lang="zh" viewBox="0 0 440 300" width="440" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一条水平的镜线。琥珀色的箭头 x 斜向右上；虚线箭头 Mx 是它关于镜线的镜像，斜向右下。连接两箭尖的虚线与镜线交于一点，从原点到这一点的青色粗线就是 P₊x，它正是 x 与 Mx 的中点；从这一点到 x 箭尖的品红线是 P₋x。镜子把箭头翻过去，还能翻回来；狭缝只留下青色的那一半。">
<title>一条水平的镜线。琥珀色的箭头 x 斜向右上；虚线箭头 Mx 是它关于镜线的镜像，斜向右下。连接两箭尖的虚线与镜线交于一点，从原点到这一点的青色粗线就是 P₊x，它正是 x 与 Mx 的中点；从这一点到 x 箭尖的品红线是 P₋x。镜子把箭头翻过去，还能翻回来；狭缝只留下青色的那一半。</title>
<style>.ts-ink{stroke:#0b1622}.tf-ink{fill:#0b1622}.ts-dim{stroke:#45607a}.tf-dim{fill:#45607a}.ts-faint{stroke:#9db3c4}.tf-faint{fill:#9db3c4}.ts-edge{stroke:#b9d0dd}.tf-edge{fill:#b9d0dd}.ts-hot{stroke:#5f9bb5}.tf-hot{fill:#5f9bb5}.ts-bg{stroke:#ffffff}.tf-bg{fill:#ffffff}.ts-panel{stroke:#eef5f9}.tf-panel{fill:#eef5f9}.ts-sheet{stroke:#f7fbfd}.tf-sheet{fill:#f7fbfd}.ts-cyan{stroke:#007c8a}.tf-cyan{fill:#007c8a}.ts-magenta{stroke:#b0128f}.tf-magenta{fill:#b0128f}.ts-amber{stroke:#946200}.tf-amber{fill:#946200}.ts-violet{stroke:#5a45c8}.tf-violet{fill:#5a45c8}.ts-ok{stroke:#087a4c}.tf-ok{fill:#087a4c}.ts-warn{stroke:#c21f3a}.tf-warn{fill:#c21f3a}.ts-blue{stroke:#1d5fd0}.tf-blue{fill:#1d5fd0}.ts-orange{stroke:#b85410}.tf-orange{fill:#b85410}.ts-sigma{stroke:#28405a}.tf-sigma{fill:#28405a}@media (prefers-color-scheme:dark){.ts-ink{stroke:#d4efff}.tf-ink{fill:#d4efff}.ts-dim{stroke:#6f8ea5}.tf-dim{fill:#6f8ea5}.ts-faint{stroke:#34506a}.tf-faint{fill:#34506a}.ts-edge{stroke:#143049}.tf-edge{fill:#143049}.ts-hot{stroke:#1f5d7c}.tf-hot{fill:#1f5d7c}.ts-bg{stroke:#03060c}.tf-bg{fill:#03060c}.ts-panel{stroke:#07101b}.tf-panel{fill:#07101b}.ts-sheet{stroke:#050c16}.tf-sheet{fill:#050c16}.ts-cyan{stroke:#19f0ff}.tf-cyan{fill:#19f0ff}.ts-magenta{stroke:#ff2fd0}.tf-magenta{fill:#ff2fd0}.ts-amber{stroke:#ffc83d}.tf-amber{fill:#ffc83d}.ts-violet{stroke:#9d8cff}.tf-violet{fill:#9d8cff}.ts-ok{stroke:#46ffb2}.tf-ok{fill:#46ffb2}.ts-warn{stroke:#ff5064}.tf-warn{fill:#ff5064}.ts-blue{stroke:#2a7bff}.tf-blue{fill:#2a7bff}.ts-orange{stroke:#ff8a3c}.tf-orange{fill:#ff8a3c}.ts-sigma{stroke:#cfe3ff}.tf-sigma{fill:#cfe3ff}}</style>
<line x1="16" y1="150" x2="428" y2="150" class="ts-dim" stroke-width="1.4" fill="none"/>
<text class="tf-dim" x="428" y="174" font-size="14" text-anchor="end">镜线</text>
<line x1="230.68" y1="21.39" x2="230.68" y2="278.61" class="ts-faint" stroke-width="1.3" stroke-dasharray="2 4" fill="none"/>
<line x1="40" y1="150" x2="224.34" y2="274.34" class="ts-ink" stroke-width="1.8" stroke-dasharray="6 4" fill="none"/>
<path d="M230.68 278.61 L221.1 276.72 L225.33 270.45Z" class="tf-ink"/>
<line x1="230.68" y1="150" x2="230.68" y2="21.39" class="ts-magenta" stroke-width="4.5" stroke-linecap="round" fill="none"/>
<line x1="40" y1="150" x2="230.68" y2="150" class="ts-cyan" stroke-width="5.5" stroke-linecap="round" fill="none"/>
<line x1="40" y1="150" x2="224.34" y2="25.66" class="ts-amber" stroke-width="2.6" fill="none"/>
<path d="M230.68 21.39 L225.33 29.55 L221.1 23.28Z" class="tf-amber"/>
<path d="M230.68 141 L221.68 141 L221.68 150" class="ts-dim" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
<circle cx="230.68" cy="150" r="4.2" class="ts-bg tf-cyan" stroke-width="1.4"/>
<circle cx="40" cy="150" r="3.2" class="tf-dim"/>
<text class="tf-amber" x="240.68" y="25.39" font-size="17"><tspan font-style="italic">x</tspan></text>
<text class="tf-ink" x="240.68" y="282.61" font-size="17"><tspan font-style="italic">Mx</tspan></text>
<text class="tf-cyan ts-bg" x="214.68" y="138" font-size="15" text-anchor="end" stroke-width="4.2" stroke-linejoin="round" paint-order="stroke"><tspan font-style="italic">P</tspan>₊<tspan font-style="italic">x</tspan> = ½(<tspan font-style="italic">x</tspan> + <tspan font-style="italic">Mx</tspan>)</text>
<text class="tf-magenta" x="244.68" y="89.69" font-size="15"><tspan font-style="italic">P</tspan>₋<tspan font-style="italic">x</tspan> = ½(<tspan font-style="italic">x</tspan> − <tspan font-style="italic">Mx</tspan>)</text>
<text class="tf-ink" x="432" y="214" font-size="14" text-anchor="end">镜子：翻过去，还能翻回来</text>
<text class="tf-cyan" x="432" y="238" font-size="14" text-anchor="end">狭缝：只留青色的一半</text>
</svg>
