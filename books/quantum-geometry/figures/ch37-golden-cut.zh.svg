<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch37-golden-cut" data-lang="zh" viewBox="0 0 460 262" width="460" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="上半是黄金格点：横坐标是物理坐标 a + bφ，纵坐标是共轭坐标 a + b(1 − φ)。一条青色的水平带是窗口 [φ − 2, φ − 1]，宽度 1。带里的五个格点涂成青色，各自沿竖直虚线落到下方的实轴 E∥ 上，点亮 y₋₂ ≈ −2.62、y₋₁ ≈ −1.62、y₀ = 0、y₁ ≈ 2.62、y₂ ≈ 4.24；相邻两点至少相隔 1。格点 ⟨0, 1⟩ 落在带的下方，它在实轴上的位置 φ ≈ 1.62 被打叉。带外的其余格点是灰色的。">
<title>上半是黄金格点：横坐标是物理坐标 a + bφ，纵坐标是共轭坐标 a + b(1 − φ)。一条青色的水平带是窗口 [φ − 2, φ − 1]，宽度 1。带里的五个格点涂成青色，各自沿竖直虚线落到下方的实轴 E∥ 上，点亮 y₋₂ ≈ −2.62、y₋₁ ≈ −1.62、y₀ = 0、y₁ ≈ 2.62、y₂ ≈ 4.24；相邻两点至少相隔 1。格点 ⟨0, 1⟩ 落在带的下方，它在实轴上的位置 φ ≈ 1.62 被打叉。带外的其余格点是灰色的。</title>
