<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch03-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: an amber arrow is projected onto a cyan measurement line, leaving a cyan shadow; the dashed magenta segment is the perpendicular part that is removed, and a small loop at the shadow says that projecting again does not move it. Panel II: a Bloch sphere with a cyan axis e₃ and the magenta dual plane ⋆e₃ at the equator; an amber arrow splits into a cyan part along the axis and a magenta part in the plane. Panel III: along a timeline pointing right stand three polarizers τ₁, τ₂, τ₃ at 0°, 45° and 90°; normalize the beam after the first preparing polarizer to 1; each of the next two contributes ½, giving 1, ½, ¼. A dashed arc above says that without the middle one, 0° straight to 90° passes 0.">
<title>Three panels. Panel I: an amber arrow is projected onto a cyan measurement line, leaving a cyan shadow; the dashed magenta segment is the perpendicular part that is removed, and a small loop at the shadow says that projecting again does not move it. Panel II: a Bloch sphere with a cyan axis e₃ and the magenta dual plane ⋆e₃ at the equator; an amber arrow splits into a cyan part along the axis and a magenta part in the plane. Panel III: along a timeline pointing right stand three polarizers τ₁, τ₂, τ₃ at 0°, 45° and 90°; normalize the beam after the first preparing polarizer to 1; each of the next two contributes ½, giving 1, ½, ¼. A dashed arc above says that without the middle one, 0° straight to 90° passes 0.</title>
