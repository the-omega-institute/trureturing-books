<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch18-chiral-levels" data-lang="en" viewBox="0 0 500 350" width="500" height="350" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="An energy-level diagram with energy E upward. Left column, m = 0: an all-blue bar at E = +3 (upper component Z = +1) and an all-orange bar at E = −3 (lower component Z = −1). Right column, m = 4: the bars are pushed to E = +5 and E = −5; the +5 bar is 4/5 blue and 1/5 orange, the −5 bar 1/5 blue and 4/5 orange. Dashed lines join the matching levels of the two columns.">
