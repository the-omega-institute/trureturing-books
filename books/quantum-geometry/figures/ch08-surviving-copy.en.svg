<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-surviving-copy" data-lang="en" viewBox="0 0 440 320" width="440" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The coherence ρ₀₁ in the complex plane. The grey dashed arrow is the original ρ₀₁. Copying forward, it turns along the unit circle through the phases of copies 1 and 2 (cyan arcs), then copy k shortens and turns it (magenta segment). Rewinding, the phases of copies 1 and 2 turn back along the smaller circle (cyan dashed arcs), and it stops at the amber arrow c_k ρ₀₁: shorter and turned, it does not return to the tip of the grey arrow.">
<title>The coherence ρ₀₁ in the complex plane. The grey dashed arrow is the original ρ₀₁. Copying forward, it turns along the unit circle through the phases of copies 1 and 2 (cyan arcs), then copy k shortens and turns it (magenta segment). Rewinding, the phases of copies 1 and 2 turn back along the smaller circle (cyan dashed arcs), and it stops at the amber arrow c_k ρ₀₁: shorter and turned, it does not return to the tip of the grey arrow.</title>
