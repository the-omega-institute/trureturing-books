<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-reflections" data-lang="zh" data-wrap="1" viewBox="0 0 560 290" width="560" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两幅同样的实平面图，各有两面镜子：水平的 Z 镜与 45° 斜线上的 X 镜。琥珀色的箭头 v 都从 20° 出发。左图先照 Z 镜（虚线箭头 Zv），再照 X 镜，到达 110°，紫色的弧标出逆时针转了 +90°。右图先照 X 镜（虚线箭头 Xv），再照 Z 镜，到达 −70°，紫色的弧标出顺时针转了 −90°。两种结果正好相差 180°。">
