<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-truncation-crack" data-lang="en" viewBox="0 0 520 306" width="520" height="306" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the degree of the truncated polynomial, 0, 2, 4, 6, 8, 10; the vertical axis is the difference between its fixed point q and θ*, on a logarithmic scale of its size. Six stems alternate up (cyan, q above θ*) and down (magenta, q below θ*), each shorter than the last: the differences are about 0.26, 0.0070, 0.00013, 1.3×10⁻⁶, 8×10⁻⁹ and 3.3×10⁻¹¹, ever smaller, yet none reaches the centre line. The stems carry the values of q, the first two being 1 and √3 − 1.">
<title>The horizontal axis is the degree of the truncated polynomial, 0, 2, 4, 6, 8, 10; the vertical axis is the difference between its fixed point q and θ*, on a logarithmic scale of its size. Six stems alternate up (cyan, q above θ*) and down (magenta, q below θ*), each shorter than the last: the differences are about 0.26, 0.0070, 0.00013, 1.3×10⁻⁶, 8×10⁻⁹ and 3.3×10⁻¹¹, ever smaller, yet none reaches the centre line. The stems carry the values of q, the first two being 1 and √3 − 1.</title>
