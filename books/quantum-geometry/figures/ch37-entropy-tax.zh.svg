<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch37-entropy-tax" data-lang="zh" viewBox="0 0 460 250" width="460" height="250" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="横轴是旋转角 θ，从 0 到 π/2；纵轴从 0 到 0.75。品红的曲线是捏合剪掉的相干质量 ½ sin² 2θ，墨色的曲线是熵增 −cos² θ ln cos² θ − sin² θ ln sin² θ。两条曲线在 θ = 0 与 θ = π/2 处都是 0，在 θ = π/4 处同时到顶：相干质量 1/2，熵增 ln 2 ≈ 0.693。">
<title>横轴是旋转角 θ，从 0 到 π/2；纵轴从 0 到 0.75。品红的曲线是捏合剪掉的相干质量 ½ sin² 2θ，墨色的曲线是熵增 −cos² θ ln cos² θ − sin² θ ln sin² θ。两条曲线在 θ = 0 与 θ = π/2 处都是 0，在 θ = π/4 处同时到顶：相干质量 1/2，熵增 ln 2 ≈ 0.693。</title>
