<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：琥珀色的箭头横躺在 |+⟩，品红的横向一份被抹掉，箭头缩成圆心的青色点；右边一根熵柱从 0 升到 ln 2。第二栏：两组灰色的柱，每组左边是系统的熵 S、右边是付出的热 βQ；A 组（捏合之后）S 到 ln 2、热为 0，B 组（复位之后）S 回到 0、热升到 ln 2，正好碰到标着“下界”的横线；下面注明热的一步是文献结果，取等是理想极限。第三栏：左边是系统，连向五份环境副本；四份标着倒带箭头，是青色的，一份副本 k 是品红的，没有倒带；下面写着倒带后得到 c_k ρ₀₁，不等于 ρ₀₁。">
<title>三栏。第一栏：琥珀色的箭头横躺在 |+⟩，品红的横向一份被抹掉，箭头缩成圆心的青色点；右边一根熵柱从 0 升到 ln 2。第二栏：两组灰色的柱，每组左边是系统的熵 S、右边是付出的热 βQ；A 组（捏合之后）S 到 ln 2、热为 0，B 组（复位之后）S 回到 0、热升到 ln 2，正好碰到标着“下界”的横线；下面注明热的一步是文献结果，取等是理想极限。第三栏：左边是系统，连向五份环境副本；四份标着倒带箭头，是青色的，一份副本 k 是品红的，没有倒带；下面写着倒带后得到 c_k ρ₀₁，不等于 ρ₀₁。</title>
