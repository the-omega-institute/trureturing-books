<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：布洛赫球的竖直截面里有两支箭头 ρ 与 σ，高度相同、横向分量不同；品红虚线把两者的横向分量抹掉，两支箭头都落到竖轴上同一个青色的点。第二栏：琥珀色的箭头横躺在 |+⟩，品红的横向一份被抹掉，箭头缩成圆心的青色点；右边一根熵柱从 0 升到 ln 2。第三栏：左边是系统，连向五份环境副本；四份标着倒带箭头，是青色的，一份副本 k 是品红的，没有倒带；下面写着倒带后得到 c_k ρ₀₁，不等于 ρ₀₁。">
<title>三栏。第一栏：布洛赫球的竖直截面里有两支箭头 ρ 与 σ，高度相同、横向分量不同；品红虚线把两者的横向分量抹掉，两支箭头都落到竖轴上同一个青色的点。第二栏：琥珀色的箭头横躺在 |+⟩，品红的横向一份被抹掉，箭头缩成圆心的青色点；右边一根熵柱从 0 升到 ln 2。第三栏：左边是系统，连向五份环境副本；四份标着倒带箭头，是青色的，一份副本 k 是品红的，没有倒带；下面写着倒带后得到 c_k ρ₀₁，不等于 ρ₀₁。</title>
