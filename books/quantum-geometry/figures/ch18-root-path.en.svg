<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch18-root-path" data-lang="en" viewBox="0 0 500 318" width="500" height="318" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A directed graph with seven vertices. The six cyan edges are the chosen spanning tree T; the grey dashed edges are the chords outside it, among them a self-loop and an edge parallel to a tree edge. From the root r on the left to the vertex a at the top right there is exactly one tree path, drawn thick cyan through three edges e₁, e₂, e₃: e₁ and e₃ point the way we walk and are marked × u(e₁), × u(e₃); e₂ points against it and is marked × u(e₂)⁻¹. At the bottom: rootPhase(a) = u(e₁) · u(e₂)⁻¹ · u(e₃).">
<title>A directed graph with seven vertices. The six cyan edges are the chosen spanning tree T; the grey dashed edges are the chords outside it, among them a self-loop and an edge parallel to a tree edge. From the root r on the left to the vertex a at the top right there is exactly one tree path, drawn thick cyan through three edges e₁, e₂, e₃: e₁ and e₃ point the way we walk and are marked × u(e₁), × u(e₃); e₂ points against it and is marked × u(e₂)⁻¹. At the bottom: rootPhase(a) = u(e₁) · u(e₂)⁻¹ · u(e₃).</title>
