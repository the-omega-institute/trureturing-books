<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-ray-counterexample" data-lang="en" data-wrap="1" viewBox="0 0 488 262" width="488" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels; in each, two circles stand for the coordinates 0 and 1, and the violet arrow in each circle is the phase of the diagonal entry A₀₀ or A₁₁. Left: the only test vector is x = (1, 1), and one cyan arc joins the two circles; both violet arrows point the same way, and below it reads A = c₀ I₂. Right: the test vectors are e₀ and e₁, each with a short cyan arc over one circle only; the dashed arc between the circles is struck out, so nothing joins them. The left arrow points to 1 and the right arrow to i, 90° apart, and below it reads diag(1, i) ≠ c I₂.">
<title>Two panels; in each, two circles stand for the coordinates 0 and 1, and the violet arrow in each circle is the phase of the diagonal entry A₀₀ or A₁₁. Left: the only test vector is x = (1, 1), and one cyan arc joins the two circles; both violet arrows point the same way, and below it reads A = c₀ I₂. Right: the test vectors are e₀ and e₁, each with a short cyan arc over one circle only; the dashed arc between the circles is struck out, so nothing joins them. The left arrow points to 1 and the right arrow to i, 90° apart, and below it reads diag(1, i) ≠ c I₂.</title>
