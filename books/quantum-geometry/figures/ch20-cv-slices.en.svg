<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-cv-slices" data-lang="en" viewBox="0 0 500 330" width="500" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A schematic Penrose diagram of a two-sided black hole: the left and right sides of the square are the two boundaries, the zigzag lines at top and bottom are the singularities, and the two dashed diagonals are the horizons. Four violet curves are the slices Σ_t, pinned to the left and right boundaries at times t = 0, 1, 2, 3 and running through the black-hole interior in the middle; the larger t, the higher the ends and the longer the curve, the last one thickest. A red tag on the right: C ∝ V(Σ_t)? Open.">
<title>A schematic Penrose diagram of a two-sided black hole: the left and right sides of the square are the two boundaries, the zigzag lines at top and bottom are the singularities, and the two dashed diagonals are the horizons. Four violet curves are the slices Σ_t, pinned to the left and right boundaries at times t = 0, 1, 2, 3 and running through the black-hole interior in the middle; the larger t, the higher the ends and the longer the curve, the last one thickest. A red tag on the right: C ∝ V(Σ_t)? Open.</title>
