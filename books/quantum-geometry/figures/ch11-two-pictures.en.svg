<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch11-two-pictures" data-lang="en" viewBox="0 0 520 290" width="520" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two Bloch spheres of the same size. Left, push the state: the amber state turns about the violet axis from the grey dot to a new place while the readout direction (|0⟩ at the north pole) stays put; the cyan arc is the angle α between state and readout. Right, pull the readout back: the amber state stays where it is and the grey readout direction turns backwards to a new place; the cyan arc is the same α. The angle is the same on both sides, so the chance of reading |0⟩ is the same.">
<title>Two Bloch spheres of the same size. Left, push the state: the amber state turns about the violet axis from the grey dot to a new place while the readout direction (|0⟩ at the north pole) stays put; the cyan arc is the angle α between state and readout. Right, pull the readout back: the amber state stays where it is and the grey readout direction turns backwards to a new place; the cyan arc is the same α. The angle is the same on both sides, so the chance of reading |0⟩ is the same.</title>
