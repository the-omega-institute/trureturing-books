<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch15-overshoot" data-lang="en" viewBox="0 0 500 290" width="500" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the number of Grover steps n from 0 to 4; the vertical axis is the success probability from 0 to 1. A thin ink curve is sin²((2n + 1)θ) for N = 8; it touches 1 at n ≈ 1.67, which is not a whole number. The dots on whole steps are 1/8, 25/32, 121/128, …; the amber dot is the closest step n = 2 at 121/128 ≈ 0.945, and a magenta gap of 7/128 separates it from the dashed line at 1. Further steps, n = 3 and 4, fall back down.">
<title>The horizontal axis is the number of Grover steps n from 0 to 4; the vertical axis is the success probability from 0 to 1. A thin ink curve is sin²((2n + 1)θ) for N = 8; it touches 1 at n ≈ 1.67, which is not a whole number. The dots on whole steps are 1/8, 25/32, 121/128, …; the amber dot is the closest step n = 2 at 121/128 ≈ 0.945, and a magenta gap of 7/128 separates it from the dashed line at 1. Further steps, n = 3 and 4, fall back down.</title>
