<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-parity-labels" data-lang="zh" data-wrap="1" viewBox="0 0 716 300" width="716" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两栏。左栏：两比特电路，两根横线是导线 0 与 1，从左到右依次是一个 CNOT（控制在导线 0、目标在导线 1）、导线 1 上的 R_z、再一个 CNOT。每段导线上方写着它此刻的奇偶标签：导线 0 始终是青色的 z₀；导线 1 先是青色的 z₁，第一个 CNOT 之后变成品红的 z₀ ⊕ z₁，R_z 在它上面注入相位，第二个 CNOT 之后又回到青色的 z₁。第一个 CNOT 下标着“偶诞生”，第二个下标着“奇复原”，底下写着 1 + 1 = 2 个 CNOT。右栏：四比特时必须在导线上出现的 7 个非零偶奇偶标签，品红色，从 z₀ ⊕ z₁ 到 z₀ ⊕ z₁ ⊕ z₂ ⊕ z₃ 排成两列；下面写着至少 7 个偶输出加至少 3 次复原等于 10，旁边一枚绿色的 LEAN ✓ 标签。">
<title>两栏。左栏：两比特电路，两根横线是导线 0 与 1，从左到右依次是一个 CNOT（控制在导线 0、目标在导线 1）、导线 1 上的 R_z、再一个 CNOT。每段导线上方写着它此刻的奇偶标签：导线 0 始终是青色的 z₀；导线 1 先是青色的 z₁，第一个 CNOT 之后变成品红的 z₀ ⊕ z₁，R_z 在它上面注入相位，第二个 CNOT 之后又回到青色的 z₁。第一个 CNOT 下标着“偶诞生”，第二个下标着“奇复原”，底下写着 1 + 1 = 2 个 CNOT。右栏：四比特时必须在导线上出现的 7 个非零偶奇偶标签，品红色，从 z₀ ⊕ z₁ 到 z₀ ⊕ z₁ ⊕ z₂ ⊕ z₃ 排成两列；下面写着至少 7 个偶输出加至少 3 次复原等于 10，旁边一枚绿色的 LEAN ✓ 标签。</title>
