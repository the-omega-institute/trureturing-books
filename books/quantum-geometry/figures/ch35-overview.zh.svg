<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch35-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：时空图，品红的光线沿 45° 斜向上到达一个事件点，旁边写着 dτ = 0；从这个点起一条近乎竖直的青色世界线向上，线上按相等的固有时打着刻度；虚线是这一点的光锥。第二栏：一片青色的小箭头都指向右上的目标，灰色虚线是从 P₀ 出发、左右折返的一根见证细丝，一支粗的青色箭头是它首尾相连的净变换，即铸进表里的一行。第三栏：一张表，紫色的第 0 行在上，下面四行青色的格子，最下面一行是琥珀色虚框的新行；一支紫色的回环箭头从第 0 行出发绕过整张表又回到第 0 行，下面写着 T = T(T)。">
<title>三栏。第一栏：时空图，品红的光线沿 45° 斜向上到达一个事件点，旁边写着 dτ = 0；从这个点起一条近乎竖直的青色世界线向上，线上按相等的固有时打着刻度；虚线是这一点的光锥。第二栏：一片青色的小箭头都指向右上的目标，灰色虚线是从 P₀ 出发、左右折返的一根见证细丝，一支粗的青色箭头是它首尾相连的净变换，即铸进表里的一行。第三栏：一张表，紫色的第 0 行在上，下面四行青色的格子，最下面一行是琥珀色虚框的新行；一支紫色的回环箭头从第 0 行出发绕过整张表又回到第 0 行，下面写着 T = T(T)。</title>
