<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-ray-skeleton" data-lang="en" viewBox="0 0 460 448" width="460" height="448" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A proof skeleton, top to bottom. The dashed frame is the private lemma coordinate_shape_of_connected_ray_tests, with three steps inside: from the hypothesis &#x27;coordinate rays kept&#x27;, the off-diagonal entries vanish, A_{ij} = 0 (hoff); from &#x27;test rays kept&#x27;, two coordinates sharing a support have A_{ii} = A_{jj} (hstep, by sum_eq_single and mul_right_cancel₀); from &#x27;supports connected&#x27;, induction on ReflTransGen makes every diagonal entry equal. Below the frame the proof splits (isEmpty_or_nonempty): for empty ι take c = 1; for non-empty ι take c = A_{bb}, and the hypothesis &#x27;A unitary&#x27; gives |c| = 1. Both branches meet in the green LEAN ✓ unitary_phase_of_connected_ray_tests at the bottom.">
<title>A proof skeleton, top to bottom. The dashed frame is the private lemma coordinate_shape_of_connected_ray_tests, with three steps inside: from the hypothesis &#x27;coordinate rays kept&#x27;, the off-diagonal entries vanish, A_{ij} = 0 (hoff); from &#x27;test rays kept&#x27;, two coordinates sharing a support have A_{ii} = A_{jj} (hstep, by sum_eq_single and mul_right_cancel₀); from &#x27;supports connected&#x27;, induction on ReflTransGen makes every diagonal entry equal. Below the frame the proof splits (isEmpty_or_nonempty): for empty ι take c = 1; for non-empty ι take c = A_{bb}, and the hypothesis &#x27;A unitary&#x27; gives |c| = 1. Both branches meet in the green LEAN ✓ unitary_phase_of_connected_ray_tests at the bottom.</title>
