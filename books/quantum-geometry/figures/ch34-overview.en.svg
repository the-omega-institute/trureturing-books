<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch34-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: a sphere with the amber observer O on the violet vertical axis; on the magenta latitude circle at 60° sit one filled dot and three hollow rings, and four cyan dashed lines all meet at the one cyan point cos θ on the axis. Panel II: the same sphere with the equatorial plane as a magenta disc; a magenta arc inside it turns from e₁ to e₂, marked 90°; the amber observer O stands at the top of the disc&#x27;s normal axis. Panel III: a square lattice with an amber slanted line E∥ inside a narrow cyan strip; the points in the strip are cyan and drop along short magenta lines onto the line; the magenta dashed line is the internal direction E⊥, perpendicular to the slice.">
<title>Three panels. Panel I: a sphere with the amber observer O on the violet vertical axis; on the magenta latitude circle at 60° sit one filled dot and three hollow rings, and four cyan dashed lines all meet at the one cyan point cos θ on the axis. Panel II: the same sphere with the equatorial plane as a magenta disc; a magenta arc inside it turns from e₁ to e₂, marked 90°; the amber observer O stands at the top of the disc&#x27;s normal axis. Panel III: a square lattice with an amber slanted line E∥ inside a narrow cyan strip; the points in the strip are cyan and drop along short magenta lines onto the line; the magenta dashed line is the internal direction E⊥, perpendicular to the slice.</title>
