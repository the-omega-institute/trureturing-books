<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch25-no-common-line" data-lang="zh" viewBox="0 0 440 320" width="440" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="态矢所在的实平面。两条青色实线是 X 的本征线：斜 45° 的一条标 +1，斜 135° 的一条标 −1。两条青色虚线是 Z 的本征线：水平的一条标 +1，竖直的一条标 −1。四条线把平面等分成八份，相邻两条之间都是 45°，没有一条线同时属于 X 和 Z。它们只在原点相交，原点处绿色的标签写着 ψ = 0。">
<title>态矢所在的实平面。两条青色实线是 X 的本征线：斜 45° 的一条标 +1，斜 135° 的一条标 −1。两条青色虚线是 Z 的本征线：水平的一条标 +1，竖直的一条标 −1。四条线把平面等分成八份，相邻两条之间都是 45°，没有一条线同时属于 X 和 Z。它们只在原点相交，原点处绿色的标签写着 ψ = 0。</title>
