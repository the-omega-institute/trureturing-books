<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 290" width="740" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：示意坐标图，横轴 t 从 0 到 3；品红的直线 C(t) = 2t 一直上升（与青线重合的一段画成虚线），青色的折线 S(t) = min(2t, 4) 在 t = 2 撞上灰色虚线 4 后横着走；四个点 t = 0、1、2、3 标在两条线上。第二栏：两比特电路，两根导线，一个 CNOT、导线 1 上的 R_z、再一个 CNOT；导线 1 的标签从青色的 z₁ 变成品红的 z₀ ⊕ z₁（标“诞生”），再回到青色的 z₁（标“复原”）；下面写着 2 比特 1 + 1 = 2 个 CNOT，一枚绿色的 LEAN ✓ 标签：CNOT ≥ 2²ⁿ⁻¹ + 2n − 2。第三栏：一个大椭圆 NP 里套着一个青色的小椭圆 P，两者之间的环带上写着红色的问号；下方一枚红色标签：P ≠ NP 开放。">
<title>三栏。第一栏：示意坐标图，横轴 t 从 0 到 3；品红的直线 C(t) = 2t 一直上升（与青线重合的一段画成虚线），青色的折线 S(t) = min(2t, 4) 在 t = 2 撞上灰色虚线 4 后横着走；四个点 t = 0、1、2、3 标在两条线上。第二栏：两比特电路，两根导线，一个 CNOT、导线 1 上的 R_z、再一个 CNOT；导线 1 的标签从青色的 z₁ 变成品红的 z₀ ⊕ z₁（标“诞生”），再回到青色的 z₁（标“复原”）；下面写着 2 比特 1 + 1 = 2 个 CNOT，一枚绿色的 LEAN ✓ 标签：CNOT ≥ 2²ⁿ⁻¹ + 2n − 2。第三栏：一个大椭圆 NP 里套着一个青色的小椭圆 P，两者之间的环带上写着红色的问号；下方一枚红色标签：P ≠ NP 开放。</title>
