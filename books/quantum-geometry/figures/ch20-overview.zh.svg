<title>三栏。第一栏：示意坐标图，横轴 t 从 0 到 3；品红的直线 C(t) = 2t 一直上升（与青线重合的一段画成虚线），青色的折线 S(t) = min(2t, 4) 在 t = 2 撞上灰色虚线 4 后横着走；四个点 t = 0、1、2、3 标在两条线上。第二栏：双边黑洞的示意彭罗斯图，紫色的切片两端钉在左右边界上，时间越往后越长；下方一枚红色标签：CV 开放。第三栏：一个大椭圆 NP 里套着一个青色的小椭圆 P，两者之间的环带上写着红色的问号；下方一枚红色标签：P ≠ NP 开放。</title>
