<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch29-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: four steps rise from left to right, carrying ℚ, √2, π and θ*; ℚ is cyan, the other three magenta. Panel II: the mod 4 dial in four cells, cells 0, 1, 2 cyan and cell 3 an empty cell outlined in dashed magenta. Panel III: the Gram window for c_AB = cos 60°, a tilted violet ellipse with det G = 0 on its rim and det G &gt; 0 inside; an amber vertical segment is the window for c_AC at c_BC = cos 45°.">
<title>Three panels. Panel I: four steps rise from left to right, carrying ℚ, √2, π and θ*; ℚ is cyan, the other three magenta. Panel II: the mod 4 dial in four cells, cells 0, 1, 2 cyan and cell 3 an empty cell outlined in dashed magenta. Panel III: the Gram window for c_AB = cos 60°, a tilted violet ellipse with det G = 0 on its rim and det G &gt; 0 inside; an amber vertical segment is the window for c_AC at c_BC = cos 45°.</title>
