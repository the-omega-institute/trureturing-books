<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-parts" data-lang="zh" viewBox="0 0 480 320" width="480" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="十条横条排成一架向右上方升起的阶梯，最下面是第一部（点 → 线，第 1–4 章），往上依次是第二部（线 → 面，5–8）、第三部（面 → 球，9–12）、第四部（多球共振，13–16）、第五部（时空之球，17–20）、第六部（球外之球，21–24）、第七部（铸器与验证，25–28）、第八部（贯通，29–32）、第九部（互照，33–36），最上面是第十部（不二，37–39）。每条横条里或旁写着它的章号范围，部名写在左边。">
<title>十条横条排成一架向右上方升起的阶梯，最下面是第一部（点 → 线，第 1–4 章），往上依次是第二部（线 → 面，5–8）、第三部（面 → 球，9–12）、第四部（多球共振，13–16）、第五部（时空之球，17–20）、第六部（球外之球，21–24）、第七部（铸器与验证，25–28）、第八部（贯通，29–32）、第九部（互照，33–36），最上面是第十部（不二，37–39）。每条横条里或旁写着它的章号范围，部名写在左边。</title>
