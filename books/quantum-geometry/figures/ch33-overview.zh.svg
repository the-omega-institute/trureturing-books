<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch33-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 250" width="740" height="250" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：一条向右的轴，自左向右排着光子（波）、原子（带轨道的点）、晶体（点阵）与心智（自我环绕的箭头），下面写着记忆阶数 M = 0、M = 1 与 M ≫ 1。第二栏：一只碗形的势阱，被踢到右侧坡上的小球沿灰色箭头一步步落回碗底，琥珀色的是它现在的位置，碗底的青色短线是接受窗 W + u_i。第三栏：同一条余弦轨道自上而下一行一拍，横向是读数，灰色折线逐拍跨过竖直的 θ* 虚线左右交替，每两拍套一个空心环，环全在 θ* 左侧，琥珀色的是最后一拍。">
<title>三栏。第一栏：一条向右的轴，自左向右排着光子（波）、原子（带轨道的点）、晶体（点阵）与心智（自我环绕的箭头），下面写着记忆阶数 M = 0、M = 1 与 M ≫ 1。第二栏：一只碗形的势阱，被踢到右侧坡上的小球沿灰色箭头一步步落回碗底，琥珀色的是它现在的位置，碗底的青色短线是接受窗 W + u_i。第三栏：同一条余弦轨道自上而下一行一拍，横向是读数，灰色折线逐拍跨过竖直的 θ* 虚线左右交替，每两拍套一个空心环，环全在 θ* 左侧，琥珀色的是最后一拍。</title>
