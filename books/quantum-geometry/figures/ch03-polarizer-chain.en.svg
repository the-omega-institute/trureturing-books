<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch03-polarizer-chain" data-lang="en" viewBox="0 0 460 330" width="460" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="N, the number of middle polarizers, runs across from 0 to 12; the transmitted share runs up from 0 to 1. The cyan dots are w_N = [cos²(π/(2(N+1)))]^{N+1}: 0 at N = 0, ¼ at N = 1 (the three-polarizer example, ringed), then rising steadily to about 0.83 at N = 12. A dashed violet line at 1 marks the limit given in the literature.">
<title>N, the number of middle polarizers, runs across from 0 to 12; the transmitted share runs up from 0 to 1. The cyan dots are w_N = [cos²(π/(2(N+1)))]^{N+1}: 0 at N = 0, ¼ at N = 1 (the three-polarizer example, ringed), then rising steadily to about 0.83 at N = 12. A dashed violet line at 1 marks the limit given in the literature.</title>
