<title>横轴是时间占总下落时间的比例 t/t_ff，从 0 到 1；纵轴是离中心的距离占起始距离的比例 r/r₀。曲线从左上角 (0, 1) 开始几乎水平，越往右越陡，最后竖直落到 (1, 0)。三个点标在时间的四分之一、一半、四分之三处，高度分别是 0.961、0.837、0.597；一半处的点是青色，虚线把它连到两条轴上，旁边写着 (1 + sin θ*)/2。右侧的括号标出这时只落了 0.163，不到六分之一。</title>
