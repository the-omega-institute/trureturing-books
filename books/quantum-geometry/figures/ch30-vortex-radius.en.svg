<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch30-vortex-radius" data-lang="en" viewBox="0 0 500 300" width="500" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the radius ρ of the circle carrying the alternating vortices, the vertical axis the size of a tangential speed. The violet line Ωρ is the speed given by the precession and grows with the radius; the cyan curve b/(4ρ) is the speed blown in by the other vortices and falls with it. The two point in opposite directions and cross at ρ = R = 1, where the whole ring stands still; the left is marked ‘neighbors win’, the right ‘precession wins’. Here b = 2 and Ω = 1/2.">
<title>The horizontal axis is the radius ρ of the circle carrying the alternating vortices, the vertical axis the size of a tangential speed. The violet line Ωρ is the speed given by the precession and grows with the radius; the cyan curve b/(4ρ) is the speed blown in by the other vortices and falls with it. The two point in opposite directions and cross at ρ = R = 1, where the whole ring stands still; the left is marked ‘neighbors win’, the right ‘precession wins’. Here b = 2 and Ω = 1/2.</title>
