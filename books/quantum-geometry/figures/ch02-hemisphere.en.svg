<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-hemisphere" data-lang="en" data-wrap="1" viewBox="0 0 560 270" width="560" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="On the left, a Bloch sphere seen from the side: the northern hemisphere is cyan, marked f = 1, the southern one dark, marked f = 0. Four points on the sphere: +x on the equator at the right and +z at the top (both on the f = 1 side), n at 45° to the upper right and its antipode −n at the lower left. On the right, two lines of arithmetic: split along +x and +z, ½(1 + 1) = 1; split along ±n, 0.8536 × 1 + 0.1464 × 0 = 0.8536; underneath, in magenta, 1 ≠ 0.8536.">
<title>On the left, a Bloch sphere seen from the side: the northern hemisphere is cyan, marked f = 1, the southern one dark, marked f = 0. Four points on the sphere: +x on the equator at the right and +z at the top (both on the f = 1 side), n at 45° to the upper right and its antipode −n at the lower left. On the right, two lines of arithmetic: split along +x and +z, ½(1 + 1) = 1; split along ±n, 0.8536 × 1 + 0.1464 × 0 = 0.8536; underneath, in magenta, 1 ≠ 0.8536.</title>
