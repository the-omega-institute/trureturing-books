<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: a grey dashed external vertical axis C is set aside; the cyan arrow A is its own axis and the amber arrow B is a single angle θ away from it. Panel II: a perpendicular dropped from the amber b onto the cyan line a lands at the foot marked C; the thick cyan segment from the origin to C is the shadow c and the dashed magenta segment from C to b is the perpendicular remainder. Panel III: on a circle on the left, the north and south poles are 180° apart; on the right, two arrows |0⟩ and |1⟩ are 90° apart: opposite points on the sphere are orthogonal in Hilbert space.">
<title>Three panels. Panel I: a grey dashed external vertical axis C is set aside; the cyan arrow A is its own axis and the amber arrow B is a single angle θ away from it. Panel II: a perpendicular dropped from the amber b onto the cyan line a lands at the foot marked C; the thick cyan segment from the origin to C is the shadow c and the dashed magenta segment from C to b is the perpendicular remainder. Panel III: on a circle on the left, the north and south poles are 180° apart; on the right, two arrows |0⟩ and |1⟩ are 90° apart: opposite points on the sphere are orthogonal in Hilbert space.</title>
