<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch13-two-states" data-lang="zh" viewBox="0 0 540 286" width="540" height="286" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两张并排的 4 × 4 格子，行是 Alice 的 I、X、Y、Z，列是 Bob 的。左边是经典关联态，右边是贝尔态 Φ⁺。两张格子左上角都是 1，第一行与第一列的六格青色局域格全都空着。右下的品红关联格里，经典关联态只有 (Z, Z) 一格是 +1；贝尔态有三格：(X, X) 是 +1，(Y, Y) 是 −1，(Z, Z) 是 +1。">
