<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch29-four-tiers" data-lang="en" viewBox="0 0 560 296" width="560" height="296" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Four steps rise from left to right, labelled tier 1 ℤ, ℚ; tier 2 √2, φ; tier 3 π, e; tier 4 θ* ≈ 0.739. Above each step is a small picture: tier 1, cyan rational points m/n on the number line from 0 to 2; tier 2, a cyan unit square with its magenta diagonal √2; tier 3, a cyan regular octagon inside its magenta circle π; tier 4, the cyan curve y = cos θ meeting the dashed line y = θ at the magenta point θ*. Everything magenta is a constant that escaped the tier below.">
<title>Four steps rise from left to right, labelled tier 1 ℤ, ℚ; tier 2 √2, φ; tier 3 π, e; tier 4 θ* ≈ 0.739. Above each step is a small picture: tier 1, cyan rational points m/n on the number line from 0 to 2; tier 2, a cyan unit square with its magenta diagonal √2; tier 3, a cyan regular octagon inside its magenta circle π; tier 4, the cyan curve y = cos θ meeting the dashed line y = θ at the magenta point θ*. Everything magenta is a constant that escaped the tier below.</title>
