<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-two-series" data-lang="en" viewBox="0 0 480 330" width="480" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A cyan curve y = A(x) = 2x + 2 arcsin x rising from the origin to 2 + π at x = 1. One point on it is marked, (θ*, π). Going straight up from θ* ≈ 0.739 on the horizontal axis to the curve and then left to the vertical axis reads off π: the direction of the series A. Going the other way, right from π on the vertical axis to the curve and down to the horizontal axis, reads back θ*: the direction of the compositional inverse B (dashed magenta).">
<title>A cyan curve y = A(x) = 2x + 2 arcsin x rising from the origin to 2 + π at x = 1. One point on it is marked, (θ*, π). Going straight up from θ* ≈ 0.739 on the horizontal axis to the curve and then left to the vertical axis reads off π: the direction of the series A. Going the other way, right from π on the vertical axis to the curve and down to the horizontal axis, reads back θ*: the direction of the compositional inverse B (dashed magenta).</title>
