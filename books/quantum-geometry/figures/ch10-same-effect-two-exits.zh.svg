<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch10-same-effect-two-exits" data-lang="zh" viewBox="0 0 500 340" width="500" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两行，同一个开始。每行左边是一颗小球，琥珀色的点在北极 N。中间是同一个青色的框“效应 E = P₀”，两行一模一样，旁边写着单看概率两台仪器分不出来。右边是出口态：上一行投影仪器 K = P₀ 让点留在北极；下一行翻转仪器 L = X P₀ 把点翻到南极。最右是第二道快门 I − P₀ 的读数：上一行 0，下一行 1。底部一枚绿色标签 LEAN ✓。">
<title>两行，同一个开始。每行左边是一颗小球，琥珀色的点在北极 N。中间是同一个青色的框“效应 E = P₀”，两行一模一样，旁边写着单看概率两台仪器分不出来。右边是出口态：上一行投影仪器 K = P₀ 让点留在北极；下一行翻转仪器 L = X P₀ 把点翻到南极。最右是第二道快门 I − P₀ 的读数：上一行 0，下一行 1。底部一枚绿色标签 LEAN ✓。</title>
