<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch05-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：原点处一个品红的小方块是单位二向量 I；琥珀色的箭头 e₁ 右乘一次 I 逆时针转 90° 成为 e₂，再乘一次又转 90° 成为 −e₁，两段紫色的弧各标“× I”。第二栏（示意）：两支互相垂直、长 1/√2 的箭头 A 与 B 拼出长为 1 的紫色斜箭头 S = A + B，落在虚线单位圆上；A 与 B 张出的品红方块是 J = 2AB*。第三栏：两个圆，左边是旋子，右边是旋转，中间一个箭头标着 z²。θ 从 0° 到 360°：右边的圆被绕满一整圈，回到出发点的琥珀色点；左边紫色的弧只从 1 走了半圈，停在对面琥珀色的 −1。">
<title>三栏。第一栏：原点处一个品红的小方块是单位二向量 I；琥珀色的箭头 e₁ 右乘一次 I 逆时针转 90° 成为 e₂，再乘一次又转 90° 成为 −e₁，两段紫色的弧各标“× I”。第二栏（示意）：两支互相垂直、长 1/√2 的箭头 A 与 B 拼出长为 1 的紫色斜箭头 S = A + B，落在虚线单位圆上；A 与 B 张出的品红方块是 J = 2AB*。第三栏：两个圆，左边是旋子，右边是旋转，中间一个箭头标着 z²。θ 从 0° 到 360°：右边的圆被绕满一整圈，回到出发点的琥珀色点；左边紫色的弧只从 1 走了半圈，停在对面琥珀色的 −1。</title>
