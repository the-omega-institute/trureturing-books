<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch17-interval-signs" data-lang="zh" viewBox="0 0 440 330" width="440" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="时空图，x 向右、t 向上，两条白色的光锥线 t = ±x 交于原点，把平面分成四块。上下两块（锥内）是淡青色，t² − x² &gt; 0；左右两块（锥外）是淡品红，t² − x² &lt; 0；光锥线上 t² − x² = 0。从原点出发的三支箭头，坐标按 (t, x) 写：青色的指向 (2, 1)，读数 3；品红的指向 (1, 2)，读数 −3；白色的沿光锥指向 (1.5, 1.5)，读数 0。">
<title>时空图，x 向右、t 向上，两条白色的光锥线 t = ±x 交于原点，把平面分成四块。上下两块（锥内）是淡青色，t² − x² &gt; 0；左右两块（锥外）是淡品红，t² − x² &lt; 0；光锥线上 t² − x² = 0。从原点出发的三支箭头，坐标按 (t, x) 写：青色的指向 (2, 1)，读数 3；品红的指向 (1, 2)，读数 −3；白色的沿光锥指向 (1.5, 1.5)，读数 0。</title>
