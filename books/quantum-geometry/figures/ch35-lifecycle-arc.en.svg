<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch35-lifecycle-arc" data-lang="en" viewBox="0 0 460 320" width="460" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A quarter of the unit circle. Across is the one-dimensional persistence share cos θ (cyan), up the transverse share sin θ (magenta). Four stages are marked: I at 90° (the field of light); an outer curved arrow II turns from 90° almost down to 0° (the pulse); an inner curved arrow III turns from 0⁺ to θ* ≈ 42.35°, where the state casts a thick cyan shadow cos θ* on the horizontal axis; a dashed arc IV with a question mark goes on back to 90°, where the shadow shrinks to a single point at the origin, labelled cos 90° = 0.">
<title>A quarter of the unit circle. Across is the one-dimensional persistence share cos θ (cyan), up the transverse share sin θ (magenta). Four stages are marked: I at 90° (the field of light); an outer curved arrow II turns from 90° almost down to 0° (the pulse); an inner curved arrow III turns from 0⁺ to θ* ≈ 42.35°, where the state casts a thick cyan shadow cos θ* on the horizontal axis; a dashed arc IV with a question mark goes on back to 90°, where the shadow shrinks to a single point at the origin, labelled cos 90° = 0.</title>
