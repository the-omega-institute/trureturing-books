<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch07-commutator-flow" data-lang="zh" data-wrap="1" viewBox="0 0 560 270" width="560" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两栏。左栏一颗布洛赫球：紫色的转轴 H 从竖直方向斜开 40°，青色的竖轴是尺子 P，琥珀色的态从北极出发，绕紫色的轴走一圈虚线小圆，它落在青色竖轴上的影子随之上下移动。右栏横轴是时间 ωt，从 0 到 720°：青色的曲线是转轴斜 40° 时留在 |0⟩ 的概率 p(t)，在 1 与 0.59 之间起伏；灰色的水平线是转轴与尺子重合、[H, P] = 0 时的 p(t)，一直是 1。">
<title>两栏。左栏一颗布洛赫球：紫色的转轴 H 从竖直方向斜开 40°，青色的竖轴是尺子 P，琥珀色的态从北极出发，绕紫色的轴走一圈虚线小圆，它落在青色竖轴上的影子随之上下移动。右栏横轴是时间 ωt，从 0 到 720°：青色的曲线是转轴斜 40° 时留在 |0⟩ 的概率 p(t)，在 1 与 0.59 之间起伏；灰色的水平线是转轴与尺子重合、[H, P] = 0 时的 p(t)，一直是 1。</title>
