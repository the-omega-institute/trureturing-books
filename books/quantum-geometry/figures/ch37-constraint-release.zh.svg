<title>横轴是候选场景与时空锚的重叠 x₂，从 −1 到 1；纵轴是相容行列式。墨色的抛物线是三锚俱在时的 det G₃，只在 x₂ 从 0.28 到 1 的窄窗里不小于 0，在 x₂ = 0.8 处为 0.104；在 x₂ = 0 处它是 −0.28，被打叉。青色的水平线是挂起时空锚后的 det G₂ = 0.36，对每个 x₂ 都为正，在 x₂ = 0 处是一个青色的点。</title>
