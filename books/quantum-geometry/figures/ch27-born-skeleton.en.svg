<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-born-skeleton" data-lang="en" viewBox="0 0 560 352" width="560" height="352" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A proof skeleton, top to bottom. On the left the dashed hypothesis Tr ρ = 1 leads to branch ①: Tr(ρ · 1) = 1, by simpa … using hTrace. Branch ②: additivity, by Matrix.mul_add, with no hypothesis. On the right branch ③ starts from the hypothesis ρ ⪰ 0 and goes down in three steps: PρP∗ ⪰ 0 (mul_mul_conjTranspose_same), Tr(PρP∗) = Tr(ρP) (trace_mul_cycle, using the hypotheses P∗ = P and P² = P), and 0 ≤ Tr(ρP) (trace_nonneg). The three branches meet in the green LEAN ✓ born_probability_skeleton at the bottom.">
<title>A proof skeleton, top to bottom. On the left the dashed hypothesis Tr ρ = 1 leads to branch ①: Tr(ρ · 1) = 1, by simpa … using hTrace. Branch ②: additivity, by Matrix.mul_add, with no hypothesis. On the right branch ③ starts from the hypothesis ρ ⪰ 0 and goes down in three steps: PρP∗ ⪰ 0 (mul_mul_conjTranspose_same), Tr(PρP∗) = Tr(ρP) (trace_mul_cycle, using the hypotheses P∗ = P and P² = P), and 0 ≤ Tr(ρP) (trace_nonneg). The three branches meet in the green LEAN ✓ born_probability_skeleton at the bottom.</title>
