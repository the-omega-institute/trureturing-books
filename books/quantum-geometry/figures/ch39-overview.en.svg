<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 280" width="740" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: above, a grey pointer register ptr and the dashed wall between it and memory are struck out; below, two rows of four cells p, each with a small cyan arrow that leaves it and comes back to it, and the line p ≡ *p. Panel II: an amber slanted line is the blade; inside a pale cyan strip around it lies a run of cyan lattice points, and outside the strip there is nothing; below, the points projected onto the blade form a row of long and short steps, short marked 1 and long 0, with no adjacent 11. Panel III: two dashed circles, w above and z = w² below; on the lower circle a cyan arrow starts at 1 and goes once all the way round, while on the upper circle a violet arrow starts at +1 and goes only half way, stopping at −1; below, a green LEAN ✓ tag.">
<title>Three panels. Panel I: above, a grey pointer register ptr and the dashed wall between it and memory are struck out; below, two rows of four cells p, each with a small cyan arrow that leaves it and comes back to it, and the line p ≡ *p. Panel II: an amber slanted line is the blade; inside a pale cyan strip around it lies a run of cyan lattice points, and outside the strip there is nothing; below, the points projected onto the blade form a row of long and short steps, short marked 1 and long 0, with no adjacent 11. Panel III: two dashed circles, w above and z = w² below; on the lower circle a cyan arrow starts at 1 and goes once all the way round, while on the upper circle a violet arrow starts at +1 and goes only half way, stopping at −1; below, a green LEAN ✓ tag.</title>
