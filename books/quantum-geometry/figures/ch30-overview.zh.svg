<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch30-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：琥珀色的箭头 P₀ 是观察者的态，三支墨色箭头是 n = 2、4、8 时隐藏的目标，一支比一支更贴近竖直的 90° 视界，投到 P₀ 上的青色影子越来越短。第二栏：五边形 0—1—2—3—4—0 的顶点按颜色 c = (0, 1, 0, 1, 2) 摆在三条横线上，每条边的箭头都朝上，青色标出最长的线 2 → 3 → 4，三个顶点；旁边有绿色的 LEAN ✓ 标记。第三栏：两根竖直的涡管，左边短而粗，右边被拉长、变细；青色的环量回路在两根上相同，品红的涡度箭头在细的那根上更长；下方写着 A → 0？并有红色的 OPEN 标记。">
<title>三栏。第一栏：琥珀色的箭头 P₀ 是观察者的态，三支墨色箭头是 n = 2、4、8 时隐藏的目标，一支比一支更贴近竖直的 90° 视界，投到 P₀ 上的青色影子越来越短。第二栏：五边形 0—1—2—3—4—0 的顶点按颜色 c = (0, 1, 0, 1, 2) 摆在三条横线上，每条边的箭头都朝上，青色标出最长的线 2 → 3 → 4，三个顶点；旁边有绿色的 LEAN ✓ 标记。第三栏：两根竖直的涡管，左边短而粗，右边被拉长、变细；青色的环量回路在两根上相同，品红的涡度箭头在细的那根上更长；下方写着 A → 0？并有红色的 OPEN 标记。</title>
