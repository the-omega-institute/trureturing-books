<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch30-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：琥珀色的箭头 P₀ 是观察者的态，三支墨色箭头是 n = 2、4、8 时隐藏的目标，一支比一支更贴近竖直的 90° 视界，投到 P₀ 上的青色影子越来越短。第二栏：横轴 log₂ n，青色的示意曲线先升后降，与品红的水平线 0.386 交于 log₂ n ≈ 558，远在灰色阴影（可观测宇宙，log₂ n ≤ 266）之外。第三栏：两根竖直的涡管，左边短而粗，右边被拉长、变细；青色的环量回路在两根上相同，品红的涡度箭头在细的那根上更长；下方写着 A → 0？并有红色的 OPEN 标记。">
<title>三栏。第一栏：琥珀色的箭头 P₀ 是观察者的态，三支墨色箭头是 n = 2、4、8 时隐藏的目标，一支比一支更贴近竖直的 90° 视界，投到 P₀ 上的青色影子越来越短。第二栏：横轴 log₂ n，青色的示意曲线先升后降，与品红的水平线 0.386 交于 log₂ n ≈ 558，远在灰色阴影（可观测宇宙，log₂ n ≤ 266）之外。第三栏：两根竖直的涡管，左边短而粗，右边被拉长、变细；青色的环量回路在两根上相同，品红的涡度箭头在细的那根上更长；下方写着 A → 0？并有红色的 OPEN 标记。</title>
