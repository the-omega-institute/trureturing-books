<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch18-chiral-precession" data-lang="zh" data-wrap="1" viewBox="0 0 646 300" width="646" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两栏。左栏：布洛赫球的 x–z 截面，一个圆。紫色的转轴从圆心指向 (4, 0, 3)/5，即 H = 3Z + 4X 的方向，轴端一个紫色的点是 E = +5 的本征态。琥珀色的箭头指向北极，是纯上分量 (1, 0)；它绕紫轴转出的圈在这个截面里侧着看成一条琥珀色虚线，从北极斜到圆的右下方。这条虚线在竖直的 z 轴上的影子是一段青色的粗线，从 P = 1 到 P = 9/25。右栏：坐标图，横轴是时间 t，标着 π/5 与 2π/5；纵轴是上分量的布居 P(上)。青色的曲线从 1 出发，往下摆到 9/25 再回到 1，摆了两回；紫色的水平线停在 4/5，是从本征态出发的情形。">
<title>两栏。左栏：布洛赫球的 x–z 截面，一个圆。紫色的转轴从圆心指向 (4, 0, 3)/5，即 H = 3Z + 4X 的方向，轴端一个紫色的点是 E = +5 的本征态。琥珀色的箭头指向北极，是纯上分量 (1, 0)；它绕紫轴转出的圈在这个截面里侧着看成一条琥珀色虚线，从北极斜到圆的右下方。这条虚线在竖直的 z 轴上的影子是一段青色的粗线，从 P = 1 到 P = 9/25。右栏：坐标图，横轴是时间 t，标着 π/5 与 2π/5；纵轴是上分量的布居 P(上)。青色的曲线从 1 出发，往下摆到 9/25 再回到 1，摆了两回；紫色的水平线停在 4/5，是从本征态出发的情形。</title>
