<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch03-complementarity" data-lang="zh" viewBox="0 0 440 380" width="440" height="380" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="坐标平面，横轴是路径可预测度 D，纵轴是条纹可见度 V，都从 0 到 1。四分之一圆弧 D² + V² = 1 上是纯态，弧内是混合态。琥珀色的点在弧上的 D = 0.8、V = 0.6 处：青色的横线是 D，品红的竖线是 V。弧内一条半径 0.6 的虚线弧上有一个灰点，是 ‖r‖ = 0.6 的混合态。">
<title>坐标平面，横轴是路径可预测度 D，纵轴是条纹可见度 V，都从 0 到 1。四分之一圆弧 D² + V² = 1 上是纯态，弧内是混合态。琥珀色的点在弧上的 D = 0.8、V = 0.6 处：青色的横线是 D，品红的竖线是 V。弧内一条半径 0.6 的虚线弧上有一个灰点，是 ‖r‖ = 0.6 的混合态。</title>
