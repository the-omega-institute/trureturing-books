<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-parallelogram" data-lang="zh" data-wrap="1" viewBox="0 0 560 252" width="560" height="252" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两支等长的单位箭头 x 与 y 从同一点出发，张开 60°，围成一个平行四边形，画面上没有任何坐标轴。长对角线 x + y 画成青色实线，标注 |x + y|² = 3；短对角线 x − y 画成青色虚线，标注 |x − y|² = 1。两者之差的四分之一是 ½，正是 cos 60°。">
<title>两支等长的单位箭头 x 与 y 从同一点出发，张开 60°，围成一个平行四边形，画面上没有任何坐标轴。长对角线 x + y 画成青色实线，标注 |x + y|² = 3；短对角线 x − y 画成青色虚线，标注 |x − y|² = 1。两者之差的四分之一是 ½，正是 cos 60°。</title>
