<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="appa-dictionary" data-lang="zh" data-wrap="1" viewBox="0 0 560 412" width="560" height="412" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="六张同样大小的小图，排成两行，每张上面写传统写法，下面写本书的几何说法。纯态 |ψ⟩：球面上一支琥珀色的箭头，即球面上的方向。玻恩法则 |⟨φ|ψ⟩|²：标尺 a 与琥珀色的箭头 b 夹角 θ，b 落在 a 上的青色影子长 cos θ，概率是影子的平方 cos²θ。密度矩阵 ρ：圆盘里一个琥珀色的点，到圆心的距离小于 1，即球内的点。退相干：琥珀色的点沿品红的横向虚线移到竖直的青色测量轴上，横着的那一份被抹掉，即捏合到测量轴。对易子 [A, B]：两支箭头 u、v 张成品红的平行四边形，带一个转向箭头，即有向面积 2 u∧v。单比特门 U：紫色的转轴，灰色箭头绕它转到琥珀色箭头，即旋转器。">
<title>六张同样大小的小图，排成两行，每张上面写传统写法，下面写本书的几何说法。纯态 |ψ⟩：球面上一支琥珀色的箭头，即球面上的方向。玻恩法则 |⟨φ|ψ⟩|²：标尺 a 与琥珀色的箭头 b 夹角 θ，b 落在 a 上的青色影子长 cos θ，概率是影子的平方 cos²θ。密度矩阵 ρ：圆盘里一个琥珀色的点，到圆心的距离小于 1，即球内的点。退相干：琥珀色的点沿品红的横向虚线移到竖直的青色测量轴上，横着的那一份被抹掉，即捏合到测量轴。对易子 [A, B]：两支箭头 u、v 张成品红的平行四边形，带一个转向箭头，即有向面积 2 u∧v。单比特门 U：紫色的转轴，灰色箭头绕它转到琥珀色箭头，即旋转器。</title>
