<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch37-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：上面一块 2 × 2 方格，两个对角格是青色方块，两个非对角格是品红方块，方块面积是矩阵元的大小；箭头“捏合”向下，下面一块里青色对角原样留下，品红的非对角只剩虚线框。第二栏：半径 1/2 的圆上，ρ₀₁ 从右端的 1/2 出发，两支品红箭头沿下半圆各转四分之一圈到左端的 −1/2；两支青色箭头沿内侧原路转回 1/2。第三栏：两条同样的直线上排着同一串位置；上面一条只有中间的躯体位置 x₀ 是琥珀色，其余是灰点；下面一条标着 P_body → 0，所有位置都亮成青色。">
<title>三栏。第一栏：上面一块 2 × 2 方格，两个对角格是青色方块，两个非对角格是品红方块，方块面积是矩阵元的大小；箭头“捏合”向下，下面一块里青色对角原样留下，品红的非对角只剩虚线框。第二栏：半径 1/2 的圆上，ρ₀₁ 从右端的 1/2 出发，两支品红箭头沿下半圆各转四分之一圈到左端的 −1/2；两支青色箭头沿内侧原路转回 1/2。第三栏：两条同样的直线上排着同一串位置；上面一条只有中间的躯体位置 x₀ 是琥珀色，其余是灰点；下面一条标着 P_body → 0，所有位置都亮成青色。</title>
