<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch13-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: a 4 × 4 board whose rows are Alice&#x27;s I, X, Y, Z and whose columns are Bob&#x27;s; the first row and the first column each hold three cyan local-line cells, and the lower-right 3 × 3 block holds nine magenta correlation cells, 6 + 9 = 15 in all. Panel II: two Bloch balls side by side, each with its amber point at the centre (r = 0, s = 0), joined by a magenta band labelled correlation. Panel III: the angle θ runs from 0° to 180°; the cyan cosine arc and the dim straight toy line meet at 0°, 90° and 180°, and at 45° the arc stands a magenta gap above the line.">
<title>Three panels. Panel I: a 4 × 4 board whose rows are Alice&#x27;s I, X, Y, Z and whose columns are Bob&#x27;s; the first row and the first column each hold three cyan local-line cells, and the lower-right 3 × 3 block holds nine magenta correlation cells, 6 + 9 = 15 in all. Panel II: two Bloch balls side by side, each with its amber point at the centre (r = 0, s = 0), joined by a magenta band labelled correlation. Panel III: the angle θ runs from 0° to 180°; the cyan cosine arc and the dim straight toy line meet at 0°, 90° and 180°, and at 45° the arc stands a magenta gap above the line.</title>
