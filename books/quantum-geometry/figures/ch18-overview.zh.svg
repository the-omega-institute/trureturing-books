<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch18-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：上下两个圆点是二分量手性模型的两个分量，蓝色的上分量 Z = +1 与橙色斜纹的下分量 Z = −1；各自带一个绕回自身的小圈，标着 +p 与 −p；两点之间唯一的连线是双向箭头 m。第二栏：3 × 3 的格点上，青色的生成树是三行横边加最左一列；其余四条竖边是弦，三条画成灰色虚线，右上那一条是品红实线，它与树一起围出上面两格组成的品红长方形，里面一个逆时针的品红圆箭头；下方写着树边 8、弦 4 = m + 1 − n。第三栏：例题的单个方格，四个角上是紫色的规范指针 1、i、−1、−i，四条边中点是边相位指针，读作 i、i、i、−1；方格中心品红的回路指针指向 i。">
<title>三栏。第一栏：上下两个圆点是二分量手性模型的两个分量，蓝色的上分量 Z = +1 与橙色斜纹的下分量 Z = −1；各自带一个绕回自身的小圈，标着 +p 与 −p；两点之间唯一的连线是双向箭头 m。第二栏：3 × 3 的格点上，青色的生成树是三行横边加最左一列；其余四条竖边是弦，三条画成灰色虚线，右上那一条是品红实线，它与树一起围出上面两格组成的品红长方形，里面一个逆时针的品红圆箭头；下方写着树边 8、弦 4 = m + 1 − n。第三栏：例题的单个方格，四个角上是紫色的规范指针 1、i、−1、−i，四条边中点是边相位指针，读作 i、i、i、−1；方格中心品红的回路指针指向 i。</title>
