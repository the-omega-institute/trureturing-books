<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-four-fates" data-lang="en" viewBox="0 0 360 532" width="360" height="532" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Sixteen 2 × 2 matrices with entries 0 or 1, in four rows of four. The ten with determinant zero are grey and marked det = 0; the other six are framed in ink and each names its fate: the identity is .empty, the upper triangle (1 1; 0 1) is .dead, the swap with Δ = 4 and the lower triangle with Δ = 0 are .collapse, and the two cyan frames, (1 1; 1 0) and (0 1; 1 1), read .live and Δ = 5. Below: 16 → 6 → 2, the two maps that live are x = 1 + 1/x and x = 1/(x + 1), with a green LEAN ✓ tag.">
<title>Sixteen 2 × 2 matrices with entries 0 or 1, in four rows of four. The ten with determinant zero are grey and marked det = 0; the other six are framed in ink and each names its fate: the identity is .empty, the upper triangle (1 1; 0 1) is .dead, the swap with Δ = 4 and the lower triangle with Δ = 0 are .collapse, and the two cyan frames, (1 1; 1 0) and (0 1; 1 1), read .live and Δ = 5. Below: 16 → 6 → 2, the two maps that live are x = 1 + 1/x and x = 1/(x + 1), with a green LEAN ✓ tag.</title>
