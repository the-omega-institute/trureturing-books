<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch11-two-pictures" data-lang="zh" data-wrap="1" viewBox="0 0 520 290" width="520" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两颗同样大小的布洛赫球。左边推态：琥珀色的态绕紫色的转轴从灰点转到新位置，读出方向（北极的 |0⟩）不动；青色的弧是态与读出方向之间的夹角 α。右边拉回读出：琥珀色的态留在原处，灰色的读出方向倒着转到新位置；青色的弧是同样的 α。两边夹角相同，所以读到 |0⟩ 的概率相同。">
<title>两颗同样大小的布洛赫球。左边推态：琥珀色的态绕紫色的转轴从灰点转到新位置，读出方向（北极的 |0⟩）不动；青色的弧是态与读出方向之间的夹角 α。右边拉回读出：琥珀色的态留在原处，灰色的读出方向倒着转到新位置；青色的弧是同样的 α。两边夹角相同，所以读到 |0⟩ 的概率相同。</title>
