<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch19-facet-seam" data-lang="en" viewBox="0 0 520 330" width="520" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A plot: the horizontal axis is ln d, marked d = 2, 3, 4; the vertical axis is log capacity, marked 4, 6, 8, 12. Three straight lines are the log capacities of the three cuts: a grey horizontal line at the top, ln 3ac = ln 12; a blue sloping line, ln ad; an orange horizontal line, ln bc = ln 6. The min cut follows their lower envelope: it climbs along the blue line and at d = 3, the dashed vertical seam ad = bc, turns onto the orange line. Three lattice points on the envelope, d = 2, 3, 4, are labelled with the candidate cuts (12, 4, 6), (12, 6, 6), (12, 8, 6); the min cut is 4, 6, 6.">
<title>A plot: the horizontal axis is ln d, marked d = 2, 3, 4; the vertical axis is log capacity, marked 4, 6, 8, 12. Three straight lines are the log capacities of the three cuts: a grey horizontal line at the top, ln 3ac = ln 12; a blue sloping line, ln ad; an orange horizontal line, ln bc = ln 6. The min cut follows their lower envelope: it climbs along the blue line and at d = 3, the dashed vertical seam ad = bc, turns onto the orange line. Three lattice points on the envelope, d = 2, 3, 4, are labelled with the candidate cuts (12, 4, 6), (12, 6, 6), (12, 8, 6); the min cut is 4, 6, 6.</title>
