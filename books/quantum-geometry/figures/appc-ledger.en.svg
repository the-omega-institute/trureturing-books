<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="appc-ledger" data-lang="en" viewBox="0 0 500 300" width="500" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A ledger of two rows and three columns: the rows are theorems and definitions, the columns are cited with lean= in an environment, cited by media and only inline in the text, and reached by inline links only. The theorem row reads 296, 7, 103, total 406; the definition row 97, 0, 52, total 149; in all 555. Three dashed frames mark the three indexes of appendix C: C.1 = 296, C.2 = 97, C.2.1 = 7 + 103 + 0 + 52 = 162.">
<title>A ledger of two rows and three columns: the rows are theorems and definitions, the columns are cited with lean= in an environment, cited by media and only inline in the text, and reached by inline links only. The theorem row reads 296, 7, 103, total 406; the definition row 97, 0, 52, total 149; in all 555. Three dashed frames mark the three indexes of appendix C: C.1 = 296, C.2 = 97, C.2.1 = 7 + 103 + 0 + 52 = 162.</title>
