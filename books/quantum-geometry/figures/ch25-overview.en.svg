<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch25-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 290" width="740" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: the three-bit masks of e₂ · e₁ as three rows of cells under columns e₁, e₂, e₃; the left factor 010₂ lights e₂, the right factor 001₂ lights e₁, and the result row 011₂ lights both, which is e₁₂. Below, two magenta strands cross once to sort e₂e₁ into e₁e₂, and the result carries a magenta minus: e₂ · e₁ = −e₁₂. Panel II: two cyan dashed mirrors in the plane of state vectors; the amber arrow u reflected in X then Z, or in Z then X, gives two dark arrows ZXu and XZu at opposite ends. Panel III: an amber arrow a split into a vertical cyan part and a horizontal dark part; in the 2 × 2 grid below, the diagonal holds the cyan a₂ and −a₂ and the two corners hold the dark a₀ − i a₁ and a₀ + i a₁.">
<title>Three panels. Panel I: the three-bit masks of e₂ · e₁ as three rows of cells under columns e₁, e₂, e₃; the left factor 010₂ lights e₂, the right factor 001₂ lights e₁, and the result row 011₂ lights both, which is e₁₂. Below, two magenta strands cross once to sort e₂e₁ into e₁e₂, and the result carries a magenta minus: e₂ · e₁ = −e₁₂. Panel II: two cyan dashed mirrors in the plane of state vectors; the amber arrow u reflected in X then Z, or in Z then X, gives two dark arrows ZXu and XZu at opposite ends. Panel III: an amber arrow a split into a vertical cyan part and a horizontal dark part; in the 2 × 2 grid below, the diagonal holds the cyan a₂ and −a₂ and the two corners hold the dark a₀ − i a₁ and a₀ + i a₁.</title>
