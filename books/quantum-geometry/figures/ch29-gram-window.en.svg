<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch29-gram-window" data-lang="en" viewBox="0 0 460 340" width="460" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A square plot with c_BC across and c_AC up, both from −1 to 1, titled c_AB = cos 60°. A tilted ellipse is shaded violet, meaning det G &gt; 0; its rim is made of two curves, cos(θ₁ − θ₂) on top and cos(θ₁ + θ₂) below, and on the rim det G = 0. At c_BC = cos 45° an amber vertical segment runs from the lower rim at cos 105° ≈ −0.26 to the upper rim at cos 15° ≈ 0.97: the window for c_AC.">
<title>A square plot with c_BC across and c_AC up, both from −1 to 1, titled c_AB = cos 60°. A tilted ellipse is shaded violet, meaning det G &gt; 0; its rim is made of two curves, cos(θ₁ − θ₂) on top and cos(θ₁ + θ₂) below, and on the rim det G = 0. At c_BC = cos 45° an amber vertical segment runs from the lower rim at cos 105° ≈ −0.26 to the upper rim at cos 15° ≈ 0.97: the window for c_AC.</title>
