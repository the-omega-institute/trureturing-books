<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-mub-gap" data-lang="zh" viewBox="0 0 430 290" width="430" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="横轴是 Z 基对角态 ρ 在竖轴上的高度 r，从 −1 到 1；纵轴是熵（奈特）。顶上一条虚线是 ln 2，即 X 基捏合后的 S(σ)。下面的拱形曲线是 S(ρ)，在 r = 0 处碰到 ln 2，在两端降到 0。曲线与虚线之间的品红区域就是 D(ρ‖σ) = ln 2 − S(ρ)。右端 r = 1 处的琥珀色点是纯态 |0⟩，那里品红的一截是整整 ln 2。">
<title>横轴是 Z 基对角态 ρ 在竖轴上的高度 r，从 −1 到 1；纵轴是熵（奈特）。顶上一条虚线是 ln 2，即 X 基捏合后的 S(σ)。下面的拱形曲线是 S(ρ)，在 r = 0 处碰到 ln 2，在两端降到 0。曲线与虚线之间的品红区域就是 D(ρ‖σ) = ln 2 − S(ρ)。右端 r = 1 处的琥珀色点是纯态 |0⟩，那里品红的一截是整整 ln 2。</title>
