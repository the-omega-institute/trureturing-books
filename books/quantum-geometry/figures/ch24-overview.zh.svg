<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 280" width="740" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：青色的余弦曲线 y = cos x 与灰色的对角线 y = x，从 0 出发的蛛网折线一圈圈绕向交点 θ* ≈ 0.739。第二栏：三个盒子自上而下，候选集 {0, 1, 2} 每步删掉一个元素，变成 {0, 1}、{0}，再下一步仍是 {0}，在这里停下。第三栏：青色的曲线 y = 1 + 1/x 与灰色的对角线 y = x 在正半轴上只交于一点，绿色的点 φ ≈ 1.618。">
<title>三栏。第一栏：青色的余弦曲线 y = cos x 与灰色的对角线 y = x，从 0 出发的蛛网折线一圈圈绕向交点 θ* ≈ 0.739。第二栏：三个盒子自上而下，候选集 {0, 1, 2} 每步删掉一个元素，变成 {0, 1}、{0}，再下一步仍是 {0}，在这里停下。第三栏：青色的曲线 y = 1 + 1/x 与灰色的对角线 y = x 在正半轴上只交于一点，绿色的点 φ ≈ 1.618。</title>
