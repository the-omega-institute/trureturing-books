<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-turning-points" data-lang="en" viewBox="0 0 560 300" width="560" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A grid: across are the 12 gates K1, U1 to U10, KN; up are layers 0 to 3. Each gate is a cyan brick, and the bricks form three staircases stepping down to the right, four bricks each, from layer 3 to layer 0; above U4 and U8 a small magenta triangle marks a turning point, where the staircase jumps back to layer 3. Arrows between neighbouring bricks point from the gate that runs first to the one that runs after it. On the right: 4 layers; below: 12 gates.">
<title>A grid: across are the 12 gates K1, U1 to U10, KN; up are layers 0 to 3. Each gate is a cyan brick, and the bricks form three staircases stepping down to the right, four bricks each, from layer 3 to layer 0; above U4 and U8 a small magenta triangle marks a turning point, where the staircase jumps back to layer 3. Arrows between neighbouring bricks point from the gate that runs first to the one that runs after it. On the right: 4 layers; below: 12 gates.</title>
