<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-cut-c" data-lang="zh" data-wrap="1" viewBox="0 0 560 300" width="560" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两幅图画的是同一对箭头。左图：一根灰色虚线的竖轴是外部的天花板 Z，也就是第 3 点 C；青色的箭头 A 离它 60°，琥珀色的箭头 B 离它 120°，要先量这两个角再换算。右图：去掉天花板，青色的箭头 A 自己当竖轴，琥珀色的箭头 B 离它只有一个角 θ = 60°，直接得到权重 cos² 30° = ¾。">
<title>两幅图画的是同一对箭头。左图：一根灰色虚线的竖轴是外部的天花板 Z，也就是第 3 点 C；青色的箭头 A 离它 60°，琥珀色的箭头 B 离它 120°，要先量这两个角再换算。右图：去掉天花板，青色的箭头 A 自己当竖轴，琥珀色的箭头 B 离它只有一个角 θ = 60°，直接得到权重 cos² 30° = ¾。</title>
