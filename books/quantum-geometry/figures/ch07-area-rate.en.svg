<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch07-area-rate" data-lang="en" viewBox="0 0 420 300" width="420" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="An arrow from the centre of a circle turns counter-clockwise. Three faint arrows are earlier positions, Δt apart, and the amber arrow ψ(t) is the present one; between neighbouring arrows lie three equal magenta sectors, each labelled Δt. At the tip of the amber arrow a violet arrow Gψ points along the tangent, at a right angle to ψ, so the arrow turns without stretching.">
<title>An arrow from the centre of a circle turns counter-clockwise. Three faint arrows are earlier positions, Δt apart, and the amber arrow ψ(t) is the present one; between neighbouring arrows lie three equal magenta sectors, each labelled Δt. At the tip of the amber arrow a violet arrow Gψ points along the tangent, at a right angle to ψ, so the arrow turns without stretching.</title>
