<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch29-pell-seam" data-lang="zh" viewBox="0 0 480 300" width="480" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="横轴是步数 k = 0 到 5，纵轴是误差 P_{k+1}·s − P_k，按绝对值取对数刻度。六根竖线交替朝上（青色）和朝下（品红），绝对值依次是 0.414、0.172、0.071、0.029、0.012、0.005，端点都落在两条虚线包络 ±s^{k+1} 上，每一步缩短相同的一格，变号却不归零。竖线顶端标着渐近分数 1/1、3/2、7/5、17/12、41/29、99/70。横轴下方一行是 Q² − 2P²：−1、+1、−1、+1、−1、+1。">
<title>横轴是步数 k = 0 到 5，纵轴是误差 P_{k+1}·s − P_k，按绝对值取对数刻度。六根竖线交替朝上（青色）和朝下（品红），绝对值依次是 0.414、0.172、0.071、0.029、0.012、0.005，端点都落在两条虚线包络 ±s^{k+1} 上，每一步缩短相同的一格，变号却不归零。竖线顶端标着渐近分数 1/1、3/2、7/5、17/12、41/29、99/70。横轴下方一行是 Q² − 2P²：−1、+1、−1、+1、−1、+1。</title>
