<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch25-anticommute" data-lang="en" viewBox="0 0 460 330" width="460" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The real plane of state vectors, with two cyan dashed mirrors on the unit circle: the horizontal mirror of Z and the mirror of X at 45°. The amber arrow u points at 25°. The dashed jumps reflect in X first, then in Z: u jumps to 65°, then straight down to −65°, ending at ZXu. The solid jumps reflect in Z first, then in X: u jumps straight down to −25°, then across to 115°, ending at XZu. The two dark arrows ZXu and XZu make one diameter through the centre and point at opposite ends.">
<title>The real plane of state vectors, with two cyan dashed mirrors on the unit circle: the horizontal mirror of Z and the mirror of X at 45°. The amber arrow u points at 25°. The dashed jumps reflect in X first, then in Z: u jumps to 65°, then straight down to −65°, ending at ZXu. The solid jumps reflect in Z first, then in X: u jumps straight down to −25°, then across to 115°, ending at XZu. The two dark arrows ZXu and XZu make one diameter through the centre and point at opposite ends.</title>
