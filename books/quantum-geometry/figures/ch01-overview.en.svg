<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: a single arrow A in empty space; wherever it is turned about its tail, the grey dashed copies look the same, marked θ = ?. Panel II: behind two arrows x and y stands a grey dashed external frame C; the angle between the two arrows does not need it. Panel III: the cyan arrow A is the ruler, the line it lies on is marked +1 and −1 at its two ends, and the amber arrow B opens an angle θ with A.">
<title>Three panels. Panel I: a single arrow A in empty space; wherever it is turned about its tail, the grey dashed copies look the same, marked θ = ?. Panel II: behind two arrows x and y stands a grey dashed external frame C; the angle between the two arrows does not need it. Panel III: the cyan arrow A is the ruler, the line it lies on is marked +1 and −1 at its two ends, and the amber arrow B opens an angle θ with A.</title>
