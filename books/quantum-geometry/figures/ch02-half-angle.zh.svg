<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-half-angle" data-lang="zh" data-wrap="1" viewBox="0 0 560 312" width="560" height="312" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="左边是布洛赫球的半个截面：从北极 a 出发顺着球面走到南极，是 θ 从 0° 到 180°，标出 0°、60°、90°、120°、180° 五个点。右边是希尔伯特空间里的四分之一圆：从 |φ⟩ 到与它正交的 |φ⊥⟩，是 θ/2 从 0° 到 90°，五个点依次在 0°、30°、45°、60°、90°，旁边青色的数是玻恩权重 cos²(θ/2)：1、¾、½、¼、0。琥珀色的箭头在两边各指着同一行：球面 120°，希尔伯特 60°，权重 ¼。">
<title>左边是布洛赫球的半个截面：从北极 a 出发顺着球面走到南极，是 θ 从 0° 到 180°，标出 0°、60°、90°、120°、180° 五个点。右边是希尔伯特空间里的四分之一圆：从 |φ⟩ 到与它正交的 |φ⊥⟩，是 θ/2 从 0° 到 90°，五个点依次在 0°、30°、45°、60°、90°，旁边青色的数是玻恩权重 cos²(θ/2)：1、¾、½、¼、0。琥珀色的箭头在两边各指着同一行：球面 120°，希尔伯特 60°，权重 ¼。</title>
