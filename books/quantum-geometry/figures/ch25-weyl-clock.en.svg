<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch25-weyl-clock" data-lang="en" data-wrap="1" viewBox="0 0 488 270" width="488" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels. Panel I: the three basis vectors |0⟩, |1⟩, |2⟩ of a three-level system sit on a ring; cyan arrows are the shift X, which pushes each one to the next round the ring, and the violet 1, ω, ω² beside them are the phases the clock Z gives them. Panel II: the unit circle of phases; XZ sits at 1 and ZX at ω, 120° further counter-clockwise, joined by a violet arc labelled 120°; a dashed arc and a dashed point marked M = 2 turn 180° to −1, which is a change of sign.">
<title>Two panels. Panel I: the three basis vectors |0⟩, |1⟩, |2⟩ of a three-level system sit on a ring; cyan arrows are the shift X, which pushes each one to the next round the ring, and the violet 1, ω, ω² beside them are the phases the clock Z gives them. Panel II: the unit circle of phases; XZ sits at 1 and ZX at ω, 120° further counter-clockwise, joined by a violet arc labelled 120°; a dashed arc and a dashed point marked M = 2 turn 180° to −1, which is a change of sign.</title>
