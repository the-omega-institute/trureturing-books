<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch28-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 280" width="740" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：青色的线 φ 水平向右，琥珀色的箭头 ψ 斜向上；从 ψ 的尖端向 φ 作垂线，落下青色的影子 |⟨φ|ψ⟩| = 3/5，影子下方是以它为边的青色正方形，面积 |⟨φ|ψ⟩|² = 9/25。第二栏：上半，一根长为 1 的横条分成青色深浅两段，w₀ = 9/25 与 w₁ = 16/25，合起来是未读态；下半，两段各除以自己的权重，各自撑满一整根横条，标着 ρ₀ 与 ρ₁ 的迹为 1。第三栏：上面是带品红交叉块的 2 × 2 块矩阵 ρ，旁注 U(ρ) ≠ ρ；下面是交叉块已划掉的 ρ′，带一个回到自身的小圈箭头，旁注 U(ρ′) = ρ′。">
<title>三栏。第一栏：青色的线 φ 水平向右，琥珀色的箭头 ψ 斜向上；从 ψ 的尖端向 φ 作垂线，落下青色的影子 |⟨φ|ψ⟩| = 3/5，影子下方是以它为边的青色正方形，面积 |⟨φ|ψ⟩|² = 9/25。第二栏：上半，一根长为 1 的横条分成青色深浅两段，w₀ = 9/25 与 w₁ = 16/25，合起来是未读态；下半，两段各除以自己的权重，各自撑满一整根横条，标着 ρ₀ 与 ρ₁ 的迹为 1。第三栏：上面是带品红交叉块的 2 × 2 块矩阵 ρ，旁注 U(ρ) ≠ ρ；下面是交叉块已划掉的 ρ′，带一个回到自身的小圈箭头，旁注 U(ρ′) = ρ′。</title>
