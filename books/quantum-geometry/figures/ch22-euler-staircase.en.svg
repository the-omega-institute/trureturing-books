<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch22-euler-staircase" data-lang="en" viewBox="0 0 500 300" width="500" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A plot with the number K of listed primes across (1 to 25) and values from 1.3 to 1.66 up. The horizontal ink line is ζ(2) = π²/6 ≈ 1.6449. The cyan staircase is the Euler product over the first K primes at s = 2: with 2 alone it is 4/3, and it reaches 25/16 = 1.5625 with 3 and 5, and the steps grow ever shorter. The gap between the staircase and the ink line is shaded magenta: at K = 25 (primes up to 97) it is only 0.0030, and it never closes.">
<title>A plot with the number K of listed primes across (1 to 25) and values from 1.3 to 1.66 up. The horizontal ink line is ζ(2) = π²/6 ≈ 1.6449. The cyan staircase is the Euler product over the first K primes at s = 2: with 2 alone it is 4/3, and it reaches 25/16 = 1.5625 with 3 and 5, and the steps grow ever shorter. The gap between the staircase and the ink line is shaded magenta: at K = 25 (primes up to 97) it is only 0.0030, and it never closes.</title>
