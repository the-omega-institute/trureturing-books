<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch11-trace-order" data-lang="zh" viewBox="0 0 440 300" width="440" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="双对数坐标，横轴是步长 t，从 0.01 到 1。三条线：品红的线是三段脉冲核乘积的迹的虚部，斜率为 1，按 t 增长；青色的线是迹的实部与 Tr(ABC) 的偏差，斜率为 2，按 t² 增长，在小 t 处比品红的线低得多；绿色的线是命题给出的界 (5/4)L⁵t²，青色的线始终在它下方。这里取了三个弗罗贝尼乌斯范数为 1 的实对称 2×2 矩阵。">
<title>双对数坐标，横轴是步长 t，从 0.01 到 1。三条线：品红的线是三段脉冲核乘积的迹的虚部，斜率为 1，按 t 增长；青色的线是迹的实部与 Tr(ABC) 的偏差，斜率为 2，按 t² 增长，在小 t 处比品红的线低得多；绿色的线是命题给出的界 (5/4)L⁵t²，青色的线始终在它下方。这里取了三个弗罗贝尼乌斯范数为 1 的实对称 2×2 矩阵。</title>
