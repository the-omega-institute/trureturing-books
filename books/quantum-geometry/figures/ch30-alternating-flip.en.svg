<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch30-alternating-flip" data-lang="en" data-wrap="1" viewBox="0 0 436 246" width="436" height="246" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels, the same 2 × 3 grid, vertices 0, 1, 2 on top and 3, 4, 5 below. Left: the cyan perfect matching M is the three vertical edges; the magenta N is the two horizontal edges 01 and 34 together with the shared vertical edge 25; the edges where they differ form an amber square cycle 0–1–4–3. Right: every edge carries an arrow; walking the cycle 0 → 1 → 4 → 3 → 0, each cycle edge is marked δ = +1 (with the arrow) or −1 (against it), and the four δ multiply to −1; below, τ(M) τ(N) = −∏δ = +1.">
<title>Two panels, the same 2 × 3 grid, vertices 0, 1, 2 on top and 3, 4, 5 below. Left: the cyan perfect matching M is the three vertical edges; the magenta N is the two horizontal edges 01 and 34 together with the shared vertical edge 25; the edges where they differ form an amber square cycle 0–1–4–3. Right: every edge carries an arrow; walking the cycle 0 → 1 → 4 → 3 → 0, each cycle edge is marked δ = +1 (with the arrow) or −1 (against it), and the four δ multiply to −1; below, τ(M) τ(N) = −∏δ = +1.</title>
