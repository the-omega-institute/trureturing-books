<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch05-double-cover" data-lang="zh" viewBox="0 0 560 300" width="560" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两个圆。左边紫色的圆是旋子 R(θ)，右边的圆是旋转 θ，中间一个箭头写着“平方 z ↦ z²”。转角 θ 从 0° 每次加 90° 到 720°：左圆上的点每次只走 45°，依次标 0°、90°、…、630°，实线弧是第一圈 0° 到 360°，只走了半个圆，虚线弧是第二圈；右圆上的点每次走 90°，实线与虚线两圈各绕一整圈，0°、360°、720° 落在同一点。琥珀色的点标出 θ = 360°：右圆上它回到出发点，左圆上它停在对面的 −1。">
<title>两个圆。左边紫色的圆是旋子 R(θ)，右边的圆是旋转 θ，中间一个箭头写着“平方 z ↦ z²”。转角 θ 从 0° 每次加 90° 到 720°：左圆上的点每次只走 45°，依次标 0°、90°、…、630°，实线弧是第一圈 0° 到 360°，只走了半个圆，虚线弧是第二圈；右圆上的点每次走 90°，实线与虚线两圈各绕一整圈，0°、360°、720° 落在同一点。琥珀色的点标出 θ = 360°：右圆上它回到出发点，左圆上它停在对面的 −1。</title>
