<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch38-copy-record" data-lang="en" viewBox="0 0 460 236" width="460" height="236" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three matrices from left to right. Left: the 4×4 matrix B(ρ), cut into four 2×2 blocks, each with a single entry in its top-left corner: p, c, c̄, 1−p. Middle: R(ρ) after U_copy; the cyan p and 1−p still sit in the corners of the diagonal blocks, while the magenta c and c̄ have moved to the top-right cell of the upper right block and the bottom-left cell of the lower left block. Right: the 2×2 matrix after the partial trace over the address record: cyan p and 1−p on the diagonal, 0 off it.">
