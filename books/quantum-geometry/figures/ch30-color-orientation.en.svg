<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch30-color-orientation" data-lang="en" data-wrap="1" viewBox="0 0 560 262" width="560" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels, the same pentagon 0–1–2–3–4–0, its vertices placed by height on three horizontal levels. Left: the height of a vertex is its color c = (0, 1, 0, 1, 2); every edge points up, to the end with the larger color, and cyan marks the longest thread 2 → 3 → 4, three vertices. Right: the same arrows, with each vertex now at height h, the number of steps one can walk from it along the arrows, h = (1, 0, 2, 1, 0); now every arrow points down, and h is again a three-level coloring; the cyan thread is still 2 → 3 → 4.">
<title>Two panels, the same pentagon 0–1–2–3–4–0, its vertices placed by height on three horizontal levels. Left: the height of a vertex is its color c = (0, 1, 0, 1, 2); every edge points up, to the end with the larger color, and cyan marks the longest thread 2 → 3 → 4, three vertices. Right: the same arrows, with each vertex now at height h, the number of steps one can walk from it along the arrows, h = (1, 0, 2, 1, 0); now every arrow points down, and h is again a three-level coloring; the cyan thread is still 2 → 3 → 4.</title>
