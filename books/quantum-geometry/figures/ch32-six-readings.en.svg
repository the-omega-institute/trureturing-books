<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch32-six-readings" data-lang="en" data-wrap="1" viewBox="0 0 740 352" width="740" height="352" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Six small panels in two rows. Each shows the same picture: two ink unit arrows at an angle θ, a cyan shadow and a magenta parallelogram; the two lines of text below give the domain&#x27;s reading. Geometry and topology: the line is the idempotent line P² = P, the area an oriented turning area. Quantum and gauge fields: the rank-one Born weight; rotor gates and the curvature F_μν. Relativity and holography: the proper-time rate dτ/dt; the speed v/c and minimal cuts. Arithmetic: the Hasse trace cos θ_p; the splitting p = a² + b². Complexity and fluids: the witness thread (NP is a line); the guiding field and the vorticity ∇∧u. The observer: Zeckendorf memory anchors; Landauer heat.">
<title>Six small panels in two rows. Each shows the same picture: two ink unit arrows at an angle θ, a cyan shadow and a magenta parallelogram; the two lines of text below give the domain&#x27;s reading. Geometry and topology: the line is the idempotent line P² = P, the area an oriented turning area. Quantum and gauge fields: the rank-one Born weight; rotor gates and the curvature F_μν. Relativity and holography: the proper-time rate dτ/dt; the speed v/c and minimal cuts. Arithmetic: the Hasse trace cos θ_p; the splitting p = a² + b². Complexity and fluids: the witness thread (NP is a line); the guiding field and the vorticity ∇∧u. The observer: Zeckendorf memory anchors; Landauer heat.</title>
