<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch18-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: two dots stacked vertically are the two components of the two-component chiral model, the blue upper one Z = +1 and the orange lower one Z = −1; each has a small loop back to itself, marked +p and −p, and the only link between them is a double arrow marked m. Panel II: in a patch of lattice, one small square is shaded magenta; its four edges carry direction arrows 0 → 1 → 2 → 3 → 0, and a magenta counter-clockwise circular arrow inside says: walk once around it. Panel III: the single square of the worked example; violet gauge pointers at the corners read 1, i, −1, −i, the edge-phase pointers at the edge midpoints read i, i, i, −1, and the magenta loop pointer at the centre points to i.">
<title>Three panels. Panel I: two dots stacked vertically are the two components of the two-component chiral model, the blue upper one Z = +1 and the orange lower one Z = −1; each has a small loop back to itself, marked +p and −p, and the only link between them is a double arrow marked m. Panel II: in a patch of lattice, one small square is shaded magenta; its four edges carry direction arrows 0 → 1 → 2 → 3 → 0, and a magenta counter-clockwise circular arrow inside says: walk once around it. Panel III: the single square of the worked example; violet gauge pointers at the corners read 1, i, −1, −i, the edge-phase pointers at the edge midpoints read i, i, i, −1, and the magenta loop pointer at the centre points to i.</title>
