<title>Two halves. Left: a magenta square face labelled e₁∧e₂ with a small looped arrow Î for its orientation; five cyan arrows in different directions all lie inside the face, and the caption below reads “arrows in the plane cannot point along its normal”. Right: the same face tilted in three-dimensional space, with the cyan arrows e₁ and e₂ along two of its sides; a violet arrow e₃ = ⋆₃(e₁∧e₂) stands perpendicular from the centre of the face, and the caption below reads “the normal appears only from ℝ³”.</title>
