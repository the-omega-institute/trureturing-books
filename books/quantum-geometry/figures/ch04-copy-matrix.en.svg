<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch04-copy-matrix" data-lang="en" data-wrap="1" viewBox="0 0 676 340" width="676" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two 4 × 4 grids, rows and columns ordered 00, 01, 10, 11, each divided by thin frames into four 2 × 2 blocks. The partial trace reads only the two diagonal cells of each block, and those eight cells have cyan edges. On the left, B(ρ) before the controlled copy: the ½ entries sit at (00,00) and (10,10), and the magenta squares marked ±½ at (00,10) and (10,00), inside cyan cells, so the partial trace reads them and returns |±⟩⟨±|. On the right, R(ρ) after the copy: the ±½ has moved to (00,11) and (11,00), on no block&#x27;s diagonal, and the partial trace returns ½ I for both signs; underneath, running U*_copy backwards restores it.">
<title>Two 4 × 4 grids, rows and columns ordered 00, 01, 10, 11, each divided by thin frames into four 2 × 2 blocks. The partial trace reads only the two diagonal cells of each block, and those eight cells have cyan edges. On the left, B(ρ) before the controlled copy: the ½ entries sit at (00,00) and (10,10), and the magenta squares marked ±½ at (00,10) and (10,00), inside cyan cells, so the partial trace reads them and returns |±⟩⟨±|. On the right, R(ρ) after the copy: the ±½ has moved to (00,11) and (11,00), on no block&#x27;s diagonal, and the partial trace returns ½ I for both signs; underneath, running U*_copy backwards restores it.</title>
