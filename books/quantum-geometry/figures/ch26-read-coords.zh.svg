<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch26-read-coords" data-lang="zh" data-wrap="1" viewBox="0 0 520 210" width="520" height="210" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="左边是一个 2 × 2 矩阵：左上 0.82，右上 0.24 − 0.30i，左下 0.24 + 0.30i，右下 0.18。对角两格是青色，两个角是墨色。右边四行读数：迹 = 0.82 + 0.18 = 1；z = 0.82 − 0.18 = 0.64，这两行是青色，取自对角两格；x = 2 × 0.24 = 0.48，y = −2 × (−0.30) = 0.60，这两行是墨色，取自右上一格。左下一格画成虚线框，它只是右上一格的共轭，不必读。矩阵下方写着 blochMatrix(1, r)，读数下方写着 r = (0.48, 0.60, 0.64)。">
<title>左边是一个 2 × 2 矩阵：左上 0.82，右上 0.24 − 0.30i，左下 0.24 + 0.30i，右下 0.18。对角两格是青色，两个角是墨色。右边四行读数：迹 = 0.82 + 0.18 = 1；z = 0.82 − 0.18 = 0.64，这两行是青色，取自对角两格；x = 2 × 0.24 = 0.48，y = −2 × (−0.30) = 0.60，这两行是墨色，取自右上一格。左下一格画成虚线框，它只是右上一格的共轭，不必读。矩阵下方写着 blochMatrix(1, r)，读数下方写着 r = (0.48, 0.60, 0.64)。</title>
