<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch09-antipodal-caps" data-lang="en" viewBox="0 0 460 340" width="460" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The vertical cross-section of the sphere through the axis ±â: a circle with the violet axis as a vertical line, +â at the top and −â at the bottom. The arcs within 45° of the axis, top and bottom, and their sectors are cyan: this pair of caps is one colour; the arcs at the left and right are grey gaps. Two points x and y in the upper cap are joined by a small angle marked “&lt; 90°”; a point z sits in the lower cap, and the angle between x and z is marked “&gt; 90°”. The half-angle 45° is marked on the right of the lower cap.">
<title>The vertical cross-section of the sphere through the axis ±â: a circle with the violet axis as a vertical line, +â at the top and −â at the bottom. The arcs within 45° of the axis, top and bottom, and their sectors are cyan: this pair of caps is one colour; the arcs at the left and right are grey gaps. Two points x and y in the upper cap are joined by a small angle marked “&lt; 90°”; a point z sits in the lower cap, and the angle between x and z is marked “&gt; 90°”. The half-angle 45° is marked on the right of the lower cap.</title>
