<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch11-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: looking down on the equatorial plane from the north pole, the thin dashed lines are the lab x and y axes; the grey x′ axis is the rotating frame, turning by ω₀t about the z axis at the centre (violet curved arrow), and the amber state arrow lies along x′ and turns with it, so in the rotating frame it does not move. Panel II: a Gaussian envelope on top whose magenta area is π/2; below it the amber state leaves the north pole and sweeps a magenta sector of the same π/2, reaching the equator. Panel III: the equatorial plane from above again: the violet dashed line is the X axis written in the circuit, the solid violet line is the axis of the pulse actually sent, at −90°; an amber curved arrow marks the phase shift −λ, and the label 0 ns says that no extra pulse is sent.">
<title>Three panels. Panel I: looking down on the equatorial plane from the north pole, the thin dashed lines are the lab x and y axes; the grey x′ axis is the rotating frame, turning by ω₀t about the z axis at the centre (violet curved arrow), and the amber state arrow lies along x′ and turns with it, so in the rotating frame it does not move. Panel II: a Gaussian envelope on top whose magenta area is π/2; below it the amber state leaves the north pole and sweeps a magenta sector of the same π/2, reaching the equator. Panel III: the equatorial plane from above again: the violet dashed line is the X axis written in the circuit, the solid violet line is the axis of the pulse actually sent, at −90°; an amber curved arrow marks the phase shift −λ, and the label 0 ns says that no extra pulse is sent.</title>
