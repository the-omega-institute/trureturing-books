<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-three-stops" data-lang="en" viewBox="0 0 420 290" width="420" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three rows, each starting from the same candidate set {0, 1, 2}; each step to the right applies the update once, until two neighbours agree, and the box where it stops is outlined in cyan. Row one, &#x27;drop the largest element above 0&#x27;: {0, 1, 2}, {0, 1}, {0}, stopping at {0}. Row two, U(A) = A: it stops at once at {0, 1, 2}. Row three, U(A) = ∅: the next step empties it, and it stops at the empty set. All three stop within 3 steps, at three different sets, one of them empty.">
<title>Three rows, each starting from the same candidate set {0, 1, 2}; each step to the right applies the update once, until two neighbours agree, and the box where it stops is outlined in cyan. Row one, &#x27;drop the largest element above 0&#x27;: {0, 1, 2}, {0, 1}, {0}, stopping at {0}. Row two, U(A) = A: it stops at once at {0, 1, 2}. Row three, U(A) = ∅: the next step empties it, and it stops at the empty set. All three stop within 3 steps, at three different sets, one of them empty.</title>
