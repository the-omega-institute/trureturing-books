<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch33-window-overlap" data-lang="en" viewBox="0 0 440 300" width="440" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two regular decagons of the same size, offset from each other: the window W + u_A on the left, W + u_B on the right, each with a dot at its centre. Their overlap is cyan and labelled W_AB: what both observers see. The parts that belong to one window only are magenta: seen by one observer alone. Below the centres a grey arrow u_B − u_A; at the bottom right, the overlap&#x27;s area is about half a window.">
<title>Two regular decagons of the same size, offset from each other: the window W + u_A on the left, W + u_B on the right, each with a dot at its centre. Their overlap is cyan and labelled W_AB: what both observers see. The parts that belong to one window only are magenta: seen by one observer alone. Below the centres a grey arrow u_B − u_A; at the bottom right, the overlap&#x27;s area is about half a window.</title>
