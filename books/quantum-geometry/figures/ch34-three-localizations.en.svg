<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch34-three-localizations" data-lang="en" data-wrap="1" viewBox="0 0 740 268" width="740" height="268" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: on a circle, u₀ on the right is turned once to u₁ at the top (filled dot) and again to u₂ on the left (hollow ring), the second turn&#x27;s arc in magenta; a magenta chord joins u₁ and u₂, the amber dashed line O is the anti-bisector perpendicular to that chord, and the chord meets O at one cyan point, where the shadows of u₁ and u₂ on O both fall. Panel II: a spacetime diagram, x across and t up, the grey dashed lines the light cone; the amber arrow u is the worldline of a moving observer and the magenta line its line of simultaneity, the two symmetric about the light cone, with two white events on the simultaneity line. Panel III: a square lattice with the amber slanted line E∥ in a narrow cyan strip; the cyan points in the strip drop along short magenta lines onto it, and the magenta dashed line E⊥ is perpendicular to it.">
<title>Three panels. Panel I: on a circle, u₀ on the right is turned once to u₁ at the top (filled dot) and again to u₂ on the left (hollow ring), the second turn&#x27;s arc in magenta; a magenta chord joins u₁ and u₂, the amber dashed line O is the anti-bisector perpendicular to that chord, and the chord meets O at one cyan point, where the shadows of u₁ and u₂ on O both fall. Panel II: a spacetime diagram, x across and t up, the grey dashed lines the light cone; the amber arrow u is the worldline of a moving observer and the magenta line its line of simultaneity, the two symmetric about the light cone, with two white events on the simultaneity line. Panel III: a square lattice with the amber slanted line E∥ in a narrow cyan strip; the cyan points in the strip drop along short magenta lines onto it, and the magenta dashed line E⊥ is perpendicular to it.</title>
