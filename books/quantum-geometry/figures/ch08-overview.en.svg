<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: an amber arrow lies sideways at |+⟩; its magenta sideways part is removed and the arrow shrinks to a cyan point at the centre, while an entropy column on the right rises from 0 to ln 2. Panel II: two pairs of grey columns, the system&#x27;s entropy S on the left of each pair and the heat paid βQ on the right; in pair A (after the pinch) S reaches ln 2 and the heat is 0, in pair B (after the reset) S is back to 0 and the heat has risen to ln 2, just touching the line marked “floor”; a note below says the heat step is a literature result and equality an ideal limit. Panel III: the system on the left is linked to five environment copies; four carry rewind arrows and are cyan, one copy k is magenta and not rewound; below, the rewind gives c_k ρ₀₁, not ρ₀₁.">
<title>Three panels. Panel I: an amber arrow lies sideways at |+⟩; its magenta sideways part is removed and the arrow shrinks to a cyan point at the centre, while an entropy column on the right rises from 0 to ln 2. Panel II: two pairs of grey columns, the system&#x27;s entropy S on the left of each pair and the heat paid βQ on the right; in pair A (after the pinch) S reaches ln 2 and the heat is 0, in pair B (after the reset) S is back to 0 and the heat has risen to ln 2, just touching the line marked “floor”; a note below says the heat step is a literature result and equality an ideal limit. Panel III: the system on the left is linked to five environment copies; four carry rewind arrows and are cyan, one copy k is magenta and not rewound; below, the rewind gives c_k ρ₀₁, not ρ₀₁.</title>
