<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch36-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 276" width="740" height="276" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: the memory axis points up; an ink arrow at θ = 40° casts a cyan shadow cos θ on it, while the magenta arrow lies along 90° and its shadow shrinks to a point at the origin, marked cos 90° = 0. Panel II: a disc with cyan points along one radius, one equal rapidity step apart; they and the faint circles through them crowd towards the rim but stay inside it. Panel III: the digits 1, 4, 2, 8, 5, 7 on a loop under 0.142857 142857 …, with an arrow from the loop down to 1/7.">
<title>Three panels. Panel I: the memory axis points up; an ink arrow at θ = 40° casts a cyan shadow cos θ on it, while the magenta arrow lies along 90° and its shadow shrinks to a point at the origin, marked cos 90° = 0. Panel II: a disc with cyan points along one radius, one equal rapidity step apart; they and the faint circles through them crowd towards the rim but stay inside it. Panel III: the digits 1, 4, 2, 8, 5, 7 on a loop under 0.142857 142857 …, with an arrow from the loop down to 1/7.</title>
