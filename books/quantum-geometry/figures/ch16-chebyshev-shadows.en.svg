<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch16-chebyshev-shadows" data-lang="en" viewBox="0 0 500 280" width="500" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The upper half of a unit circle centred on the horizontal axis. Four arrows leave the centre at 0°, 60°, 120° and 180° from the positive axis; neighbouring arrows are separated by the violet angle θ = 60°, and the last one, m = 3, is amber. A dashed perpendicular drops from each tip to the axis, and the cyan dot at its foot is the arrow&#x27;s shadow, labelled T₀ = 1, T₁ = ½, T₂ = −½, T₃ = −1. Two violet dashed lines complete arrows 0 and 2 into a rhombus whose diagonal ends at the tip of arrow 1; the top left reads T₀ + T₂ = 2x T₁, that is 1 − ½ = 2 · ½ · ½.">
<title>The upper half of a unit circle centred on the horizontal axis. Four arrows leave the centre at 0°, 60°, 120° and 180° from the positive axis; neighbouring arrows are separated by the violet angle θ = 60°, and the last one, m = 3, is amber. A dashed perpendicular drops from each tip to the axis, and the cyan dot at its foot is the arrow&#x27;s shadow, labelled T₀ = 1, T₁ = ½, T₂ = −½, T₃ = −1. Two violet dashed lines complete arrows 0 and 2 into a rhombus whose diagonal ends at the tip of arrow 1; the top left reads T₀ + T₂ = 2x T₁, that is 1 − ½ = 2 · ½ · ½.</title>
