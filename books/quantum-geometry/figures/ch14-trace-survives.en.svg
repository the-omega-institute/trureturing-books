<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch14-trace-survives" data-lang="en" viewBox="0 0 358 392" width="358" height="392" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="At the top, the 4 × 4 noise matrix σ, rows and columns labelled I, X₁, X₂, X₃. The four diagonal cells are cyan and read ½, ¼, ⅛, ⅛; the other twelve are magenta cross-room coherences, each struck out. An arrow points down: the four diagonal numbers add to Tr σ = 1, which multiplies the logical state ρ, so decoding returns exactly ρ.">
<title>At the top, the 4 × 4 noise matrix σ, rows and columns labelled I, X₁, X₂, X₃. The four diagonal cells are cyan and read ½, ¼, ⅛, ⅛; the other twelve are magenta cross-room coherences, each struck out. An arrow points down: the four diagonal numbers add to Tr σ = 1, which multiplies the logical state ρ, so decoding returns exactly ρ.</title>
