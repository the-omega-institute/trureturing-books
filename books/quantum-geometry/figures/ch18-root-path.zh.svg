<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch18-root-path" data-lang="zh" viewBox="0 0 540 318" width="540" height="318" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一张七个顶点的有向图。青色的六条边是选定的生成树 T，灰色虚线是树外的弦，其中有一条从顶点回到自身的自环，还有一条与树边平行的重边。左边的根 r 到右上角的顶点 a 只有一条树路径，画成粗青线，经过三条边 e₁、e₂、e₃：e₁ 与 e₃ 的方向顺着走，标着 × u(e₁)、× u(e₃)；e₂ 的方向逆着走，标着 × u(e₂)⁻¹。底部写着 rootPhase(a) = u(e₁) · u(e₂)⁻¹ · u(e₃)。">
<title>一张七个顶点的有向图。青色的六条边是选定的生成树 T，灰色虚线是树外的弦，其中有一条从顶点回到自身的自环，还有一条与树边平行的重边。左边的根 r 到右上角的顶点 a 只有一条树路径，画成粗青线，经过三条边 e₁、e₂、e₃：e₁ 与 e₃ 的方向顺着走，标着 × u(e₁)、× u(e₃)；e₂ 的方向逆着走，标着 × u(e₂)⁻¹。底部写着 rootPhase(a) = u(e₁) · u(e₂)⁻¹ · u(e₃)。</title>
