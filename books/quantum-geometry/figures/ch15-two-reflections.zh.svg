<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch15-two-reflections" data-lang="zh" viewBox="0 0 500 330" width="500" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Grover 平面：成功方向 W 朝上，失败方向 B 朝右，四分之一圆上一支墨色箭头 U 与 B 成 θ。第一面镜子是 B 轴（I − 2P）：U 的尖端沿竖直的虚线翻到 B 轴下方，成为灰色的虚线箭头。第二面镜子是 U 所在的线（2UU∗ − I）：那个尖端再沿垂直于这条线的虚线翻上去，成为琥珀色的箭头 QU，与 B 成 3θ。紫色的弧标出从 U 到 QU 净转过的 2θ。">
<title>Grover 平面：成功方向 W 朝上，失败方向 B 朝右，四分之一圆上一支墨色箭头 U 与 B 成 θ。第一面镜子是 B 轴（I − 2P）：U 的尖端沿竖直的虚线翻到 B 轴下方，成为灰色的虚线箭头。第二面镜子是 U 所在的线（2UU∗ − I）：那个尖端再沿垂直于这条线的虚线翻上去，成为琥珀色的箭头 QU，与 B 成 3θ。紫色的弧标出从 U 到 QU 净转过的 2θ。</title>
