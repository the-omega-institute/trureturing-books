<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch04-noise-gallery" data-lang="en" data-wrap="1" viewBox="0 0 676 230" width="676" height="230" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Four vertical cross-sections of the same size: the thin line is the original shell, cyan is its image after one application of the noise, violet is what stays fixed. Phase damping: a tall narrow ellipse; the vertical axis is fixed. Bit flip: a flat wide ellipse; the horizontal x axis is fixed. Depolarizing: a concentric circle of half the radius; only the centre is fixed. Amplitude damping: an ellipse shifted up so that its top touches the north pole; only the north pole is fixed.">
<title>Four vertical cross-sections of the same size: the thin line is the original shell, cyan is its image after one application of the noise, violet is what stays fixed. Phase damping: a tall narrow ellipse; the vertical axis is fixed. Bit flip: a flat wide ellipse; the horizontal x axis is fixed. Depolarizing: a concentric circle of half the radius; only the centre is fixed. Amplitude damping: an ellipse shifted up so that its top touches the north pole; only the north pole is fixed.</title>
