<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch23-quaternion-norm" data-lang="en" viewBox="0 0 500 300" width="500" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The example takes a = b = −1 (Hamilton quaternions). The horizontal axis is the scalar part x₀, half the trace; the vertical axis is the length |v| of the vector part. Four cyan half circles are the reduced norms Nrd = 1, 2, 3, 4. Every integer quaternion sits where a half circle meets a vertical line x₀ = integer; the number beside a point counts the quaternions there, 8, 24, 32 and 24 on the four half circles. No point lies between the circles, and the trace 2x₀ takes only the even numbers from −4 to 4.">
<title>The example takes a = b = −1 (Hamilton quaternions). The horizontal axis is the scalar part x₀, half the trace; the vertical axis is the length |v| of the vector part. Four cyan half circles are the reduced norms Nrd = 1, 2, 3, 4. Every integer quaternion sits where a half circle meets a vertical line x₀ = integer; the number beside a point counts the quaternions there, 8, 24, 32 and 24 on the four half circles. No point lies between the circles, and the trace 2x₀ takes only the even numbers from −4 to 4.</title>
