<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch04-ball-criterion" data-lang="zh" viewBox="0 0 450 350" width="450" height="350" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="坐标平面，横轴是轴向因子 a（0 到 1），纵轴是横向因子 λ（−1 到 1）。绿色的区域是 λ² ≤ a，由上下两支抛物线 λ = ±√a 围成，边界上标着“纯振幅阻尼 λ = √a”。左端 a = 0 处区域收成一点，右端 a = 1 处张开成 −1 到 1 的整段。区域外有一个品红的点 (0.15, 0.75)，旁注“刺穿球皮”。">
<title>坐标平面，横轴是轴向因子 a（0 到 1），纵轴是横向因子 λ（−1 到 1）。绿色的区域是 λ² ≤ a，由上下两支抛物线 λ = ±√a 围成，边界上标着“纯振幅阻尼 λ = √a”。左端 a = 0 处区域收成一点，右端 a = 1 处张开成 −1 到 1 的整段。区域外有一个品红的点 (0.15, 0.75)，旁注“刺穿球皮”。</title>
