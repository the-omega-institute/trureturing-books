<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch19-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 290" width="740" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: an ordinary binary tree (not the layered network of the later experiment cards) with 8 legs along the bottom, merging in pairs into one tensor per step up to a single tensor at the top; legs 3 to 6 are the amber interval, and cutting it off takes only the two bonds marked magenta, not four legs. Panel II: the width-three bridge graph, three bridges between tensors M and N, legs a = 2, b = 3, c = 2, d = 3; the two magenta dashed lines above and below are the min cut ad = bc = 6, with a green LEAN ✓ tag beneath: flow = cut = 6. Panel III: a log-capacity plot; the blue sloping line ln ad and the orange horizontal line ln bc join into one bent line at the dashed vertical seam, with three lattice points d = 2, 3, 4 on it; a violet tag at the bottom right: RT · literature.">
<title>Three panels. Panel I: an ordinary binary tree (not the layered network of the later experiment cards) with 8 legs along the bottom, merging in pairs into one tensor per step up to a single tensor at the top; legs 3 to 6 are the amber interval, and cutting it off takes only the two bonds marked magenta, not four legs. Panel II: the width-three bridge graph, three bridges between tensors M and N, legs a = 2, b = 3, c = 2, d = 3; the two magenta dashed lines above and below are the min cut ad = bc = 6, with a green LEAN ✓ tag beneath: flow = cut = 6. Panel III: a log-capacity plot; the blue sloping line ln ad and the orange horizontal line ln bc join into one bent line at the dashed vertical seam, with three lattice points d = 2, 3, 4 on it; a violet tag at the bottom right: RT · literature.</title>
