<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch26-det-sign" data-lang="en" viewBox="0 0 500 330" width="500" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The x–z cross-section of the Bloch ball: a green disc and a green circle. An amber point on the circle is marked det = 0 (pure); a dark point inside, |r| = 0.5, is marked det = 0.19 &gt; 0; a magenta point outside, |r| = 1.3, is marked det = −0.17 &lt; 0, not positive semidefinite. On the right: with trace 1, det = (1 − |r|²)/4.">
<title>The x–z cross-section of the Bloch ball: a green disc and a green circle. An amber point on the circle is marked det = 0 (pure); a dark point inside, |r| = 0.5, is marked det = 0.19 &gt; 0; a magenta point outside, |r| = 1.3, is marked det = −0.17 &lt; 0, not positive semidefinite. On the right: with trace 1, det = (1 − |r|²)/4.</title>
