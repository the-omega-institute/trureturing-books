<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-shutter" data-lang="en" viewBox="0 0 540 270" width="540" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A schematic. On the left a wheel whose rim is ticked all the way round: the direction can stop at any angle, and the amber arrow is the direction now. In the middle a vertical shutter splits along e₃ into an upper and a lower channel. On the right there are only two exits: the upper channel is recorded as +1 and the lower as −1, each a cyan dot.">
<title>A schematic. On the left a wheel whose rim is ticked all the way round: the direction can stop at any angle, and the amber arrow is the direction now. In the middle a vertical shutter splits along e₃ into an upper and a lower channel. On the right there are only two exits: the upper channel is recorded as +1 and the lower as −1, each a cyan dot.</title>
