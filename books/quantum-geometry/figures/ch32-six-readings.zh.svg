<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch32-six-readings" data-lang="zh" data-wrap="1" viewBox="0 0 740 352" width="740" height="352" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="六个小图，排成两行。每个小图里是同一幅画：两支墨色单位箭头夹角 θ，青色的影子与品红的平行四边形；图下两行字是这个疆域的读法。几何与拓扑：线是幂等方向线 P² = P，面是有向旋转面积。量子与规范场：线是秩一玻恩权重，面是旋子门与曲率 F_μν。相对论与全息：线是固有时率 dτ/dt，面是速度 v/c 与极小割截面。算术与数论：线是哈塞迹 cos θ_p，面是 p = a² + b² 的分裂。复杂性与流体：线是见证丝（NP 是线），面是引导场与涡量 ∇∧u。观察者：线是齐肯多夫记忆锚点，面是兰道尔热熵。">
<title>六个小图，排成两行。每个小图里是同一幅画：两支墨色单位箭头夹角 θ，青色的影子与品红的平行四边形；图下两行字是这个疆域的读法。几何与拓扑：线是幂等方向线 P² = P，面是有向旋转面积。量子与规范场：线是秩一玻恩权重，面是旋子门与曲率 F_μν。相对论与全息：线是固有时率 dτ/dt，面是速度 v/c 与极小割截面。算术与数论：线是哈塞迹 cos θ_p，面是 p = a² + b² 的分裂。复杂性与流体：线是见证丝（NP 是线），面是引导场与涡量 ∇∧u。观察者：线是齐肯多夫记忆锚点，面是兰道尔热熵。</title>
