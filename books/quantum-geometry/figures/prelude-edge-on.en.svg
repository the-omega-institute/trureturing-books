<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-edge-on" data-lang="en" viewBox="0 0 420 330" width="420" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Top: the turntable seen from above, a magenta disc turning counter-clockwise, with the amber direction b drawn at two moments, θ = 90° (top of the circle) and θ = 270° (bottom), each with a small tangent velocity arrow, one pointing left and one right. Dashed lines drop both onto the cyan segment at the bottom, where they land on the same point 0; there two small arrows point left (labelled cos 90° = 0) and right (cos 270° = 0).">
<title>Top: the turntable seen from above, a magenta disc turning counter-clockwise, with the amber direction b drawn at two moments, θ = 90° (top of the circle) and θ = 270° (bottom), each with a small tangent velocity arrow, one pointing left and one right. Dashed lines drop both onto the cyan segment at the bottom, where they land on the same point 0; there two small arrows point left (labelled cos 90° = 0) and right (cos 270° = 0).</title>
