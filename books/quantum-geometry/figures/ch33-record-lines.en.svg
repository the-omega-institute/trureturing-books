<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch33-record-lines" data-lang="en" viewBox="0 0 420 300" width="420" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two perpendicular cyan lines in a plane, P₀ (horizontal) and P₁ (vertical), meet at the origin with a right-angle mark; a faint unit circle surrounds them. A dashed ink arrow v makes 30° with P₀; perpendiculars from its tip leave two cyan shadows on P₀ and P₁, neither of them zero. At the bottom right, N ≤ d = 2 with a green LEAN ✓ tag.">
