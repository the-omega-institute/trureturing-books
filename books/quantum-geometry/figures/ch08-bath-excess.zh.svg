<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-bath-excess" data-lang="zh" viewBox="0 0 450 300" width="450" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="五根柱子，横轴是热浴比特的基态布居数 p = 0.6、0.75、0.9、0.99、0.999。每根柱子的总高度是热量 βQ，下面灰色的一截是系统熵减，上面虚线框的一截是热浴相对熵 D。一条虚线标出 ln 2：灰色的一截越来越接近它却不超过它，虚线框的一截却越长越高，到 p = 0.999 时 βQ 为 3.45。">
<title>五根柱子，横轴是热浴比特的基态布居数 p = 0.6、0.75、0.9、0.99、0.999。每根柱子的总高度是热量 βQ，下面灰色的一截是系统熵减，上面虚线框的一截是热浴相对熵 D。一条虚线标出 ln 2：灰色的一截越来越接近它却不超过它，虚线框的一截却越长越高，到 p = 0.999 时 βQ 为 3.45。</title>
