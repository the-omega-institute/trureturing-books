<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-cos-cobweb" data-lang="zh" viewBox="0 0 440 330" width="440" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一张坐标图，横轴 θ、纵轴 y，都从 0 到 1。青色的曲线是 y = cos θ，灰色的对角线是 y = θ，两者交于一点 θ* ≈ 0.739。琥珀色的折线从 θ₀ = 1 出发，竖着走到曲线上读出 cos θ₀，再横着走到对角线上把它当作下一个角 θ₁ ≈ 0.540，如此在两线之间来回，绕成越来越小的方框，向交点收拢。右下方标着文献结果。">
<title>一张坐标图，横轴 θ、纵轴 y，都从 0 到 1。青色的曲线是 y = cos θ，灰色的对角线是 y = θ，两者交于一点 θ* ≈ 0.739。琥珀色的折线从 θ₀ = 1 出发，竖着走到曲线上读出 cos θ₀，再横着走到对角线上把它当作下一个角 θ₁ ≈ 0.540，如此在两线之间来回，绕成越来越小的方框，向交点收拢。右下方标着文献结果。</title>
