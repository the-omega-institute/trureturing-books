<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch28-fixed-skeleton" data-lang="zh" viewBox="0 0 440 352" width="440" height="352" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="证明骨架图，左右两列。左列“⇒”：从前提 U(ρ) = ρ 出发，P_kρP_l = P_k U(ρ) P_l（← hFixed），= P_kρP_k · P_l（left_project_unread），= 0（hP.orthogonal）。右列“⇐”：从前提 P_kρP_l = 0（k ≠ l）出发，P_kρ = Σ_l P_kρP_l（hP.complete），= P_kρP_k（sum_eq_single），再对 k 求和得 U(ρ) = ρ（hP.complete）。两列汇入底部绿色的 LEAN ✓ unreadState_fixed_iff。">
<title>证明骨架图，左右两列。左列“⇒”：从前提 U(ρ) = ρ 出发，P_kρP_l = P_k U(ρ) P_l（← hFixed），= P_kρP_k · P_l（left_project_unread），= 0（hP.orthogonal）。右列“⇐”：从前提 P_kρP_l = 0（k ≠ l）出发，P_kρ = Σ_l P_kρP_l（hP.complete），= P_kρP_k（sum_eq_single），再对 k 求和得 U(ρ) = ρ（hP.complete）。两列汇入底部绿色的 LEAN ✓ unreadState_fixed_iff。</title>
