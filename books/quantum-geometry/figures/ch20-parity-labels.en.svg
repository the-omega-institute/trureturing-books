<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-parity-labels" data-lang="en" data-wrap="1" viewBox="0 0 716 300" width="716" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels. Left: a two-qubit circuit; two horizontal lines are wires 0 and 1, and from left to right come a CNOT (control on wire 0, target on wire 1), an R_z on wire 1, and another CNOT. Above each stretch of wire is its parity label at that moment: wire 0 stays cyan z₀; wire 1 starts as cyan z₁, becomes magenta z₀ ⊕ z₁ after the first CNOT, where R_z puts in its phase, and returns to cyan z₁ after the second. The first CNOT is marked “even birth”, the second “odd return”, and beneath: 1 + 1 = 2 CNOTs. Right: the 7 nonzero even parity labels that must appear on a wire for four qubits, in magenta, from z₀ ⊕ z₁ to z₀ ⊕ z₁ ⊕ z₂ ⊕ z₃ in two columns; below, at least 7 even outputs plus at least 3 returns make 10, with a green LEAN ✓ tag.">
<title>Two panels. Left: a two-qubit circuit; two horizontal lines are wires 0 and 1, and from left to right come a CNOT (control on wire 0, target on wire 1), an R_z on wire 1, and another CNOT. Above each stretch of wire is its parity label at that moment: wire 0 stays cyan z₀; wire 1 starts as cyan z₁, becomes magenta z₀ ⊕ z₁ after the first CNOT, where R_z puts in its phase, and returns to cyan z₁ after the second. The first CNOT is marked “even birth”, the second “odd return”, and beneath: 1 + 1 = 2 CNOTs. Right: the 7 nonzero even parity labels that must appear on a wire for four qubits, in magenta, from z₀ ⊕ z₁ to z₀ ⊕ z₁ ⊕ z₂ ⊕ z₃ in two columns; below, at least 7 even outputs plus at least 3 returns make 10, with a green LEAN ✓ tag.</title>
