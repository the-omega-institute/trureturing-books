<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch26-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 290" width="740" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: a green Bloch ball; an amber arrow reaches the shell, marked “pure |r| = 1”, and a dark point inside is marked “trace-one PSD |r| ≤ 1”. Panel II: the violet vertical axis z; the grey arrow v at 60° from it keeps its cyan shadow on the axis while its sideways part sweeps a magenta 90° sector in a horizontal disc, split by a dashed line into two 45° halves; the amber arrow is the turned R v R̃. Panel III: the violet z and y axes, the white starting point e₁ on the equator, and an amber path in three legs — a short way along the equator about z, a lift about y, and a short way about z again — ending at the tip of the amber arrow R e₁ R̃.">
<title>Three panels. Panel I: a green Bloch ball; an amber arrow reaches the shell, marked “pure |r| = 1”, and a dark point inside is marked “trace-one PSD |r| ≤ 1”. Panel II: the violet vertical axis z; the grey arrow v at 60° from it keeps its cyan shadow on the axis while its sideways part sweeps a magenta 90° sector in a horizontal disc, split by a dashed line into two 45° halves; the amber arrow is the turned R v R̃. Panel III: the violet z and y axes, the white starting point e₁ on the equator, and an amber path in three legs — a short way along the equator about z, a lift about y, and a short way about z again — ending at the tip of the amber arrow R e₁ R̃.</title>
