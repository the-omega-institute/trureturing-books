<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch36-pinching-ledger" data-lang="zh" viewBox="0 0 460 312" width="460" height="312" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="横轴是 θ，从 0° 到 90°，纵轴是质量，从 0 到 1。三层色带叠起来总是顶到 1：最下面的灰色一层是对角骨架里恒为 ½ 的部分；中间青色一层是轴向偏置 ½cos²θ，在 0° 处厚 ½，往右变薄，到 90° 处厚度为 0；最上面品红一层是非对角相干 ½sin²θ，从 0 增到 ½。90° 处有一条竖虚线。顶上写着 1 = |P(ρ)|² + |ρ − P(ρ)|²，旁边有绿色的 LEAN ✓ 标记。">
<title>横轴是 θ，从 0° 到 90°，纵轴是质量，从 0 到 1。三层色带叠起来总是顶到 1：最下面的灰色一层是对角骨架里恒为 ½ 的部分；中间青色一层是轴向偏置 ½cos²θ，在 0° 处厚 ½，往右变薄，到 90° 处厚度为 0；最上面品红一层是非对角相干 ½sin²θ，从 0 增到 ½。90° 处有一条竖虚线。顶上写着 1 = |P(ρ)|² + |ρ − P(ρ)|²，旁边有绿色的 LEAN ✓ 标记。</title>
