<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-head-on" data-lang="zh" viewBox="0 0 480 200" width="480" height="200" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="四个并排的圆，是从四个角度看同一根单位长的青色射线。第一个圆标着 α = 0°，正中只有一个青色的亮点，看到的长度 0；后三个圆标着 α = 20°、45°、90°，亮点舒展成一段越来越长的青色线段，长度依次约 0.34、0.71、1。">
<title>四个并排的圆，是从四个角度看同一根单位长的青色射线。第一个圆标着 α = 0°，正中只有一个青色的亮点，看到的长度 0；后三个圆标着 α = 20°、45°、90°，亮点舒展成一段越来越长的青色线段，长度依次约 0.34、0.71、1。</title>
<style>.ts-ink{stroke:#0b1622}.tf-ink{fill:#0b1622}.ts-dim{stroke:#45607a}.tf-dim{fill:#45607a}.ts-faint{stroke:#9db3c4}.tf-faint{fill:#9db3c4}.ts-edge{stroke:#b9d0dd}.tf-edge{fill:#b9d0dd}.ts-hot{stroke:#5f9bb5}.tf-hot{fill:#5f9bb5}.ts-bg{stroke:#ffffff}.tf-bg{fill:#ffffff}.ts-panel{stroke:#eef5f9}.tf-panel{fill:#eef5f9}.ts-sheet{stroke:#f7fbfd}.tf-sheet{fill:#f7fbfd}.ts-cyan{stroke:#007c8a}.tf-cyan{fill:#007c8a}.ts-magenta{stroke:#b0128f}.tf-magenta{fill:#b0128f}.ts-amber{stroke:#946200}.tf-amber{fill:#946200}.ts-violet{stroke:#5a45c8}.tf-violet{fill:#5a45c8}.ts-ok{stroke:#087a4c}.tf-ok{fill:#087a4c}.ts-warn{stroke:#c21f3a}.tf-warn{fill:#c21f3a}.ts-blue{stroke:#1d5fd0}.tf-blue{fill:#1d5fd0}.ts-orange{stroke:#b85410}.tf-orange{fill:#b85410}.ts-sigma{stroke:#28405a}.tf-sigma{fill:#28405a}@media (prefers-color-scheme:dark){.ts-ink{stroke:#d4efff}.tf-ink{fill:#d4efff}.ts-dim{stroke:#6f8ea5}.tf-dim{fill:#6f8ea5}.ts-faint{stroke:#34506a}.tf-faint{fill:#34506a}.ts-edge{stroke:#143049}.tf-edge{fill:#143049}.ts-hot{stroke:#1f5d7c}.tf-hot{fill:#1f5d7c}.ts-bg{stroke:#03060c}.tf-bg{fill:#03060c}.ts-panel{stroke:#07101b}.tf-panel{fill:#07101b}.ts-sheet{stroke:#050c16}.tf-sheet{fill:#050c16}.ts-cyan{stroke:#19f0ff}.tf-cyan{fill:#19f0ff}.ts-magenta{stroke:#ff2fd0}.tf-magenta{fill:#ff2fd0}.ts-amber{stroke:#ffc83d}.tf-amber{fill:#ffc83d}.ts-violet{stroke:#9d8cff}.tf-violet{fill:#9d8cff}.ts-ok{stroke:#46ffb2}.tf-ok{fill:#46ffb2}.ts-warn{stroke:#ff5064}.tf-warn{fill:#ff5064}.ts-blue{stroke:#2a7bff}.tf-blue{fill:#2a7bff}.ts-orange{stroke:#ff8a3c}.tf-orange{fill:#ff8a3c}.ts-sigma{stroke:#cfe3ff}.tf-sigma{fill:#cfe3ff}}</style>
<circle cx="66" cy="92" r="52" class="ts-dim tf-panel" stroke-width="1.4"/>
<circle cx="66" cy="92" r="5.5" class="ts-bg tf-cyan" stroke-width="1.4"/>
<text class="tf-ink" x="66" y="24" font-size="14" text-anchor="middle"><tspan font-style="italic">α</tspan> = 0°</text>
<text class="tf-cyan" x="66" y="172" font-size="14" text-anchor="middle" font-weight="600">0</text>
<circle cx="182" cy="92" r="52" class="ts-dim tf-panel" stroke-width="1.4"/>
<line x1="167.84" y1="99.08" x2="196.16" y2="84.92" class="ts-cyan" stroke-width="3.4" stroke-linecap="round" fill="none"/>
<circle cx="167.84" cy="99.08" r="5" class="ts-bg tf-cyan" stroke-width="1.4"/>
<text class="tf-ink" x="182" y="24" font-size="14" text-anchor="middle"><tspan font-style="italic">α</tspan> = 20°</text>
<text class="tf-cyan" x="182" y="172" font-size="14" text-anchor="middle" font-weight="600">0.34</text>
<circle cx="298" cy="92" r="52" class="ts-dim tf-panel" stroke-width="1.4"/>
<line x1="268.73" y1="106.64" x2="327.27" y2="77.36" class="ts-cyan" stroke-width="3.4" stroke-linecap="round" fill="none"/>
<circle cx="268.73" cy="106.64" r="5" class="ts-bg tf-cyan" stroke-width="1.4"/>
<text class="tf-ink" x="298" y="24" font-size="14" text-anchor="middle"><tspan font-style="italic">α</tspan> = 45°</text>
<text class="tf-cyan" x="298" y="172" font-size="14" text-anchor="middle" font-weight="600">0.71</text>
<circle cx="414" cy="92" r="52" class="ts-dim tf-panel" stroke-width="1.4"/>
<line x1="372.6" y1="112.7" x2="455.4" y2="71.3" class="ts-cyan" stroke-width="3.4" stroke-linecap="round" fill="none"/>
<circle cx="372.6" cy="112.7" r="5" class="ts-bg tf-cyan" stroke-width="1.4"/>
<text class="tf-ink" x="414" y="24" font-size="14" text-anchor="middle"><tspan font-style="italic">α</tspan> = 90°</text>
<text class="tf-cyan" x="414" y="172" font-size="14" text-anchor="middle" font-weight="600">1</text>
<text class="tf-dim" x="4" y="194" font-size="14">看到的长度 sin <tspan font-style="italic">α</tspan></text>
</svg>
