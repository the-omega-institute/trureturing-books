<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch13-unit-circle-bound" data-lang="en" data-wrap="1" viewBox="0 0 520 268" width="520" height="268" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Left panel: the unit circle. The amber point z = e^{iα} has α = 60°; two cyan chords join it to +1 and −1 and meet at a right angle at z, with lengths |1 − z| = 2 sin(α/2) = 1 and |1 + z| = 2 cos(α/2) ≈ 1.732; the hollow point at the top is z = i, where the two chords are equal. Right panel: the horizontal axis is α from 0° to 180°, and the cyan curve is the sum of the two chords, 2√(1 + sin α): 2 at both ends, 2.732 at the amber point at 60°, touching the green dashed line 2√2 only at α = 90°.">
<title>Left panel: the unit circle. The amber point z = e^{iα} has α = 60°; two cyan chords join it to +1 and −1 and meet at a right angle at z, with lengths |1 − z| = 2 sin(α/2) = 1 and |1 + z| = 2 cos(α/2) ≈ 1.732; the hollow point at the top is z = i, where the two chords are equal. Right panel: the horizontal axis is α from 0° to 180°, and the cyan curve is the sum of the two chords, 2√(1 + sin α): 2 at both ends, 2.732 at the amber point at 60°, touching the green dashed line 2√2 only at α = 90°.</title>
