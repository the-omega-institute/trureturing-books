<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch05-quarter-turns" data-lang="zh" viewBox="0 0 460 320" width="460" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="平面上一个单位圆。琥珀色的箭头 v 指向右上方；右乘一次 I，它逆时针转 90° 成为灰色的箭头 vI；再乘一次，又转 90°，成为指向左下方的箭头 −v。两段紫色的弧箭头各标“× I”。原点旁的品红小方块是单位二向量 I = e₁∧e₂。">
