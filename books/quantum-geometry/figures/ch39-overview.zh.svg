<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 280" width="740" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：上方一个灰色的指针寄存器 ptr 与它和内存之间的虚线隔墙被一个叉划掉；下方两行共八格，每格写着 p，每格都有一支青色的小箭头离开它又回到它自己，下方写着 p ≡ *p。第二栏：一条琥珀色的斜线是刀，它周围一条淡青色的带子里有一串青色的格点，带子外面什么也没有；下方是这些点投到刀上排成的一列长短段，短段记 1、长段记 0，字里没有相邻的 11。第三栏：墨色的单位箭头 Ψ 与水平的观察者之线成 θ 角；青色的影子 cos θ 躺在线上，品红的垂线 sin θ 站在它外面，下方写着 cos²θ + sin²θ = 1。">
<title>三栏。第一栏：上方一个灰色的指针寄存器 ptr 与它和内存之间的虚线隔墙被一个叉划掉；下方两行共八格，每格写着 p，每格都有一支青色的小箭头离开它又回到它自己，下方写着 p ≡ *p。第二栏：一条琥珀色的斜线是刀，它周围一条淡青色的带子里有一串青色的格点，带子外面什么也没有；下方是这些点投到刀上排成的一列长短段，短段记 1、长段记 0，字里没有相邻的 11。第三栏：墨色的单位箭头 Ψ 与水平的观察者之线成 θ 角；青色的影子 cos θ 躺在线上，品红的垂线 sin θ 站在它外面，下方写着 cos²θ + sin²θ = 1。</title>
