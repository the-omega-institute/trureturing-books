<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch19-three-cuts" data-lang="zh" viewBox="0 0 500 330" width="500" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="宽度三桥图：左边的张量 M 与右边的张量 N 之间并排连着三条桥；M 向上伸出腿 a = 2、向下伸出腿 b = 3，N 向上伸出腿 d = 3、向下伸出腿 c = 2。三道虚线是三道候选割：上面一道横切两条上腿，容量 ad = 6；下面一道横切两条下腿，容量 bc = 6；一道斜线切过腿 a、三条桥与腿 c，容量 3ac = 12。两道外割画成品红，是最小割，容量 6；斜着的内割是灰色。">
<title>宽度三桥图：左边的张量 M 与右边的张量 N 之间并排连着三条桥；M 向上伸出腿 a = 2、向下伸出腿 b = 3，N 向上伸出腿 d = 3、向下伸出腿 c = 2。三道虚线是三道候选割：上面一道横切两条上腿，容量 ad = 6；下面一道横切两条下腿，容量 bc = 6；一道斜线切过腿 a、三条桥与腿 c，容量 3ac = 12。两道外割画成品红，是最小割，容量 6；斜着的内割是灰色。</title>
