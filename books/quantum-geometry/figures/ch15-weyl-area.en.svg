<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch15-weyl-area" data-lang="en" data-wrap="1" viewBox="0 0 520 290" width="520" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Left panel: the 8 × 8 lattice, horizontal axis the number of shifts a, vertical axis the number of clock steps b. Two cyan arrows leave the origin, (a, b) = (2, 1) and (c, d) = (1, 3), and span a magenta parallelogram of oriented area ad − bc = 5. Right panel: a phase clock with 8 positions; the amber hand rests on ω₈³, since bc − ad = −5 ≡ 3 (mod 8).">
<title>Left panel: the 8 × 8 lattice, horizontal axis the number of shifts a, vertical axis the number of clock steps b. Two cyan arrows leave the origin, (a, b) = (2, 1) and (c, d) = (1, 3), and span a magenta parallelogram of oriented area ad − bc = 5. Right panel: a phase clock with 8 positions; the amber hand rests on ω₈³, since bc − ad = −5 ≡ 3 (mod 8).</title>
