<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch07-zeno-n" data-lang="zh" viewBox="0 0 440 290" width="440" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="横轴是测量次数 N，按对数刻度从 1 到 64；纵轴是全程留在 |0⟩ 的概率。青色的曲线是 P_N = [cos²(π/2N)]^N，四个青色的点是 N = 1、4、16、64，依次为 0、0.531、0.857、0.962。灰色虚线是近似式 1 − π²/4N，N 越大越贴近青色曲线；两条线都向顶上的 1 爬去。">
<title>横轴是测量次数 N，按对数刻度从 1 到 64；纵轴是全程留在 |0⟩ 的概率。青色的曲线是 P_N = [cos²(π/2N)]^N，四个青色的点是 N = 1、4、16、64，依次为 0、0.531、0.857、0.962。灰色虚线是近似式 1 − π²/4N，N 越大越贴近青色曲线；两条线都向顶上的 1 爬去。</title>
