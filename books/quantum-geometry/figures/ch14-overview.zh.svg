<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch14-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：横轴是重叠 z 从 0 到 1，青色的对角线 y = z 是保内积要求的输出，暗色的抛物线 y = z² 是克隆给出的输出，两者只在 0 与 1 相交，中间夹着一片品红的缺口，z = 1/√2 处标出一段竖直的缺口。第二栏：四间方形的房间排成两行两列，标着综合征 (+,+)、(−,+)、(−,−)、(+,−) 与各自的两个基态；青色的码态住在 (+,+) 那间，一条品红的箭头 X₂ 把它搬进 (−,−) 那间，一条琥珀色的箭头把它翻回。第三栏：一块斜放的平面上有一颗粒子，平面里一圈暗色虚线绕着它；一支紫色的箭头 e₃ 竖直朝上，一条品红的弧从平面上抬起、越过粒子。">
<title>三栏。第一栏：横轴是重叠 z 从 0 到 1，青色的对角线 y = z 是保内积要求的输出，暗色的抛物线 y = z² 是克隆给出的输出，两者只在 0 与 1 相交，中间夹着一片品红的缺口，z = 1/√2 处标出一段竖直的缺口。第二栏：四间方形的房间排成两行两列，标着综合征 (+,+)、(−,+)、(−,−)、(+,−) 与各自的两个基态；青色的码态住在 (+,+) 那间，一条品红的箭头 X₂ 把它搬进 (−,−) 那间，一条琥珀色的箭头把它翻回。第三栏：一块斜放的平面上有一颗粒子，平面里一圈暗色虚线绕着它；一支紫色的箭头 e₃ 竖直朝上，一条品红的弧从平面上抬起、越过粒子。</title>
