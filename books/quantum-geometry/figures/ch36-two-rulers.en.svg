<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch36-two-rulers" data-lang="en" viewBox="0 0 460 236" width="460" height="236" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two rulers. The upper one is the angle θ from 0° to 90°, cut off at 90° by a magenta wall. The lower one is the rapidity η, running from 0 to the right with an arrow marked +∞. Six cyan points sit evenly on the lower ruler, labelled k = 0 to 5; dashed lines take them to their angles on the upper ruler: the first at θ* ≈ 42°, the rest crowding ever closer to the 90° wall, all to its left.">
<title>Two rulers. The upper one is the angle θ from 0° to 90°, cut off at 90° by a magenta wall. The lower one is the rapidity η, running from 0 to the right with an arrow marked +∞. Six cyan points sit evenly on the lower ruler, labelled k = 0 to 5; dashed lines take them to their angles on the upper ruler: the first at θ* ≈ 42°, the rest crowding ever closer to the 90° wall, all to its left.</title>
