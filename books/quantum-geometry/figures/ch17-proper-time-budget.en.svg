<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch17-proper-time-budget" data-lang="en" viewBox="0 0 480 320" width="480" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A graph: the horizontal axis is the spatial length |Δx| of a segment, from 0 to 5; the vertical axis is its proper time Δτ. The white dashed line is the level Δt = 5. The cyan curve Δτ = √(25 − Δx²) starts at (0, 5) top left, stays below the dashed line, passes (3, 4) and comes down to (5, 0). The three points read: at rest Δτ = Δt = 5; the first leg (5, 3) of the worked example, Δτ = 4; on the light cone Δτ = 0.">
<title>A graph: the horizontal axis is the spatial length |Δx| of a segment, from 0 to 5; the vertical axis is its proper time Δτ. The white dashed line is the level Δt = 5. The cyan curve Δτ = √(25 − Δx²) starts at (0, 5) top left, stays below the dashed line, passes (3, 4) and comes down to (5, 0). The three points read: at rest Δτ = Δt = 5; the first leg (5, 3) of the worked example, Δτ = 4; on the light cone Δτ = 0.</title>
