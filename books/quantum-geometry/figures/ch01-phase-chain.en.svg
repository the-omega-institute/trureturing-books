<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-phase-chain" data-lang="en" viewBox="0 0 480 316" width="480" height="316" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two rows of six round phase dials, numbered 0 to 5. Top row: a cyan edge labelled e_i + e_{i+1} joins each pair of neighbours, the five edges link all six dials into one chain, and every pointer points the same way; A = cI is written at the right. Bottom row: the edge between dials 2 and 3 is missing, drawn dashed and crossed out; the three dials on the left point one way and the three on the right another, with the note “the two islands differ by a phase the tests cannot see” below.">
