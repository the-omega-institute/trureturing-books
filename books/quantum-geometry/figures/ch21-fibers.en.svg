<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch21-fibers" data-lang="en" viewBox="0 0 480 262" width="480" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Along a horizontal line at the bottom are four cyan points b₁, b₂, b₃, b₄: the coordinate space B. Above each stands a rounded box, its fiber, holding 3, 2, 4 and 1 address points; together they make the address space X. A downward arrow q_L points from X to B. The third fiber is shaded light cyan; two of its points are labelled x and y, and above it is written q_L(x) = q_L(y): they land on the same reading b₃.">
<title>Along a horizontal line at the bottom are four cyan points b₁, b₂, b₃, b₄: the coordinate space B. Above each stands a rounded box, its fiber, holding 3, 2, 4 and 1 address points; together they make the address space X. A downward arrow q_L points from X to B. The third fiber is shaded light cyan; two of its points are labelled x and y, and above it is written q_L(x) = q_L(y): they land on the same reading b₃.</title>
