<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch33-contracting-well" data-lang="zh" viewBox="0 0 460 216" width="460" height="216" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三条剖面并排。左：平坦的桌面，小球在一串左右扰动后漂离起点。中：倒扣的碗，小球从顶点附近出发，每一步离顶点更远，滑向碗边。右：碗形的势阱，小球被踢到右坡上，每一步离碗底的距离缩到不足一半，落向碗底那段青色的接受窗 W + u_i。每条剖面上，琥珀色的是小球现在的位置，灰色空心圈是之前的位置。">
<title>三条剖面并排。左：平坦的桌面，小球在一串左右扰动后漂离起点。中：倒扣的碗，小球从顶点附近出发，每一步离顶点更远，滑向碗边。右：碗形的势阱，小球被踢到右坡上，每一步离碗底的距离缩到不足一半，落向碗底那段青色的接受窗 W + u_i。每条剖面上，琥珀色的是小球现在的位置，灰色空心圈是之前的位置。</title>
