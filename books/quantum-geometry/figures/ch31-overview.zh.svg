<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch31-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 280" width="740" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：两支墨色单位箭头 φ 与 ψ 互相投影，两段青色影子一样长，都是 cos θ；上方的第 3 点 C 被划掉。第二栏：横轴是内积 ⟨φ, ψ⟩，墨色对角线 y = x 与青色抛物线 y = x² 只在 0（φ ⊥ ψ）与 1（φ = ψ）相交。第三栏：一个圆上按黄金角依次排开 21 个点，青色的窗口占圆周的 0.382，其中 8 个点落在窗口里（青色），其余为灰色。">
<title>三栏。第一栏：两支墨色单位箭头 φ 与 ψ 互相投影，两段青色影子一样长，都是 cos θ；上方的第 3 点 C 被划掉。第二栏：横轴是内积 ⟨φ, ψ⟩，墨色对角线 y = x 与青色抛物线 y = x² 只在 0（φ ⊥ ψ）与 1（φ = ψ）相交。第三栏：一个圆上按黄金角依次排开 21 个点，青色的窗口占圆周的 0.382，其中 8 个点落在窗口里（青色），其余为灰色。</title>
