<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-no-knife" data-lang="en" data-wrap="1" viewBox="0 0 500 286" width="500" height="286" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels; the same amber blade crosses the plane with slope 1/φ. Left, ‘lattice first’: a full grey grid of lattice points is drawn first, and the blade with its pale cyan strip is laid over it; the points inside the strip light up cyan. Right, ‘no blade, no crystal’: no grid, only the strip and its cyan points; below, the points projected onto the blade form a row of long and short steps in the ratio φ, short marked 1 and long 0, reading 0 1 0 0 1 0 1 0 0 1 0, with no adjacent 11.">
<title>Two panels; the same amber blade crosses the plane with slope 1/φ. Left, ‘lattice first’: a full grey grid of lattice points is drawn first, and the blade with its pale cyan strip is laid over it; the points inside the strip light up cyan. Right, ‘no blade, no crystal’: no grid, only the strip and its cyan points; below, the points projected onto the blade form a row of long and short steps in the ratio φ, short marked 1 and long 0, reading 0 1 0 0 1 0 1 0 0 1 0, with no adjacent 11.</title>
