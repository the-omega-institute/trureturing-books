<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch06-robertson-budget" data-lang="zh" viewBox="0 0 464 330" width="464" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="六根横条，对应正文例题表的六行，每行左边写着布洛赫向量 r。每根条的总长是 (σ_A σ_B)²，竖线标出 1。条从左到右切成三段：品红的一段是对易子那一项 r_z²，青色的一段是协方差平方 r_x² r_y²，灰色的一段是混合度 1 − |r|²。前三行是纯态，没有灰色；第三行 (1, 1, 1)/√3 多出一段青色；后三行是混合态，灰色越往下越长；最后一行是球心，没有品红，整根条都是灰色。">
<title>六根横条，对应正文例题表的六行，每行左边写着布洛赫向量 r。每根条的总长是 (σ_A σ_B)²，竖线标出 1。条从左到右切成三段：品红的一段是对易子那一项 r_z²，青色的一段是协方差平方 r_x² r_y²，灰色的一段是混合度 1 − |r|²。前三行是纯态，没有灰色；第三行 (1, 1, 1)/√3 多出一段青色；后三行是混合态，灰色越往下越长；最后一行是球心，没有品红，整根条都是灰色。</title>
