<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch19-facet-seam" data-lang="zh" viewBox="0 0 500 330" width="500" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="坐标图：横轴是 ln d，标出 d = 2、3、4；纵轴是对数容量，标出 4、6、8、12。三条直线是三道割的对数容量：顶上灰色的水平线 ln 3ac = ln 12，蓝色的斜线 ln ad，橙色的水平线 ln bc = ln 6。最小割走它们的下包络：先沿蓝色斜线上升，在 d = 3 处的竖直虚线（接缝 ad = bc）折向橙色水平线。包络上三个格点 d = 2、3、4 分别标着候选割 (12, 4, 6)、(12, 6, 6)、(12, 8, 6)，最小割依次是 4、6、6。">
<title>坐标图：横轴是 ln d，标出 d = 2、3、4；纵轴是对数容量，标出 4、6、8、12。三条直线是三道割的对数容量：顶上灰色的水平线 ln 3ac = ln 12，蓝色的斜线 ln ad，橙色的水平线 ln bc = ln 6。最小割走它们的下包络：先沿蓝色斜线上升，在 d = 3 处的竖直虚线（接缝 ad = bc）折向橙色水平线。包络上三个格点 d = 2、3、4 分别标着候选割 (12, 4, 6)、(12, 6, 6)、(12, 8, 6)，最小割依次是 4、6、6。</title>
