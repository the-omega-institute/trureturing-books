<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch29-mod-four-dial" data-lang="zh" viewBox="0 0 560 280" width="560" height="280" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一个分成四格的圆形表盘，顶上是第 0 格，顺时针依次是第 1、2、3 格。第 0、1、2 格涂成青色，分别标着 0 + 0、0 + 1、1 + 1，表示两个平方模 4 的余数相加落在这里；左边的第 3 格是品红虚线围出的空格，标着“空”。表盘左侧用品红列出线素数 3、7、11、19、23，指向第 3 格；右侧用青色列出面素数 5、13、17、29、37，指向第 1 格。">
