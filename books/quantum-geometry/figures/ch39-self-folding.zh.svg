<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-self-folding" data-lang="zh" viewBox="0 0 440 304" width="440" height="304" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一个直角三角形：墨色的单位箭头 Ψ 从原点斜向右上，与水平的观察者之线成 θ = 40°；它在线上的青色影子 cos θ 是一条直角边，从箭头尖落下的品红垂线 sin θ 是另一条直角边。青色影子下方立着一个青色正方形，标 cos²θ ≈ 0.59（能观之极）；品红垂线右侧立着一个品红正方形，标 sin²θ ≈ 0.41（所观之宇）；箭头 Ψ 左上方是一个灰色虚线正方形，标 1。">
<title>一个直角三角形：墨色的单位箭头 Ψ 从原点斜向右上，与水平的观察者之线成 θ = 40°；它在线上的青色影子 cos θ 是一条直角边，从箭头尖落下的品红垂线 sin θ 是另一条直角边。青色影子下方立着一个青色正方形，标 cos²θ ≈ 0.59（能观之极）；品红垂线右侧立着一个品红正方形，标 sin²θ ≈ 0.41（所观之宇）；箭头 Ψ 左上方是一个灰色虚线正方形，标 1。</title>
