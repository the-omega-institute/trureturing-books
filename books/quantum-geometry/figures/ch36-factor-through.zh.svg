<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch36-factor-through" data-lang="zh" viewBox="0 0 460 300" width="460" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三行点。最上一行是 0.142857 142857 的十二个数位，每个点上写着它的数字。灰线把第 n 位连到中间一行的余数 n mod 6，每个余数正好接住两个数位，而且这两位的数字相同；余数 3 那一条纤维（第 3 位与第 9 位，都是 2）用琥珀色标出。中间一行再用箭头一一指到最下一行的数字。顶上写着 target = factor ∘ readout。">
<title>三行点。最上一行是 0.142857 142857 的十二个数位，每个点上写着它的数字。灰线把第 n 位连到中间一行的余数 n mod 6，每个余数正好接住两个数位，而且这两位的数字相同；余数 3 那一条纤维（第 3 位与第 9 位，都是 2）用琥珀色标出。中间一行再用箭头一一指到最下一行的数字。顶上写着 target = factor ∘ readout。</title>
