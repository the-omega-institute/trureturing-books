<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch25-mask-cube" data-lang="en" viewBox="0 0 480 340" width="480" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A cube: e₁ points right, e₂ slants into the page, e₃ points up. The eight corners carry the eight blades and their three-bit masks: the front lower-left corner is 1 (000₂), the three edges from it lead to e₁ (001₂), e₂ (010₂) and e₃ (100₂), and the far corner is I₃ (111₂). Two amber arrows start at e₁₂ (011₂), walk one edge along e₂ to e₁ (001₂), then one edge up along e₃ to e₁₃ (101₂): multiplying by e₂₃ (110₂) takes one step along e₂ and one along e₃, and the end mask is 011₂ ⊕ 110₂ = 101₂.">
<title>A cube: e₁ points right, e₂ slants into the page, e₃ points up. The eight corners carry the eight blades and their three-bit masks: the front lower-left corner is 1 (000₂), the three edges from it lead to e₁ (001₂), e₂ (010₂) and e₃ (100₂), and the far corner is I₃ (111₂). Two amber arrows start at e₁₂ (011₂), walk one edge along e₂ to e₁ (001₂), then one edge up along e₃ to e₁₃ (101₂): multiplying by e₂₃ (110₂) takes one step along e₂ and one along e₃, and the end mask is 011₂ ⊕ 110₂ = 101₂.</title>
