<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch30-face-odd-orientation" data-lang="zh" viewBox="0 0 358 350" width="358" height="350" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="4 × 4 的格点图，每条边一支箭头。九个方格里各写着一个奇数：沿这个面的边界走一圈，与箭头相反的 dart 个数；外面那个面的个数写在下方，也是奇数。琥珀色描出一条十条边的偶圈，圈内六个方格淡青，圈内的两个顶点是青色的 I，圈外最下面一行四个顶点是品红的 J；沿琥珀色的圈走一圈，与箭头相反的 dart 也是奇数个。">
<title>4 × 4 的格点图，每条边一支箭头。九个方格里各写着一个奇数：沿这个面的边界走一圈，与箭头相反的 dart 个数；外面那个面的个数写在下方，也是奇数。琥珀色描出一条十条边的偶圈，圈内六个方格淡青，圈内的两个顶点是青色的 I，圈外最下面一行四个顶点是品红的 J；沿琥珀色的圈走一圈，与箭头相反的 dart 也是奇数个。</title>
