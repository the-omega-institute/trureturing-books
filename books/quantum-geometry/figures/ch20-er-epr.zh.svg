<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-er-epr" data-lang="zh" viewBox="0 0 500 320" width="500" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="上下两行示意图。上一行：左边两列各 6 个点，是左右两套边界系统 L 与 R，每个 L 点与对面的 R 点之间连着一条青色虚线，表示纠缠对；中间一个红色的“≟”与红色标签“ER = EPR 开放”；右边是一座爱因斯坦—罗森桥的侧视图，两端张开、中间收窄。下一行：只有一对点，连着一条青色虚线，箭头指向一座小桥，小桥上打了叉，旁边写着：一对贝尔态，没有光滑的桥。">
<title>上下两行示意图。上一行：左边两列各 6 个点，是左右两套边界系统 L 与 R，每个 L 点与对面的 R 点之间连着一条青色虚线，表示纠缠对；中间一个红色的“≟”与红色标签“ER = EPR 开放”；右边是一座爱因斯坦—罗森桥的侧视图，两端张开、中间收窄。下一行：只有一对点，连着一条青色虚线，箭头指向一座小桥，小桥上打了叉，旁边写着：一对贝尔态，没有光滑的桥。</title>
