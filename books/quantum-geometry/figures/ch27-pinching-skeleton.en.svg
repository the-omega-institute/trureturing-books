<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-pinching-skeleton" data-lang="en" viewBox="0 0 460 352" width="460" height="352" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A proof skeleton: one straight chain, top to bottom. Step one: P_k · U(ρ) = P_kρP_k, by left_project_unread and sum_eq_single; the two dashed hypotheses on top, &#x27;orthogonal P_kP_l = 0 (k ≠ l)&#x27; and &#x27;idempotent P_k² = P_k&#x27;, point into it. Step two: Σ_k P_k U(ρ) P_k = U(ρ), by unreadState_idempotent; the idempotence hypothesis points into it as well, down the right-hand side. Step three: U ∘ U = U, by funext ρ. The chain ends in the green LEAN ✓ finite_record_pinching_idempotent at the bottom. A note left of step three reads U(ρ) = Σ_k P_kρP_k.">
<title>A proof skeleton: one straight chain, top to bottom. Step one: P_k · U(ρ) = P_kρP_k, by left_project_unread and sum_eq_single; the two dashed hypotheses on top, &#x27;orthogonal P_kP_l = 0 (k ≠ l)&#x27; and &#x27;idempotent P_k² = P_k&#x27;, point into it. Step two: Σ_k P_k U(ρ) P_k = U(ρ), by unreadState_idempotent; the idempotence hypothesis points into it as well, down the right-hand side. Step three: U ∘ U = U, by funext ρ. The chain ends in the green LEAN ✓ finite_record_pinching_idempotent at the bottom. A note left of step three reads U(ρ) = Σ_k P_kρP_k.</title>
