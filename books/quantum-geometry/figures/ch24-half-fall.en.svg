<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-half-fall" data-lang="en" viewBox="0 0 500 320" width="500" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the fraction t/t_ff of the total fall time, from 0 to 1; the vertical axis is the distance from the centre as a fraction r/r₀ of the starting distance. The curve starts almost flat at the top left (0, 1), steepens to the right and ends vertically at (1, 0). Three points mark a quarter, half and three quarters of the time, at heights 0.961, 0.837 and 0.597; the half-time point is cyan, joined to both axes by dashed lines and labelled (1 + sin θ*)/2. A bracket on the right shows that only 0.163 has been fallen, less than a sixth.">
<title>The horizontal axis is the fraction t/t_ff of the total fall time, from 0 to 1; the vertical axis is the distance from the centre as a fraction r/r₀ of the starting distance. The curve starts almost flat at the top left (0, 1), steepens to the right and ends vertically at (1, 0). Three points mark a quarter, half and three quarters of the time, at heights 0.961, 0.837 and 0.597; the half-time point is cyan, joined to both axes by dashed lines and labelled (1 + sin θ*)/2. A bracket on the right shows that only 0.163 has been fallen, less than a sixth.</title>
