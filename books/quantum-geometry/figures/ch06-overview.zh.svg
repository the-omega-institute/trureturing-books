<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch06-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：横放的箭头 A 与琥珀色的箭头 B 夹角 60°，B 落在 A 上的青色影子是 cos θ，两者张出的品红平行四边形是 sin θ。第二栏：四分之一圆 D² + V² = 1，横轴是青色的可见度 V，纵轴是品红的可区分度 D；琥珀色的点在 α = 60° 处，(D, V) = (0.87, 0.5)，圆的两端分别标“只有路径”与“只有条纹”。第三栏：一个 2×2 密度矩阵，对角两格是青色的 ½，副对角两格是品红的 ¼；下面一个直角三角形，青色的直角边是对角部分 Π(ρ)，品红的直角边是副对角部分 ρ − Π(ρ)，斜边是 ρ。">
<title>三栏。第一栏：横放的箭头 A 与琥珀色的箭头 B 夹角 60°，B 落在 A 上的青色影子是 cos θ，两者张出的品红平行四边形是 sin θ。第二栏：四分之一圆 D² + V² = 1，横轴是青色的可见度 V，纵轴是品红的可区分度 D；琥珀色的点在 α = 60° 处，(D, V) = (0.87, 0.5)，圆的两端分别标“只有路径”与“只有条纹”。第三栏：一个 2×2 密度矩阵，对角两格是青色的 ½，副对角两格是品红的 ¼；下面一个直角三角形，青色的直角边是对角部分 Π(ρ)，品红的直角边是副对角部分 ρ − Π(ρ)，斜边是 ρ。</title>
