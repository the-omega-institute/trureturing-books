<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch04-env-shadow" data-lang="en" data-wrap="1" viewBox="0 0 560 300" width="560" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two halves. Left: the environment states |e₀⟩ (horizontal) and |e₁⟩ (tilted up) at angle θ_env; the cyan shadow of e₁ on e₀ has length cos θ_env. Right: the vertical cross-section of the Bloch ball; the amber local arrow points from the centre along x towards |+⟩ on the shell at the right (dashed) but stops at cos θ_env. The cyan segment under the arrow is exactly as long as the shadow on the left.">
<title>Two halves. Left: the environment states |e₀⟩ (horizontal) and |e₁⟩ (tilted up) at angle θ_env; the cyan shadow of e₁ on e₀ has length cos θ_env. Right: the vertical cross-section of the Bloch ball; the amber local arrow points from the centre along x towards |+⟩ on the shell at the right (dashed) but stops at cos θ_env. The cyan segment under the arrow is exactly as long as the shadow on the left.</title>
