<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-four-stages" data-lang="en" data-wrap="1" viewBox="0 0 740 236" width="740" height="236" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Four small tiles from left to right, like steps. Stage 1: a grey frame is the outside stage; two ink arrows leave one point, and above them an ink point C is joined to both tips by dashed lines. Stage 2: the same two arrows, each casting a cyan shadow of the same length on the other; the C above is crossed out. Stage 3: an amber pointer ptr reaches across a grey dashed wall marked μ &gt; 0 to one cell of a memory row below. Stage 4: only one cell ψ is left, with a cyan arrow leaving it and coming back to it; below, μ = 0.">
<title>Four small tiles from left to right, like steps. Stage 1: a grey frame is the outside stage; two ink arrows leave one point, and above them an ink point C is joined to both tips by dashed lines. Stage 2: the same two arrows, each casting a cyan shadow of the same length on the other; the C above is crossed out. Stage 3: an amber pointer ptr reaches across a grey dashed wall marked μ &gt; 0 to one cell of a memory row below. Stage 4: only one cell ψ is left, with a cyan arrow leaving it and coming back to it; below, μ = 0.</title>
