<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch10-gauge-winding" data-lang="zh" viewBox="0 0 460 380" width="460" height="380" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="从上往下看南半球，南极在中心，被一个紫色的虚线圈标出，旁注“南极：相位定不下来”。两圈纬线上各摆着一圈小表盘，外圈八个、内圈八个；每个表盘里青色的指针是北极规范下 ⟨1|ψ_N⟩ 的相位，沿着纬线走一圈，指针也跟着转满一圈，内圈虽然离南极更近，同样转满一圈。外侧一支灰色的弧箭头标出 φ 增加的方向。">
<title>从上往下看南半球，南极在中心，被一个紫色的虚线圈标出，旁注“南极：相位定不下来”。两圈纬线上各摆着一圈小表盘，外圈八个、内圈八个；每个表盘里青色的指针是北极规范下 ⟨1|ψ_N⟩ 的相位，沿着纬线走一圈，指针也跟着转满一圈，内圈虽然离南极更近，同样转满一圈。外侧一支灰色的弧箭头标出 φ 增加的方向。</title>
