<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch05-phase-locked" data-lang="zh" viewBox="0 0 460 330" width="460" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="复平面，虚线是单位圆。青色的直线穿过原点和单位相位 u。琥珀色的箭头 z 躺在这条青色的线上，写作 z = u·r，r 是实数；它在这条线里的镜像就是它自己，与 u 张开的面积为零。另一支灰色的箭头 z′ 不在线上：它的镜像是另一支虚线箭头，它与 u 张开一块品红的平行四边形，标“u∧z′ ≠ 0”。">
<title>复平面，虚线是单位圆。青色的直线穿过原点和单位相位 u。琥珀色的箭头 z 躺在这条青色的线上，写作 z = u·r，r 是实数；它在这条线里的镜像就是它自己，与 u 张开的面积为零。另一支灰色的箭头 z′ 不在线上：它的镜像是另一支虚线箭头，它与 u 张开一块品红的平行四边形，标“u∧z′ ≠ 0”。</title>
