<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch08-mub-gap" data-lang="en" viewBox="0 0 500 290" width="500" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the height r of a Z-diagonal state ρ on the vertical axis, from −1 to 1; the vertical axis is entropy in nats. A dashed line at the top marks ln 2, the entropy S(σ) after pinching in the X basis. The arch below is S(ρ), touching ln 2 at r = 0 and falling to 0 at both ends. The magenta region between the arch and the dashed line is D(ρ‖σ) = ln 2 − S(ρ). An amber point at r = 1 is the pure state |0⟩, where the magenta piece is the whole ln 2.">
<title>The horizontal axis is the height r of a Z-diagonal state ρ on the vertical axis, from −1 to 1; the vertical axis is entropy in nats. A dashed line at the top marks ln 2, the entropy S(σ) after pinching in the X basis. The arch below is S(ρ), touching ln 2 at r = 0 and falling to 0 at both ends. The magenta region between the arch and the dashed line is D(ρ‖σ) = ln 2 − S(ρ). An amber point at r = 1 is the pure state |0⟩, where the magenta piece is the whole ln 2.</title>
