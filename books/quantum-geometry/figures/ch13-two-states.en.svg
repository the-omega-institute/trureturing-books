<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch13-two-states" data-lang="en" viewBox="0 0 430 262" width="430" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two 4 × 4 boards side by side, rows Alice&#x27;s I, X, Y, Z and columns Bob&#x27;s. Left: the classical correlated state; right: the Bell state Φ⁺. Both boards have 1 in the top-left corner and all six cyan local cells in the first row and column empty. In the magenta correlation block the classical state fills only (Z, Z) with +1; the Bell state fills three cells: (X, X) = +1, (Y, Y) = −1 and (Z, Z) = +1.">
<title>Two 4 × 4 boards side by side, rows Alice&#x27;s I, X, Y, Z and columns Bob&#x27;s. Left: the classical correlated state; right: the Bell state Φ⁺. Both boards have 1 in the top-left corner and all six cyan local cells in the first row and column empty. In the magenta correlation block the classical state fills only (Z, Z) with +1; the Bell state fills three cells: (X, X) = +1, (Y, Y) = −1 and (Z, Z) = +1.</title>
