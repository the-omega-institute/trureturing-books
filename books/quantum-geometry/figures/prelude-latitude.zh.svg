<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="prelude-latitude" data-lang="zh" viewBox="0 0 420 300" width="420" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一个球，竖着一根虚线的 z 轴。北半球上一个琥珀色的点在极角 θ = 50° 处，带箭头的青色纬圈从它出发绕轴一圈，标着“θ = 50°：纬圈”。球心有一张品红的圆盘，边缘是赤道大圆，标着“θ = 90°：赤道大圆”。纬圈比赤道小，不过球心。">
<title>一个球，竖着一根虚线的 z 轴。北半球上一个琥珀色的点在极角 θ = 50° 处，带箭头的青色纬圈从它出发绕轴一圈，标着“θ = 50°：纬圈”。球心有一张品红的圆盘，边缘是赤道大圆，标着“θ = 90°：赤道大圆”。纬圈比赤道小，不过球心。</title>
