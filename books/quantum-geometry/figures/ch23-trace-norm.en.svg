<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch23-trace-norm" data-lang="en" viewBox="0 0 420 344" width="420" height="344" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Eisenstein integers form a hexagonal lattice in the complex plane (grey dots). Two cyan circles are the norms N = 1 and N = 3, each through six lattice points. From each point a dashed line drops to one of two trace rulers below: the six points of N = 1 land only on traces −2, −1, 1, 2, the six of N = 3 only on −3, 0, 3. Once the norm is fixed, the trace can take only a few integers.">
<title>Eisenstein integers form a hexagonal lattice in the complex plane (grey dots). Two cyan circles are the norms N = 1 and N = 3, each through six lattice points. From each point a dashed line drops to one of two trace rulers below: the six points of N = 1 land only on traces −2, −1, 1, 2, the six of N = 3 only on −3, 0, 3. Once the norm is fixed, the trace can take only a few integers.</title>
