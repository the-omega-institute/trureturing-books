<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-two-writings" data-lang="zh" viewBox="0 0 600 300" width="600" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="左边两个小复平面：琥珀色的箭头是 α = cos 30°（指向正右）与 β = sin 30° · e^{i70°}（转过 70°），合起来是四个实数。两个箭头都再转过同一个角 γ 的虚线副本，表示乘上全局相位。右边是一颗布洛赫球，球面上只有一支琥珀色的箭头，离北极 θ = 60°、方位角 φ = 70°：两个角度。左边的实线与虚线两种写法都指向这同一支箭头。">
<title>左边两个小复平面：琥珀色的箭头是 α = cos 30°（指向正右）与 β = sin 30° · e^{i70°}（转过 70°），合起来是四个实数。两个箭头都再转过同一个角 γ 的虚线副本，表示乘上全局相位。右边是一颗布洛赫球，球面上只有一支琥珀色的箭头，离北极 θ = 60°、方位角 φ = 70°：两个角度。左边的实线与虚线两种写法都指向这同一支箭头。</title>
