<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch14-syndrome-table" data-lang="zh" viewBox="0 0 540 300" width="540" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一张四行的表，行依次是错误 I、X₁、X₂、X₃。每行有两串三个比特：左边是 E|000⟩，右边是 E|111⟩，被翻的那一位描成品红；每串旁边各有两盏灯 g₁、g₂。I 那一行两串都是青色，四盏灯全暗；X₁ 那行两串旁都只亮 g₁；X₂ 那行两盏都亮；X₃ 那行只亮 g₂。同一行左右两串亮的灯完全一样。">
<title>一张四行的表，行依次是错误 I、X₁、X₂、X₃。每行有两串三个比特：左边是 E|000⟩，右边是 E|111⟩，被翻的那一位描成品红；每串旁边各有两盏灯 g₁、g₂。I 那一行两串都是青色，四盏灯全暗；X₁ 那行两串旁都只亮 g₁；X₂ 那行两盏都亮；X₃ 那行只亮 g₂。同一行左右两串亮的灯完全一样。</title>
