<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch22-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：横轴每走一步乘 2，竖轴每走一步乘 3，格点上标着 1、2、4、8、3、6、12、24、9、18、36、72；两支青色箭头先横走两步、再竖走一步，到达 12 = 2² × 3。第二栏：1 到 30 排成方格，能只用 2、3、5 乘出来的格子是青色，其余是品红，第一个品红格是 7。第三栏：竖着的临界带夹在 σ = 0 与 σ = 1 之间，中间是虚线 σ = ½，s = 1 处打着叉（极点）；十个零点从下往上都落在虚线上；虚线两侧同一高度各有一个红色虚线圈和问号，用红色细虚线连着，表示离线零点若有，必成对出现；下方的红色标签写着“开放问题”。">
<title>三栏。第一栏：横轴每走一步乘 2，竖轴每走一步乘 3，格点上标着 1、2、4、8、3、6、12、24、9、18、36、72；两支青色箭头先横走两步、再竖走一步，到达 12 = 2² × 3。第二栏：1 到 30 排成方格，能只用 2、3、5 乘出来的格子是青色，其余是品红，第一个品红格是 7。第三栏：竖着的临界带夹在 σ = 0 与 σ = 1 之间，中间是虚线 σ = ½，s = 1 处打着叉（极点）；十个零点从下往上都落在虚线上；虚线两侧同一高度各有一个红色虚线圈和问号，用红色细虚线连着，表示离线零点若有，必成对出现；下方的红色标签写着“开放问题”。</title>
