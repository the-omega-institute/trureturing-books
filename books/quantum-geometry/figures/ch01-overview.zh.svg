<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：两支箭头 x、y 之间青色的夹角 θ；它们身后一套灰色虚线的外部坐标架 C 被一个叉划掉。第二栏：青色的箭头 A 当尺子，它所在的直线两端标着 +1 与 −1；琥珀色的箭头 B 与 A 张开夹角 θ，读数只落在这两端。第三栏：左边两个小复平面上的琥珀色箭头 α、β，标着“四个实数”；一支箭头指向右边的布洛赫球，球上只有一支琥珀色的箭头，标着两个角 θ、φ。">
<title>三栏。第一栏：两支箭头 x、y 之间青色的夹角 θ；它们身后一套灰色虚线的外部坐标架 C 被一个叉划掉。第二栏：青色的箭头 A 当尺子，它所在的直线两端标着 +1 与 −1；琥珀色的箭头 B 与 A 张开夹角 θ，读数只落在这两端。第三栏：左边两个小复平面上的琥珀色箭头 α、β，标着“四个实数”；一支箭头指向右边的布洛赫球，球上只有一支琥珀色的箭头，标着两个角 θ、φ。</title>
