<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch13-spectrum" data-lang="zh" viewBox="0 0 440 340" width="440" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="横轴是面积参数 N，从 0 到 4；纵轴是 CHSH 算子的特征值，从 −3 到 3。四条品红的曲线是 ±√(4 + N) 与 ±√(4 − N)：N = 0 时四条汇成 ±2，N 增大时外侧两条向 ±2√2 张开、内侧两条向 0 收拢。暗色虚线标出 ±2。N = 1、2、3 处各有四个品红的点，对应表中三行的谱，N = 3 处标着 √7 与 1；两端 N = 0 与 N = 4 是空心点，N = 4 处标着 2√2。">
<title>横轴是面积参数 N，从 0 到 4；纵轴是 CHSH 算子的特征值，从 −3 到 3。四条品红的曲线是 ±√(4 + N) 与 ±√(4 − N)：N = 0 时四条汇成 ±2，N 增大时外侧两条向 ±2√2 张开、内侧两条向 0 收拢。暗色虚线标出 ±2。N = 1、2、3 处各有四个品红的点，对应表中三行的谱，N = 3 处标着 √7 与 1；两端 N = 0 与 N = 4 是空心点，N = 4 处标着 2√2。</title>
