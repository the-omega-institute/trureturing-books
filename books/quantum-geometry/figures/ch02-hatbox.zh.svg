<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-hatbox" data-lang="zh" viewBox="0 0 440 336" width="440" height="336" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="左边一颗球，已知态 a 在北极，四条青色的纬线把球切成五条等高的球带，外面套着一只灰色虚线的圆柱帽盒。每条球带的面积都等于帽盒上同高的一圈，都是 2π × 0.4。右边一根竖直的刻度尺是玻恩权重 p，从底下的 0 到顶上的 1，虚线把每条纬线水平地连到尺上：五段一样长，各占 ⅕。">
<title>左边一颗球，已知态 a 在北极，四条青色的纬线把球切成五条等高的球带，外面套着一只灰色虚线的圆柱帽盒。每条球带的面积都等于帽盒上同高的一圈，都是 2π × 0.4。右边一根竖直的刻度尺是玻恩权重 p，从底下的 0 到顶上的 1，虚线把每条纬线水平地连到尺上：五段一样长，各占 ⅕。</title>
