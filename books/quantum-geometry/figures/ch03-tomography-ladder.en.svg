<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch03-tomography-ladder" data-lang="en" data-wrap="1" viewBox="0 0 600 250" width="600" height="250" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three Bloch spheres of the same size side by side. The first measures Z only: the vertical axis is cyan, seen; the equatorial plane is magenta, blind. The second measures Z and X: the plane through the vertical axis and the x axis is cyan, and the y axis perpendicular to it is the magenta blind spot. The third measures X, Y and Z: the whole ball is cyan, with no blind spot.">
<title>Three Bloch spheres of the same size side by side. The first measures Z only: the vertical axis is cyan, seen; the equatorial plane is magenta, blind. The second measures Z and X: the plane through the vertical axis and the x axis is cyan, and the y axis perpendicular to it is the magenta blind spot. The third measures X, Y and Z: the whole ball is cyan, with no blind spot.</title>
