<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch35-gram-corridor" data-lang="en" viewBox="0 0 460 200" width="460" height="200" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three groups side by side. In each, an ink unit arrow a is the old anchor, an amber unit arrow b is the next candidate state, and the magenta parallelogram is the area they span. Left: c = 1, b lies on a, the area is zero and det G₂ = 0. Middle: c = 1/2, an angle of 60°, det G₂ = 3/4. Right: c = 0, b is perpendicular to a, the area is the whole unit square and det G₂ = 1.">
<title>Three groups side by side. In each, an ink unit arrow a is the old anchor, an amber unit arrow b is the next candidate state, and the magenta parallelogram is the area they span. Left: c = 1, b lies on a, the area is zero and det G₂ = 0. Middle: c = 1/2, an angle of 60°, det G₂ = 3/4. Right: c = 0, b is perpendicular to a, the area is the whole unit square and det G₂ = 1.</title>
