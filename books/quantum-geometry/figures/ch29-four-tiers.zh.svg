<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch29-four-tiers" data-lang="zh" viewBox="0 0 460 300" width="460" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="四级台阶从左向右升高，分别标着第 1 层 ℤ、ℚ，第 2 层 √2、φ，第 3 层 π、e，第 4 层 θ* ≈ 0.739。每级台阶上方有一幅小图：第 1 层是数轴 0 到 2 上的青色有理点 m/n；第 2 层是青色单位正方形和它品红的对角线 √2；第 3 层是青色的正八边形和它外接的品红圆 π；第 4 层是青色的余弦曲线 y = cos θ 与虚线 y = θ 交于品红的点 θ*。品红标的都是逃出下面一层的常数。">
<title>四级台阶从左向右升高，分别标着第 1 层 ℤ、ℚ，第 2 层 √2、φ，第 3 层 π、e，第 4 层 θ* ≈ 0.739。每级台阶上方有一幅小图：第 1 层是数轴 0 到 2 上的青色有理点 m/n；第 2 层是青色单位正方形和它品红的对角线 √2；第 3 层是青色的正八边形和它外接的品红圆 π；第 4 层是青色的余弦曲线 y = cos θ 与虚线 y = θ 交于品红的点 θ*。品红标的都是逃出下面一层的常数。</title>
