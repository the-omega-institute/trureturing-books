<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch28-fixed-skeleton" data-lang="en" viewBox="0 0 560 352" width="560" height="352" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A proof skeleton in two columns. Left, &#x27;⇒&#x27;: from the hypothesis U(ρ) = ρ, P_kρP_l = P_k U(ρ) P_l (← hFixed), = P_kρP_k · P_l (left_project_unread), = 0 (hP.orthogonal). Right, &#x27;⇐&#x27;: from the hypothesis P_kρP_l = 0 (k ≠ l), P_kρ = Σ_l P_kρP_l (hP.complete), = P_kρP_k (sum_eq_single), and summing over k gives U(ρ) = ρ (hP.complete). The two columns meet in the green LEAN ✓ unreadState_fixed_iff at the bottom.">
<title>A proof skeleton in two columns. Left, &#x27;⇒&#x27;: from the hypothesis U(ρ) = ρ, P_kρP_l = P_k U(ρ) P_l (← hFixed), = P_kρP_k · P_l (left_project_unread), = 0 (hP.orthogonal). Right, &#x27;⇐&#x27;: from the hypothesis P_kρP_l = 0 (k ≠ l), P_kρ = Σ_l P_kρP_l (hP.complete), = P_kρP_k (sum_eq_single), and summing over k gives U(ρ) = ρ (hP.complete). The two columns meet in the green LEAN ✓ unreadState_fixed_iff at the bottom.</title>
