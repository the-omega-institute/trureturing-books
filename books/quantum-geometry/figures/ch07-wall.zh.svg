<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch07-wall" data-lang="zh" viewBox="0 0 420 330" width="420" height="330" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一个单位球。赤道上两点 m₀ 与 m₁ 相隔 90°，它们之间的赤道弧是品红的，标着 90°。上方一点 a 是琥珀色的锚点，从 a 到 m₀、从 a 到 m₁ 各有一段青色的大圆弧，每段标着 ≤ Eτ/ℏ。两段青色弧加起来比品红的 90° 弧长。">
<title>一个单位球。赤道上两点 m₀ 与 m₁ 相隔 90°，它们之间的赤道弧是品红的，标着 90°。上方一点 a 是琥珀色的锚点，从 a 到 m₀、从 a 到 m₁ 各有一段青色的大圆弧，每段标着 ≤ Eτ/ℏ。两段青色弧加起来比品红的 90° 弧长。</title>
