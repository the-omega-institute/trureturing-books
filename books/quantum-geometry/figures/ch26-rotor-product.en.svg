<title>Four panels, each the same small chart: four violet bars for the coefficients of 1, e₁₂, e₁₃, e₂₃, up for positive and down for negative. The first three are R_z(0.37), R_y(−0.81), R_z(0.52), with two bars each: scalars about 0.98, 0.92, 0.97, and −0.18 on e₁₂, −0.39 on e₁₃, −0.26 on e₁₂. The fourth is the product R, with all four bars nonzero: 0.83, −0.40, −0.39, 0.03. Under every title: Σc² = 1.</title>
