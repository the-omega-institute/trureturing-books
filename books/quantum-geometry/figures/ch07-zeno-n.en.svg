<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch07-zeno-n" data-lang="en" viewBox="0 0 500 290" width="500" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the number of measurements N on a log scale from 1 to 64; the vertical axis is the chance of staying in |0⟩ all the way. The cyan curve is P_N = [cos²(π/2N)]^N, and four cyan points mark N = 1, 4, 16, 64 at 0, 0.531, 0.857 and 0.962. The grey dashed curve is the approximation 1 − π²/4N, which hugs the cyan curve as N grows; both climb towards 1 at the top.">
<title>The horizontal axis is the number of measurements N on a log scale from 1 to 64; the vertical axis is the chance of staying in |0⟩ all the way. The cyan curve is P_N = [cos²(π/2N)]^N, and four cyan points mark N = 1, 4, 16, 64 at 0, 0.531, 0.857 and 0.962. The grey dashed curve is the approximation 1 − π²/4N, which hugs the cyan curve as N grows; both climb towards 1 at the top.</title>
