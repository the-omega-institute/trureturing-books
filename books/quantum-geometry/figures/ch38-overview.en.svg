<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch38-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: a still memory array of seven columns and five rows, one cell amber, the current cell; below it the pointer register ptr sends a cyan beam onto that cell, marked *ptr, and a dashed arrow points to the next cell on the right, marked ptr++. Panel II: one page &amp;State at the top, with three cyan arrows from ptr_A, ptr_B and ptr_C below all pointing at it; beside it a dashed copy of the page is struck out, marked memcpy. Panel III: a four-slot page directory P whose slot 0 holds 0x1000; a cyan arrow leaves slot 0 and loops back into P itself, marked p = *p; slots 1, 2 and 3 each send an arrow to the leaf tables T₁, T₂, T₃ on the right.">
<title>Three panels. Panel I: a still memory array of seven columns and five rows, one cell amber, the current cell; below it the pointer register ptr sends a cyan beam onto that cell, marked *ptr, and a dashed arrow points to the next cell on the right, marked ptr++. Panel II: one page &amp;State at the top, with three cyan arrows from ptr_A, ptr_B and ptr_C below all pointing at it; beside it a dashed copy of the page is struck out, marked memcpy. Panel III: a four-slot page directory P whose slot 0 holds 0x1000; a cyan arrow leaves slot 0 and loops back into P itself, marked p = *p; slots 1, 2 and 3 each send an arrow to the leaf tables T₁, T₂, T₃ on the right.</title>
