<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch38-two-endings" data-lang="en" viewBox="0 0 460 286" width="460" height="286" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A plot with the step k across and cos θ up, from 0 to 1. Two paths leave the same point, cos θ ≈ 0.89. A magenta continuous curve slides down and meets the axis at k = 5, where a cross is marked ptr = NULL. A string of cyan points falls step by step as cos θ_k = sech η_k, creeping ever closer to the axis but with every point above it, labelled sech η_k &gt; 0.">
<title>A plot with the step k across and cos θ up, from 0 to 1. Two paths leave the same point, cos θ ≈ 0.89. A magenta continuous curve slides down and meets the axis at k = 5, where a cross is marked ptr = NULL. A string of cyan points falls step by step as cos θ_k = sech η_k, creeping ever closer to the axis but with every point above it, labelled sech η_k &gt; 0.</title>
