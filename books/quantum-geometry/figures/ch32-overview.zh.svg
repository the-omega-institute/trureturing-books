<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch32-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：两支墨色单位箭头 A 与 B 夹角 θ；B 投到 A 上的青色影子是 A·B = cos θ，两支箭头张成的品红平行四边形是 A∧B，高为 sin θ。第二栏：一只盒子的角上三根轴：θ 从青色的“线”到品红的“面积”，η 从圆（光滑）到六边形（多面体），λ 从圈外的点（球外 C）到圈内的点（场内）。第三栏：一个球，观察者站在北极，青色虚线的视线各走四分之一圈落到赤道上，品红的赤道就是 90° 视界；左上方球外的点 C 被划掉。">
<title>三栏。第一栏：两支墨色单位箭头 A 与 B 夹角 θ；B 投到 A 上的青色影子是 A·B = cos θ，两支箭头张成的品红平行四边形是 A∧B，高为 sin θ。第二栏：一只盒子的角上三根轴：θ 从青色的“线”到品红的“面积”，η 从圆（光滑）到六边形（多面体），λ 从圈外的点（球外 C）到圈内的点（场内）。第三栏：一个球，观察者站在北极，青色虚线的视线各走四分之一圈落到赤道上，品红的赤道就是 90° 视界；左上方球外的点 C 被划掉。</title>
