<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch07-freeze-threshold" data-lang="en" viewBox="0 0 440 300" width="440" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the inverse temperature β and the vertical axis the entropy tax ΔS, with the passive energy ΔE_pass fixed at 1. The line ΔS = β·ΔE_pass splits the plane: below it is cyan, D &gt; 0; above it magenta, D &lt; 0. An amber dashed horizontal line at height ΔS = ½ crosses the line at β_c = ½ and enters the cyan region to the right.">
