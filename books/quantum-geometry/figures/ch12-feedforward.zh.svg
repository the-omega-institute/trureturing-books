<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch12-feedforward" data-lang="zh" viewBox="0 0 480 300" width="480" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一颗布洛赫球，紫色的线是 x 轴。两个点是第 2 颗比特在两种测量结果下的态：琥珀色的点是 s = 0 那一支，灰色的点是 s = 1 那一支，各占一半的概率。一支琥珀色的弯箭头从灰点出发，绕紫色的 x 轴转了半圈，落在琥珀色的点上：前馈的 X 把 s = 1 那一支修正成和 s = 0 一样的态。">
<title>一颗布洛赫球，紫色的线是 x 轴。两个点是第 2 颗比特在两种测量结果下的态：琥珀色的点是 s = 0 那一支，灰色的点是 s = 1 那一支，各占一半的概率。一支琥珀色的弯箭头从灰点出发，绕紫色的 x 轴转了半圈，落在琥珀色的点上：前馈的 X 把 s = 1 那一支修正成和 s = 0 一样的态。</title>
