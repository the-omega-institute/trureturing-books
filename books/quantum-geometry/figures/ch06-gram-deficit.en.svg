<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch06-gram-deficit" data-lang="en" data-wrap="1" viewBox="0 0 520 300" width="520" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Left: a grey arrow u and an amber arrow v of different lengths span a magenta parallelogram of area |u∧v|. Right: a right triangle whose horizontal leg is |u·v|, vertical leg |u∧v| and hypotenuse |u||v|, with a square standing on each side: cyan (u·v)², magenta |u∧v|², and |u|²|v|² on the hypotenuse. The two small squares add up to the large one exactly; the magenta square is the gap between the two sides of the Cauchy–Schwarz inequality.">
