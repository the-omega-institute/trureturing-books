<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch21-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 272" width="740" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: two boxes are the two fibers of the latent coordinate; the left one holds a₀, a₁, a₂ in a column, the right one only a₃. A dashed magenta line cuts across the left box, splitting it into a₀, a₁ above (g = 1) and a₂ below (g = 0). Panel II: a magenta helix climbs turn after turn around the violet vertical axis e_{n+1}; beneath it is its cyan shadow, a closed circle. After one turn the shadow is back at its starting point while the helix stands 2πc higher. Panel III: nine small circles S⁰ to S⁸ in three rows; S⁰, S¹, S³, S⁷ are violet and labelled ℝ, ℂ, ℍ, 𝕆; S² is marked “hairy ball: must vanish”. This panel is a literature result.">
<title>Three panels. Panel I: two boxes are the two fibers of the latent coordinate; the left one holds a₀, a₁, a₂ in a column, the right one only a₃. A dashed magenta line cuts across the left box, splitting it into a₀, a₁ above (g = 1) and a₂ below (g = 0). Panel II: a magenta helix climbs turn after turn around the violet vertical axis e_{n+1}; beneath it is its cyan shadow, a closed circle. After one turn the shadow is back at its starting point while the helix stands 2πc higher. Panel III: nine small circles S⁰ to S⁸ in three rows; S⁰, S¹, S³, S⁷ are violet and labelled ℝ, ℂ, ℍ, 𝕆; S² is marked “hairy ball: must vanish”. This panel is a literature result.</title>
