<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 262" width="740" height="262" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏。第一栏：两支墨色箭头 x、y 撑开一个平行四边形，两条青色的对角线是 x + y 与 x − y，下方写着两条对角线的平方和等于四条边的平方和。第二栏：四个坐标排成一行，每个圆里一支紫色的相位箭头，四支方向相同；三条青色的弧各连起相邻的两个坐标，表示某个测试态在这两格上同时不为零，弧连成一条链，下方写着 A = c · 1。第三栏：左边是 3 × 3 的块矩阵 ρ，对角块青色，非对角块品红；箭头“挤压”指向右边只剩青色对角块的矩阵，它下方的小圈箭头表示再挤压一次，矩阵不动。">
<title>三栏。第一栏：两支墨色箭头 x、y 撑开一个平行四边形，两条青色的对角线是 x + y 与 x − y，下方写着两条对角线的平方和等于四条边的平方和。第二栏：四个坐标排成一行，每个圆里一支紫色的相位箭头，四支方向相同；三条青色的弧各连起相邻的两个坐标，表示某个测试态在这两格上同时不为零，弧连成一条链，下方写着 A = c · 1。第三栏：左边是 3 × 3 的块矩阵 ρ，对角块青色，非对角块品红；箭头“挤压”指向右边只剩青色对角块的矩阵，它下方的小圈箭头表示再挤压一次，矩阵不动。</title>
