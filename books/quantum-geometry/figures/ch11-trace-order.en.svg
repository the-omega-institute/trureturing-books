<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch11-trace-order" data-lang="en" viewBox="0 0 480 300" width="480" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Log-log axes, with the step t from 0.01 to 1 on the horizontal axis. Three lines: the magenta line is the imaginary part of the trace of the three ordered pulse kernels, with slope approaching 1 as t→0, growing like t for small t; the cyan line is the deviation of the real part from Tr(ABC), with slope approaching 2 as t→0, growing like t² for small t and far below the magenta line at small t; the green line is the proposition&#x27;s bound (5/4)L⁵t², and the cyan line stays below it throughout. The three matrices are real symmetric 2 × 2 matrices of Frobenius norm 1.">
<title>Log-log axes, with the step t from 0.01 to 1 on the horizontal axis. Three lines: the magenta line is the imaginary part of the trace of the three ordered pulse kernels, with slope approaching 1 as t→0, growing like t for small t; the cyan line is the deviation of the real part from Tr(ABC), with slope approaching 2 as t→0, growing like t² for small t and far below the magenta line at small t; the green line is the proposition&#x27;s bound (5/4)L⁵t², and the cyan line stays below it throughout. The three matrices are real symmetric 2 × 2 matrices of Frobenius norm 1.</title>
