<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch28-rank-one-chain" data-lang="zh" viewBox="0 0 460 418" width="460" height="418" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一条自上而下的重写链。recordWeight P ρ k 依次改写为 Tr(ρP_k)（recordWeight、bornProbability），Tr(|ψ⟩⟨ψ| · |φ⟩⟨φ|)（hPureState、hProjection），⟨ψ|φ⟩ · Tr(|ψ⟩⟨φ|)（vecMulVec_mul_vecMulVec），⟨ψ|φ⟩ · ⟨φ|ψ⟩（trace_vecMulVec、dotProduct_smul），conj(z) · z，其中 z = ⟨φ|ψ⟩（dotProduct_comm、star_dotProduct、smul_eq_mul），最后得到 |z|²（normSq_eq_conj_mul_self、normSq_eq_norm_sq）。链的终点是底部绿色的 LEAN ✓ rank_one_pure_state_modulus_square_reduction。">
