<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="appb-spacetime-split" data-lang="en" viewBox="0 0 440 346" width="440" height="346" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The left column holds the eight blades of the even part of the spacetime algebra Cl₁,₃, the right column the eight blades of Cl₃,₀; a line joins each row, and the last column gives the square, the same on both sides. 1 goes to 1, square +1. The three time–space bivectors σₖ = γₖγ₀ (grade 2 in spacetime) go to the three vectors e₁, e₂, e₃ (grade 1), joined in cyan, square +1. The three purely spatial bivectors σ₁σ₂ = −γ₁γ₂, σ₁σ₃ = −γ₁γ₃, σ₂σ₃ = −γ₂γ₃ go to e₁₂, e₁₃, e₂₃, joined in magenta, square −1. The four-dimensional pseudoscalar σ₁σ₂σ₃ = γ₀γ₁γ₂γ₃ (grade 4) goes to e₁₂₃ (grade 3), joined in violet, square −1. Above, the squares of the generators: γ₀² = +1, γ₁² = γ₂² = γ₃² = −1.">
<title>The left column holds the eight blades of the even part of the spacetime algebra Cl₁,₃, the right column the eight blades of Cl₃,₀; a line joins each row, and the last column gives the square, the same on both sides. 1 goes to 1, square +1. The three time–space bivectors σₖ = γₖγ₀ (grade 2 in spacetime) go to the three vectors e₁, e₂, e₃ (grade 1), joined in cyan, square +1. The three purely spatial bivectors σ₁σ₂ = −γ₁γ₂, σ₁σ₃ = −γ₁γ₃, σ₂σ₃ = −γ₂γ₃ go to e₁₂, e₁₃, e₂₃, joined in magenta, square −1. The four-dimensional pseudoscalar σ₁σ₂σ₃ = γ₀γ₁γ₂γ₃ (grade 4) goes to e₁₂₃ (grade 3), joined in violet, square −1. Above, the squares of the generators: γ₀² = +1, γ₁² = γ₂² = γ₃² = −1.</title>
