<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-ray-skeleton" data-lang="zh" viewBox="0 0 460 448" width="460" height="448" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="证明骨架图，自上而下。虚线框是私有引理 coordinate_shape_of_connected_ray_tests，里面三步：由前提“坐标射线不变”得到非对角元 A_{ij} = 0（hoff）；由前提“测试射线不变”得到支撑重叠的两格 A_{ii} = A_{jj}（hstep，用 sum_eq_single 与 mul_right_cancel₀）；由前提“支撑连通”沿 ReflTransGen 归纳，得到所有对角元相等。框下分两支（isEmpty_or_nonempty）：ι 为空时取 c = 1；ι 非空时取 c = A_{bb}，再由前提“A 幺正”得到 |c| = 1。两支汇入底部绿色的 LEAN ✓ unitary_phase_of_connected_ray_tests。">
<title>证明骨架图，自上而下。虚线框是私有引理 coordinate_shape_of_connected_ray_tests，里面三步：由前提“坐标射线不变”得到非对角元 A_{ij} = 0（hoff）；由前提“测试射线不变”得到支撑重叠的两格 A_{ii} = A_{jj}（hstep，用 sum_eq_single 与 mul_right_cancel₀）；由前提“支撑连通”沿 ReflTransGen 归纳，得到所有对角元相等。框下分两支（isEmpty_or_nonempty）：ι 为空时取 c = 1；ι 非空时取 c = A_{bb}，再由前提“A 幺正”得到 |c| = 1。两支汇入底部绿色的 LEAN ✓ unitary_phase_of_connected_ray_tests。</title>
