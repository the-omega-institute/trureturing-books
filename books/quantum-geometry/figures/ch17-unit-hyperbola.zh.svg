<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch17-unit-hyperbola" data-lang="zh" viewBox="0 0 480 320" width="480" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="时空图，x 向右、t 向上。青色的曲线是单位双曲线 t² − x² = 1，两条白色虚线是光锥 t = ±x。琥珀色的点是 η = ln 2 时的 (t, x) = (cosh η, sinh η) = (5/4, 3/4)：从它向 t 轴的水平虚线长 3/4，向 x 轴的竖直虚线长 5/4，两者平方差正好是 1。从原点射向这个点的琥珀色射线每走 5 个时间单位横移 3 个，即 β = 3/5。">
<title>时空图，x 向右、t 向上。青色的曲线是单位双曲线 t² − x² = 1，两条白色虚线是光锥 t = ±x。琥珀色的点是 η = ln 2 时的 (t, x) = (cosh η, sinh η) = (5/4, 3/4)：从它向 t 轴的水平虚线长 3/4，向 x 轴的竖直虚线长 5/4，两者平方差正好是 1。从原点射向这个点的琥珀色射线每走 5 个时间单位横移 3 个，即 β = 3/5。</title>
