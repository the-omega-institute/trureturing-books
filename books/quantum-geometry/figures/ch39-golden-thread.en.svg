<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch39-golden-thread" data-lang="en" viewBox="0 0 460 300" width="460" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Eight rows, readout levels l = 0 to 7 from top to bottom. Each row is the same stretch of the number line, with two ink ticks at a = 0.50 and b = 0.55; the cyan cells are the readout cells holding them at that level, narrower row by row. For l = 0 to 4 both numbers sit in one cell and the columns a and b on the right show the same Zeckendorf word (b in grey); from l = 5 on, a magenta cell boundary falls between them, each has its own cell, and the two columns show different words, for example 1000 and 1001 at l = 5.">
<title>Eight rows, readout levels l = 0 to 7 from top to bottom. Each row is the same stretch of the number line, with two ink ticks at a = 0.50 and b = 0.55; the cyan cells are the readout cells holding them at that level, narrower row by row. For l = 0 to 4 both numbers sit in one cell and the columns a and b on the right show the same Zeckendorf word (b in grey); from l = 5 on, a magenta cell boundary falls between them, each has its own cell, and the two columns show different words, for example 1000 and 1001 at l = 5.</title>
