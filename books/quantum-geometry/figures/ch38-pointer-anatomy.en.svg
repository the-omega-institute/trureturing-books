<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch38-pointer-anatomy" data-lang="en" viewBox="0 0 460 372" width="460" height="372" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="On the left, a pointer register standing upright, cut into five fields: 1 Base, 2 MMU bounds, 3 the superposed pointer Σ α_k |addr_k⟩, 4 TLB, 5 &amp;State. To the right of each field, a small sketch and a phrase. Field 1: a patch of lattice points and an arrow marked u moving from the corner of the lattice to a shifted origin, &#x27;first-person origin&#x27;. Field 2: a row of cells with three in the middle boxed in; an arrow leaving the box is struck out, &#x27;waking sandbox&#x27;. Field 3: one point sends three cyan arrows to three cells at once, &#x27;dream: many paths&#x27;. Field 4: a row of points joined by small grey dashed hops, with one cyan arc going straight from the first to the last, &#x27;a learned shortcut&#x27;. Field 5: two cyan arrows point at one page; beside it a dashed copy of the page is struck out, &#x27;one page, no copies&#x27;.">
<title>On the left, a pointer register standing upright, cut into five fields: 1 Base, 2 MMU bounds, 3 the superposed pointer Σ α_k |addr_k⟩, 4 TLB, 5 &amp;State. To the right of each field, a small sketch and a phrase. Field 1: a patch of lattice points and an arrow marked u moving from the corner of the lattice to a shifted origin, &#x27;first-person origin&#x27;. Field 2: a row of cells with three in the middle boxed in; an arrow leaving the box is struck out, &#x27;waking sandbox&#x27;. Field 3: one point sends three cyan arrows to three cells at once, &#x27;dream: many paths&#x27;. Field 4: a row of points joined by small grey dashed hops, with one cyan arc going straight from the first to the last, &#x27;a learned shortcut&#x27;. Field 5: two cyan arrows point at one page; beside it a dashed copy of the page is struck out, &#x27;one page, no copies&#x27;.</title>
