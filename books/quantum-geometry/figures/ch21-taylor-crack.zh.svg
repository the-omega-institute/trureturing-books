<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch21-taylor-crack" data-lang="zh" viewBox="0 0 440 300" width="440" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="坐标图，横轴 θ 从 0 到 3.5，纵轴从 −1.6 到 1.3。墨色的粗曲线是 cos θ。三条青色曲线是只取前 N 项的余弦多项式，N = 2、3、4：在 θ 小时都与 cos θ 重合，往右依次在越来越远处离开它。N = 3 那条与 cos θ 之间的缝涂成品红，标着 R₆(θ)；它在左端薄得看不见，往右越张越大。">
<title>坐标图，横轴 θ 从 0 到 3.5，纵轴从 −1.6 到 1.3。墨色的粗曲线是 cos θ。三条青色曲线是只取前 N 项的余弦多项式，N = 2、3、4：在 θ 小时都与 cos θ 重合，往右依次在越来越远处离开它。N = 3 那条与 cos θ 之间的缝涂成品红，标着 R₆(θ)；它在左端薄得看不见，往右越张越大。</title>
