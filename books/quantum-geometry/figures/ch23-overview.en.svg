<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch23-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 290" width="740" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: the hexagonal Eisenstein lattice; the cyan circle of norm 7 passes through 12 lattice points; two magenta parallelograms are the cells spanned by the two basis vectors at t = −1 and t = 2, one upright, one sheared, with the same area. Panel II: the (g, ḡ) plane with two magenta hyperbolas gḡ = +1 and gḡ = −1; the golden units φⁿ land alternately on the two branches, labelled (2, 0), (1, 1), (3, 1), (4, 2), the Lucas and Fibonacci numbers. Panel III: rational numbers laid out in rows by denominator 1 to 6, denser row by row; the top row of large cyan dots, denominator 1, is the integers. Below, a violet tag gives the literature result (Koenigsmann 2016 defines ℤ with universal quantifiers) and a red tag the open question (whether existential quantifiers alone suffice).">
<title>Three panels. Panel I: the hexagonal Eisenstein lattice; the cyan circle of norm 7 passes through 12 lattice points; two magenta parallelograms are the cells spanned by the two basis vectors at t = −1 and t = 2, one upright, one sheared, with the same area. Panel II: the (g, ḡ) plane with two magenta hyperbolas gḡ = +1 and gḡ = −1; the golden units φⁿ land alternately on the two branches, labelled (2, 0), (1, 1), (3, 1), (4, 2), the Lucas and Fibonacci numbers. Panel III: rational numbers laid out in rows by denominator 1 to 6, denser row by row; the top row of large cyan dots, denominator 1, is the integers. Below, a violet tag gives the literature result (Koenigsmann 2016 defines ℤ with universal quantifiers) and a red tag the open question (whether existential quantifiers alone suffice).</title>
