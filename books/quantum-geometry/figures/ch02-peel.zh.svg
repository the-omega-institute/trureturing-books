<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-peel" data-lang="zh" data-wrap="1" viewBox="0 0 560 310" width="560" height="310" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="左右两颗布洛赫球，都从侧面看，北极朝上，按读数大小上了青色的明暗带。左球是读数 f：最亮处在右上方的方向 s，一枚琥珀色的点标着 p₁、权重 0.7；对跖的左下方最暗，标着 0.2。右球是剥去 0.7 e_{p₁} 之后的余项：s 处变成零、最暗，最亮处移到左下方的 −s，琥珀色的点标着 p₂、权重 0.2。底下一行写着 E = 0.7 p₁ + 0.2 p₂。">
<title>左右两颗布洛赫球，都从侧面看，北极朝上，按读数大小上了青色的明暗带。左球是读数 f：最亮处在右上方的方向 s，一枚琥珀色的点标着 p₁、权重 0.7；对跖的左下方最暗，标着 0.2。右球是剥去 0.7 e_{p₁} 之后的余项：s 处变成零、最暗，最亮处移到左下方的 −s，琥珀色的点标着 p₂、权重 0.2。底下一行写着 E = 0.7 p₁ + 0.2 p₂。</title>
