<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch15-overview" data-lang="en" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Three panels. Panel I: the success direction W points up and the failure direction B to the right; an arrow U makes 30° with B, and one step turns it through the violet 2θ = 60° so that the amber arrow lands exactly on W. Panel II: three round gears with 2, 4 and 8 teeth; for x = 5 their amber pointers sit at π, π/2 and 5π/4. Panel III: a bar chart over 16 frequencies; only 0, 4, 8 and 12 carry equal cyan bars of height 1/4, the rest are zero.">
<title>Three panels. Panel I: the success direction W points up and the failure direction B to the right; an arrow U makes 30° with B, and one step turns it through the violet 2θ = 60° so that the amber arrow lands exactly on W. Panel II: three round gears with 2, 4 and 8 teeth; for x = 5 their amber pointers sit at π, π/2 and 5π/4. Panel III: a bar chart over 16 frequencies; only 0, 4, 8 and 12 carry equal cyan bars of height 1/4, the rest are zero.</title>
