<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-shutter" data-lang="zh" viewBox="0 0 450 230" width="450" height="230" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="示意图。左边是一只飞轮，轮缘一圈细刻度表示方向可以停在任意角度，琥珀色的箭头是此刻的方向。中间是一道竖直的快门，沿 e₃ 劈成上下两条通道。右边只有两个出口：上通道记作 +1，下通道记作 −1，各是一个青色的点。">
<title>示意图。左边是一只飞轮，轮缘一圈细刻度表示方向可以停在任意角度，琥珀色的箭头是此刻的方向。中间是一道竖直的快门，沿 e₃ 劈成上下两条通道。右边只有两个出口：上通道记作 +1，下通道记作 −1，各是一个青色的点。</title>
