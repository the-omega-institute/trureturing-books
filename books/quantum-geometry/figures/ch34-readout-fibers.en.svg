<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch34-readout-fibers" data-lang="en" viewBox="0 0 400 345" width="400" height="345" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The e₁–e₂ plane. The amber arrow O points up and to the left; a family of parallel cyan dashed lines perpendicular to it are the fibers of equal reading, one of them drawn solid. The filled dot s_once on the vertical axis and the hollow ring s_twice on the left of the horizontal axis both lie on that solid fiber, and the magenta segment joining them runs along it; the fiber crosses O at the cyan reading 0.61.">
<title>The e₁–e₂ plane. The amber arrow O points up and to the left; a family of parallel cyan dashed lines perpendicular to it are the fibers of equal reading, one of them drawn solid. The filled dot s_once on the vertical axis and the hollow ring s_twice on the left of the horizontal axis both lie on that solid fiber, and the magenta segment joining them runs along it; the fiber crosses O at the cyan reading 0.61.</title>
