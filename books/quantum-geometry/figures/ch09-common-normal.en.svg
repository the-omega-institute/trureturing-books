<title>Two panels. Left: two arrows a and b of different lengths, not perpendicular; the magenta disc is the plane they span, and a violet arrow n stands perpendicular to it, with −n dashed at the other end. Right: a and b lie on one line, pointing opposite ways; the unit vectors perpendicular to them fill a whole violet circle, with six violet arrows drawn to it.</title>
