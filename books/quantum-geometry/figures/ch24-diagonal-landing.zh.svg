<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-diagonal-landing" data-lang="zh" data-wrap="1" viewBox="0 0 560 300" width="560" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="两栏，各是同一张三行三列的列表 g：第 0 行 0 1 2，第 1 行 1 2 2，第 2 行 2 2 2，对角线三格 0、2、2 加了粗框。表下一行是扭过的对角线。左栏用 f₁（0→1，1→2，2→2）：扭过的对角线是 1 2 2，与第 1 行一模一样，第 1 行与它都是青色，落点在第 1 行第 1 列，那里的值 2 是 f₁ 的不动点。右栏用循环 f₂（0→1→2→0）：扭过的对角线是 1 0 0，品红色，每一行在对角线那一格上都与它不同（打叉），它不是任何一行。">
<title>两栏，各是同一张三行三列的列表 g：第 0 行 0 1 2，第 1 行 1 2 2，第 2 行 2 2 2，对角线三格 0、2、2 加了粗框。表下一行是扭过的对角线。左栏用 f₁（0→1，1→2，2→2）：扭过的对角线是 1 2 2，与第 1 行一模一样，第 1 行与它都是青色，落点在第 1 行第 1 列，那里的值 2 是 f₁ 的不动点。右栏用循环 f₂（0→1→2→0）：扭过的对角线是 1 0 0，品红色，每一行在对角线那一格上都与它不同（打叉），它不是任何一行。</title>
