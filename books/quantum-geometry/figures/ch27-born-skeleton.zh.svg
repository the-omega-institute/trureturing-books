<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch27-born-skeleton" data-lang="zh" viewBox="0 0 460 346" width="460" height="346" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="证明骨架图，自上而下。左侧虚线框的前提 Tr ρ = 1 引出第①路：Tr(ρ · 1) = 1，用 simpa … using hTrace。第②路：可加，用 Matrix.mul_add，不需要前提。右侧第③路从前提 ρ ⪰ 0 出发，三步向下：PρP∗ ⪰ 0（mul_mul_conjTranspose_same），Tr(PρP∗) = Tr(ρP)（trace_mul_cycle，此处用到前提 P∗ = P、P² = P），0 ≤ Tr(ρP)（trace_nonneg）。三路汇入底部绿色的 LEAN ✓ born_probability_skeleton。">
<title>证明骨架图，自上而下。左侧虚线框的前提 Tr ρ = 1 引出第①路：Tr(ρ · 1) = 1，用 simpa … using hTrace。第②路：可加，用 Matrix.mul_add，不需要前提。右侧第③路从前提 ρ ⪰ 0 出发，三步向下：PρP∗ ⪰ 0（mul_mul_conjTranspose_same），Tr(PρP∗) = Tr(ρP)（trace_mul_cycle，此处用到前提 P∗ = P、P² = P），0 ≤ Tr(ρP)（trace_nonneg）。三路汇入底部绿色的 LEAN ✓ born_probability_skeleton。</title>
