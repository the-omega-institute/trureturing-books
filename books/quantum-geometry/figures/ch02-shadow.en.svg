<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch02-shadow" data-lang="en" viewBox="0 0 500 296" width="500" height="296" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The cyan line is the line of the known state a; the amber unit arrow b makes an angle θ = 50° with it. Dropping a perpendicular from the tip of b onto a gives the foot, marked C. The thick cyan segment from the origin to C is the shadow c = (a·b)a, of length cos θ; the dashed magenta segment from C to the tip of b is the perpendicular remainder b − c, of length sin θ, at a right angle to the cyan line.">
<title>The cyan line is the line of the known state a; the amber unit arrow b makes an angle θ = 50° with it. Dropping a perpendicular from the tip of b onto a gives the foot, marked C. The thick cyan segment from the origin to C is the shadow c = (a·b)a, of length cos θ; the dashed magenta segment from C to the tip of b is the perpendicular remainder b − c, of length sin θ, at a right angle to the cyan line.</title>
