<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch24-three-speeds" data-lang="en" data-wrap="1" viewBox="0 0 600 300" width="600" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two panels, both with the base-10 logarithm of the error going up. Left, against the step k: the cyan points, repeated cosine, lie on a straight slanted line, going down the same small notch each step along the dashed line of slope lg 0.674, and pass 10⁻¹⁰ only at step 55; the magenta points, Newton&#x27;s method, reach 10⁻², 10⁻⁵, 10⁻¹⁰ and 10⁻²¹ at steps 1, 2, 3, 4, steeper each time. Right, against the base-10 logarithm of the denominator b: seven points are the residuals |cos q − q| of the convergents 2/3, 3/4, 14/19, 17/23, 694/939, 711/962, 7093/9597 of θ*, all under the dashed bound (1 + sin 1)/b², falling as the denominator grows but never reaching zero.">
<title>Two panels, both with the base-10 logarithm of the error going up. Left, against the step k: the cyan points, repeated cosine, lie on a straight slanted line, going down the same small notch each step along the dashed line of slope lg 0.674, and pass 10⁻¹⁰ only at step 55; the magenta points, Newton&#x27;s method, reach 10⁻², 10⁻⁵, 10⁻¹⁰ and 10⁻²¹ at steps 1, 2, 3, 4, steeper each time. Right, against the base-10 logarithm of the denominator b: seven points are the residuals |cos q − q| of the convergents 2/3, 3/4, 14/19, 17/23, 694/939, 711/962, 7093/9597 of θ*, all under the dashed bound (1 + sin 1)/b², falling as the denominator grows but never reaching zero.</title>
