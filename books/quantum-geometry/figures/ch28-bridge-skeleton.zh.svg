<title>证明骨架图。底部绿色的 LEAN ✓ rank_one_born_pairing_weight 由三路汇入：第①路是绿色的上一条定理“秩一归约”；第②路“= Tr(ρP_k)”用 rfl；第③路“U(ρ) = Σ w_j ρ_j”用 unread_eq_weighted_ensemble，它上方分两种情形：w_j ≠ 0 时用 smul_smul 与 mul_inv_cancel₀ 得到 w_j ρ_j = P_jρP_j；w_j = 0 时用 compressed_eq_zero_of_recordWeight_eq_zero 得到 P_jρP_j = 0，这一支还用到虚线圈里的前提 ρ ⪰ 0。</title>
