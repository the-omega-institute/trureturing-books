<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch04-overview" data-lang="zh" data-wrap="1" viewBox="0 0 740 270" width="740" height="270" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="三栏，都是布洛赫球的竖直截面。第一栏：一支虚线箭头从球心指到右侧球皮上的 |+⟩，琥珀色的箭头沿同一方向却只到 cos θ_env，停在球里。第二栏：青色的椭圆是振幅阻尼把球缩小并往北推之后的像；北极的 ρ 不动，+x 上的 σ 被拉向北方，两点之间的线从虚线变成更短的实线，T 从 0.707 缩到 0.433。第三栏：琥珀色的点从球皮上出发，先水平移到竖轴上，再沿竖轴落到紫色的球心 ½I。">
<title>三栏，都是布洛赫球的竖直截面。第一栏：一支虚线箭头从球心指到右侧球皮上的 |+⟩，琥珀色的箭头沿同一方向却只到 cos θ_env，停在球里。第二栏：青色的椭圆是振幅阻尼把球缩小并往北推之后的像；北极的 ρ 不动，+x 上的 σ 被拉向北方，两点之间的线从虚线变成更短的实线，T 从 0.707 缩到 0.433。第三栏：琥珀色的点从球皮上出发，先水平移到竖轴上，再沿竖轴落到紫色的球心 ½I。</title>
