<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch01-parallelogram" data-lang="en" viewBox="0 0 560 290" width="560" height="290" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two unit arrows x and y leave the same point 60° apart and span a parallelogram; no coordinate axes are drawn. The long diagonal x + y is a solid cyan line marked |x + y|² = 3; the short diagonal x − y is a dashed cyan line marked |x − y|² = 1. A quarter of their difference is ½, which is cos 60°.">
<title>Two unit arrows x and y leave the same point 60° apart and span a parallelogram; no coordinate axes are drawn. The long diagonal x + y is a solid cyan line marked |x + y|² = 3; the short diagonal x − y is a dashed cyan line marked |x − y|² = 1. A quarter of their difference is ½, which is cos 60°.</title>
