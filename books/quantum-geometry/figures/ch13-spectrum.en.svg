<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch13-spectrum" data-lang="en" viewBox="0 0 500 340" width="500" height="340" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="The horizontal axis is the area parameter N from 0 to 4; the vertical axis is the eigenvalue of the CHSH operator from −3 to 3. Four magenta curves are ±√(4 + N) and ±√(4 − N): at N = 0 they meet at ±2; as N grows the outer two open towards ±2√2 and the inner two close towards 0. Dim dashed lines mark ±2. At N = 1, 2 and 3 four magenta points give the spectra of three rows of the table, with √7 and 1 labelled at N = 3; the ends N = 0 and N = 4 are hollow points, with 2√2 labelled at N = 4.">
<title>The horizontal axis is the area parameter N from 0 to 4; the vertical axis is the eigenvalue of the CHSH operator from −3 to 3. Four magenta curves are ±√(4 + N) and ±√(4 − N): at N = 0 they meet at ±2; as N grows the outer two open towards ±2√2 and the inner two close towards 0. Dim dashed lines mark ±2. At N = 1, 2 and 3 four magenta points give the spectra of three rows of the table, with √7 and 1 labelled at N = 3; the ends N = 0 and N = 4 are hollow points, with 2√2 labelled at N = 4.</title>
