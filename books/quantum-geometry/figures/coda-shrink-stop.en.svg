<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="coda-shrink-stop" data-lang="en" viewBox="0 0 480 300" width="480" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Six rows of dots, S(0) to S(5) from top to bottom, each with eight places 0 to 7. S(0) has 7 cyan dots; in each next row the dots removed by that step are magenta crosses: S(1) keeps 5, S(2) keeps 3, S(3) keeps 2, and the rows after it no longer change. A column on the right gives the sizes 7, 5, 3, 2, 2, 2; a bracket from row 3 to the last row reads “no change”, and a green box below reads N = 3 ≤ |S(0)| = 7.">
