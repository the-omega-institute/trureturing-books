<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="ch20-er-epr" data-lang="en" viewBox="0 0 540 320" width="540" height="320" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Two schematic rows. Top row: on the left, two columns of 6 dots, the left and right boundary systems L and R, each L dot joined to the R dot opposite by a cyan dashed line, an entangled pair; in the middle a red “≟” and a red tag “ER = EPR OPEN”; on the right a side view of an Einstein–Rosen bridge, flaring at both ends and narrow in the middle. Bottom row: a single pair of dots joined by one cyan dashed line, an arrow to a small bridge that is crossed out, and the words: one Bell pair, no smooth bridge.">
<title>Two schematic rows. Top row: on the left, two columns of 6 dots, the left and right boundary systems L and R, each L dot joined to the R dot opposite by a cyan dashed line, an entangled pair; in the middle a red “≟” and a red tag “ER = EPR OPEN”; on the right a side view of an Einstein–Rosen bridge, flaring at both ends and narrow in the middle. Bottom row: a single pair of dots joined by one cyan dashed line, an arrow to a small bridge that is crossed out, and the words: one Bell pair, no smooth bridge.</title>
